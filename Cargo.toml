[package]
name = "ssh-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Stdio MCP server for operator-configured SSH authority"
publish = false

[dependencies]
rmcp = { version = "3.9.0", default-features = false, features = ["server", "macros", "transport-io"] }
openssh = { version = "0.11.6", default-features = false, features = ["native-mux"] }
openssh-sftp-client = { version = "0.15.12", default-features = false }
openssh-sftp-error = { version = "0.5.1", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "io-std", "sync", "time", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
clap = { version = "4", features = ["derive", "env"] }
toml = "0.9"
base64 = "0.22"
sha2 = { version = "0.11.1", default-features = false }
hex = "0.4.3"
bytes = "1"
futures-util = "0.3"
tempfile = "3"
thiserror = "2"

[dev-dependencies]
testcontainers = "0.28.0"
anyhow = "1"
indoc = "2"
shell-escape = "0.1.5"
nix = { version = "0.30.1", default-features = false, features = ["signal", "process", "user"] }
rmcp = { version = "3.9.0", default-features = false, features = ["client", "transport-child-process"] }
