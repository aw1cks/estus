[package]
name = "estus-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Stdio MCP server that gives AI agents structured, policy-gated Linux operations over your own SSH"
license = "AGPL-3.0-or-later"
repository = "https://github.com/aw1cks/estus"
readme = "README.md"
keywords = ["mcp", "ssh", "sre", "linux", "ai-agents"]
categories = ["command-line-utilities", "development-tools"]
# The crate ships the program and the catalog `build.rs` embeds, nothing else.
exclude = [
    "/.github/", "/.omp/", "/nix/", "/tests/", "/fuzz/", "/scripts/", "/python/",
    "/docs/", "/examples/", "/skills/", "/dist/", "/result",
    "/flake.nix", "/flake.lock", "/pyproject.toml", "/setup.py", "/MANIFEST.in",
    "/deny.toml", "/_typos.toml", "/clippy.toml", "/.git-blame-ignore-revs",
]

[lib]
name = "estus"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "estus"
path = "src/main.rs"
[dependencies]
rmcp = { version = "3.9.0", default-features = false, features = ["server", "macros", "transport-io"] }
openssh = { version = "0.11.6", default-features = false, features = ["native-mux"] }
openssh-sftp-client = { version = "0.15.12", default-features = false }
openssh-sftp-error = { version = "0.5.1", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "io-std", "sync", "time", "signal", "fs"] }
tokio-util = { version = "0.7", features = ["rt"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
schemars = "1"
clap = { version = "4", features = ["derive", "env"] }
toml = "0.9"
base64 = "0.22"
sha2 = { version = "0.11.1", default-features = false }
hex = "0.4.3"
bytes = "1"
futures-util = "0.3"
getrandom = "0.4.3"
tempfile = "3"
thiserror = "2"
nix = { version = "0.30.1", default-features = false, features = ["signal", "process", "user", "fs", "dir"] }
jsonschema = { version = "0.40", default-features = false }

[dev-dependencies]
testcontainers = "0.28.0"
anyhow = "1"
indoc = "2"
shell-escape = "0.1.5"
rmcp = { version = "3.9.0", default-features = false, features = ["client", "transport-child-process"] }
openssh-sftp-protocol = { version = "=0.26.1", default-features = false }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
await_holding_lock = "deny"
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"
