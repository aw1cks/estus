# Reviewed controller-owned native Python payload; no Ansible runtime required.
# Export, review payloads/observe_network_interface_stats/manifest.json and fixed policy, then catalog prepare.
# Preparation creates explicit source/adapter/contract/authority approval; activation never refreshes it.
mode = "headless"
capabilities = { named = true }
enabled_tools = ["observe_network_interface_stats"]
[targets.server]
ssh_host = "server-ordinary"
[automation.targets.server]
destination = "server-ordinary"
python = "/usr/bin/python3"
[tools.observe_network_interface_stats]
description = "network interface stats. Bounded Linux observations; operator-approved interfaces; no process attribution, flags, namespace execution or mutation."
revision = "1_native1"
targets = ["server"]
authority = "automation"
effects = ["read"]
execution = { kind = "native_payload", snapshot = "/etc/estus/observe_network_interface_stats.payload.json", source = "/etc/estus/payloads/observe_network_interface_stats/collector.py", no_log = false }
fixed_args = { "target_python" = "/usr/bin/python3", "operator_policy" = { "interfaces" = [], "destinations" = [], "ports" = [], "addresses" = [], "routes" = [], "neighbors" = [], "namespaces" = [], "dns_names" = [] } }
input_map = { "interface" = "interface" }
limits = { timeout_secs = 30 }
input_schema = { "type" = "object", "properties" = { "interface" = { "type" = "string", "minLength" = 1, "maxLength" = 15 } }, "required" = ["interface"], "additionalProperties" = false }
[tools.observe_network_interface_stats.result]
kind = "capability_projection"
fields = { "interface" = ["mcp_result", "interface"], "counters" = ["mcp_result", "counters"] }
max_bytes = 4096
max_items = 256
max_depth = 8
schema = { "type" = "object", "properties" = { "interface" = { "type" = "string", "maxLength" = 15 }, "counters" = { "type" = "object", "properties" = { "rx_bytes" = { "type" = "integer", "minimum" = 0, "maximum" = 9007199254740991 }, "rx_packets" = { "type" = "integer", "minimum" = 0, "maximum" = 9007199254740991 }, "rx_errors" = { "type" = "integer", "minimum" = 0, "maximum" = 9007199254740991 }, "rx_dropped" = { "type" = "integer", "minimum" = 0, "maximum" = 9007199254740991 }, "tx_bytes" = { "type" = "integer", "minimum" = 0, "maximum" = 9007199254740991 }, "tx_packets" = { "type" = "integer", "minimum" = 0, "maximum" = 9007199254740991 }, "tx_errors" = { "type" = "integer", "minimum" = 0, "maximum" = 9007199254740991 }, "tx_dropped" = { "type" = "integer", "minimum" = 0, "maximum" = 9007199254740991 } }, "required" = ["rx_bytes", "rx_packets", "rx_errors", "rx_dropped", "tx_bytes", "tx_packets", "tx_errors", "tx_dropped"], "additionalProperties" = false } }, "required" = ["interface", "counters"], "additionalProperties" = false }
