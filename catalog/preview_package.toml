# Check-mode preview for generic cross-distro package transitions via offline Ansible bundle.
mode = "headless"
capabilities = { named = true }
enabled_tools = ["preview_package"]

[targets.server]
ssh_host = "server-ordinary"

[automation.targets.server]
destination = "server-ordinary"
python = "/usr/bin/python3"

[automation.authorities.catalog]
ssh_config_file = "/etc/estus/catalog-ssh.conf"
become = { method = "sudo", user = "root" }

[automation.authorities.catalog.targets.server]
destination = "server-catalog"
python = "/usr/bin/python3"

[tools.preview_package]
description = "Preview generic OS package install, upgrade or removal in check mode via target-detected package manager (apt, dnf, dnf5, apk, zypper) without mutating packages."
revision = "1"
targets = ["server"]
authority = "automation:catalog"
effects = ["read"]
execution = { kind = "ansible_module", module = "ansible.builtin.package", no_log = false, check_mode = true, diff = true }
fixed_args = { update_cache = false }
input_map = { name = "name", version = "version", state = "state" }
limits = { timeout_secs = 60 }
input_schema = { type = "object", properties = { name = { type = "array", items = { type = "string", minLength = 1, maxLength = 128 }, minItems = 1, maxItems = 32 }, version = { type = "string", minLength = 1, maxLength = 96 }, state = { type = "string", enum = ["present", "absent", "latest"] } }, required = ["name", "state"], additionalProperties = false }

[tools.preview_package.result]
kind = "ansible_projection"
fields = { changed = ["changed"], diff = ["diff"] }
max_bytes = 4096
max_items = 64
max_depth = 5
schema = { type = "object", properties = { changed = { type = "boolean" }, diff = { type = "object", properties = { before = { type = "string", maxLength = 2048 }, after = { type = "string", maxLength = 2048 }, before_header = { type = "string", maxLength = 256 }, after_header = { type = "string", maxLength = 256 }, prepared = { type = "string", maxLength = 2048 } }, additionalProperties = false } }, required = ["changed"], additionalProperties = false }
