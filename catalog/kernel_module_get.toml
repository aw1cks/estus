# Explicit standalone opt-in. Read installed approved module metadata, dependencies and declared parameters. Signer metadata is not proof of trust, signature acceptance or loadability.
# Copy roles/kernel_module_get to /etc/estus/roles/kernel_module_get; review every file.
# Export this tool's input_schema/fixed_args/input_map to overlay.json, then:
# estus --config kernel_module_get.toml schema import-role kernel_module_get --role-path /etc/estus/roles/kernel_module_get --overlay overlay.json --output /etc/estus/kernel_module_get.schema.json
# Import is offline; review snapshot before startup activation. No implicit install/escalation.
# Provision /var/lib/estus/runner mode0700 for MCP; install optional pinned Runner runtime.
# Target prerequisites: Linux /usr/bin/python3; boot tools require actual EFI/systemd-boot + bootctl;
# module tools require installed kmod modinfo/modprobe and reviewed dummy/estus_catalog modules.
# estus_catalog is a harmless operator-installed fixture module, value:int mode0644; not auto-installed.
# Exact approved entries are estus-current.conf and estus-alternate.conf; change reviewed schema AND role to deploy elsewhere.
profile = "actions-only"
enabled_tools = ["kernel_module_get"]

[targets.server]
ssh_host = "server-ordinary"

[automation]
workspace_root = "/var/lib/estus/runner"
max_concurrent = 2
max_scratch_bytes = 16777216
max_scratch_files = 512

[automation.targets.server]
destination = "server-ordinary"
python = "/usr/bin/python3"

[tools.kernel_module_get]
description = "Read installed approved module metadata, dependencies and declared parameters. Signer metadata is not proof of trust, signature acceptance or loadability."
revision = "1"
targets = ["server"]
authority = "automation"
effects = ["read"]
execution = { kind = "ansible_role", snapshot = "/etc/estus/kernel_module_get.schema.json", role_path = "/etc/estus/kernel_module_get.schema.roles/kernel_module_get", no_log = false }
fixed_args = { target_python = "/usr/bin/python3" }
input_map = { "name" = "name" }
limits = { timeout_secs = 60 }
input_schema = { "type" = "object", "properties" = { "name" = { "type" = "string", "enum" = ["dummy", "estus_catalog"], "minLength" = 1, "maxLength" = 64 } }, "required" = ["name"], "additionalProperties" = false }
result = { kind = "ansible_projection", fields = { "boot_id" = ["mcp_result", "boot_id"], "source" = ["mcp_result", "source"], "unavailable" = ["mcp_result", "unavailable"], "observed_at" = ["mcp_result", "observed_at"], "name" = ["mcp_result", "name"], "metadata" = ["mcp_result", "metadata"], "loaded" = ["mcp_result", "loaded"], "signer_is_trust_proof" = ["mcp_result", "signer_is_trust_proof"] }, max_bytes = 4096, max_items = 256, max_depth = 8, schema = { "type" = "object", "properties" = { "boot_id" = { "type" = "string", "minLength" = 36, "maxLength" = 36 }, "source" = { "type" = "string", "maxLength" = 128 }, "unavailable" = { "type" = "array", "maxItems" = 32, "items" = { "type" = "string", "maxLength" = 128 } }, "observed_at" = { "type" = "string", "maxLength" = 32 }, "name" = { "type" = "string", "maxLength" = 64 }, "metadata" = { "type" = "object", "properties" = { "filename" = { "type" = "array", "maxItems" = 128, "items" = { "type" = "string", "maxLength" = 4096 } }, "name" = { "type" = "array", "maxItems" = 128, "items" = { "type" = "string", "maxLength" = 4096 } }, "license" = { "type" = "array", "maxItems" = 128, "items" = { "type" = "string", "maxLength" = 4096 } }, "description" = { "type" = "array", "maxItems" = 128, "items" = { "type" = "string", "maxLength" = 4096 } }, "depends" = { "type" = "array", "maxItems" = 128, "items" = { "type" = "string", "maxLength" = 4096 } }, "softdep" = { "type" = "array", "maxItems" = 128, "items" = { "type" = "string", "maxLength" = 4096 } }, "vermagic" = { "type" = "array", "maxItems" = 128, "items" = { "type" = "string", "maxLength" = 4096 } }, "signer" = { "type" = "array", "maxItems" = 128, "items" = { "type" = "string", "maxLength" = 4096 } }, "sig_key" = { "type" = "array", "maxItems" = 128, "items" = { "type" = "string", "maxLength" = 4096 } }, "sig_hashalgo" = { "type" = "array", "maxItems" = 128, "items" = { "type" = "string", "maxLength" = 4096 } }, "parm" = { "type" = "array", "maxItems" = 128, "items" = { "type" = "string", "maxLength" = 4096 } }, "parmtype" = { "type" = "array", "maxItems" = 128, "items" = { "type" = "string", "maxLength" = 4096 } } }, "required" = [], "additionalProperties" = false }, "loaded" = { "type" = "boolean" }, "signer_is_trust_proof" = { "type" = "boolean" } }, "required" = ["boot_id", "source", "unavailable", "observed_at", "name", "metadata", "loaded", "signer_is_trust_proof"], "additionalProperties" = false } }
