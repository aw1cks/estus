# Reviewed controller-owned native Python payload; no Ansible runtime required.
# Export, review payloads/kernel_module_get/manifest.json and fixed policy, then catalog prepare.
# Preparation creates explicit source/adapter/contract/authority approval; activation never refreshes it.
mode = "headless"
capabilities = { named = true }
enabled_tools = ["kernel_module_get"]

[targets.server]
ssh_host = "server-ordinary"

[automation.targets.server]
destination = "server-ordinary"
python = "/usr/bin/python3"

[tools.kernel_module_get]
description = "Read installed approved module metadata, dependencies and declared parameters. Signer metadata is not proof of trust, signature acceptance or loadability."
revision = "1_native1"
targets = ["server"]
authority = "automation"
effects = ["read"]
execution = { kind = "native_payload", snapshot = "/etc/estus/kernel_module_get.payload.json", source = "/etc/estus/payloads/kernel_module_get/collector.py", no_log = false }
fixed_args = { target_python = "/usr/bin/python3" }
input_map = { "name" = "name" }
limits = { timeout_secs = 60 }
input_schema = { "type" = "object", "properties" = { "name" = { "type" = "string", "enum" = ["dummy", "estus_catalog"], "minLength" = 1, "maxLength" = 64 } }, "required" = ["name"], "additionalProperties" = false }
result = { kind = "capability_projection", fields = { "boot_id" = ["mcp_result", "boot_id"], "source" = ["mcp_result", "source"], "unavailable" = ["mcp_result", "unavailable"], "observed_at" = ["mcp_result", "observed_at"], "name" = ["mcp_result", "name"], "metadata" = ["mcp_result", "metadata"], "loaded" = ["mcp_result", "loaded"], "signer_is_trust_proof" = ["mcp_result", "signer_is_trust_proof"] }, max_bytes = 4096, max_items = 256, max_depth = 8, schema = { "type" = "object", "properties" = { "boot_id" = { "type" = "string", "minLength" = 36, "maxLength" = 36 }, "source" = { "type" = "string", "maxLength" = 128 }, "unavailable" = { "type" = "array", "maxItems" = 32, "items" = { "type" = "string", "maxLength" = 128 } }, "observed_at" = { "type" = "string", "maxLength" = 32 }, "name" = { "type" = "string", "maxLength" = 64 }, "metadata" = { "type" = "object", "properties" = { "filename" = { "type" = "array", "maxItems" = 128, "items" = { "type" = "string", "maxLength" = 4096 } }, "name" = { "type" = "array", "maxItems" = 128, "items" = { "type" = "string", "maxLength" = 4096 } }, "license" = { "type" = "array", "maxItems" = 128, "items" = { "type" = "string", "maxLength" = 4096 } }, "description" = { "type" = "array", "maxItems" = 128, "items" = { "type" = "string", "maxLength" = 4096 } }, "depends" = { "type" = "array", "maxItems" = 128, "items" = { "type" = "string", "maxLength" = 4096 } }, "softdep" = { "type" = "array", "maxItems" = 128, "items" = { "type" = "string", "maxLength" = 4096 } }, "vermagic" = { "type" = "array", "maxItems" = 128, "items" = { "type" = "string", "maxLength" = 4096 } }, "signer" = { "type" = "array", "maxItems" = 128, "items" = { "type" = "string", "maxLength" = 4096 } }, "sig_key" = { "type" = "array", "maxItems" = 128, "items" = { "type" = "string", "maxLength" = 4096 } }, "sig_hashalgo" = { "type" = "array", "maxItems" = 128, "items" = { "type" = "string", "maxLength" = 4096 } }, "parm" = { "type" = "array", "maxItems" = 128, "items" = { "type" = "string", "maxLength" = 4096 } }, "parmtype" = { "type" = "array", "maxItems" = 128, "items" = { "type" = "string", "maxLength" = 4096 } } }, "required" = [], "additionalProperties" = false }, "loaded" = { "type" = "boolean" }, "signer_is_trust_proof" = { "type" = "boolean" } }, "required" = ["boot_id", "source", "unavailable", "observed_at", "name", "metadata", "loaded", "signer_is_trust_proof"], "additionalProperties" = false } }
