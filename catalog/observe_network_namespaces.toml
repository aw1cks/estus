[tools.observe_network_namespaces]
description = "List the operator-approved named network namespaces and their IDs. Use it to confirm which namespaces the site permits before inspecting or changing interfaces inside one. Namespace execution is never attempted here."
revision = "1_native1"
authority = "automation"
effects = ["read"]
execution = { kind = "native_payload", source = "/etc/estus/payloads/observe_network_namespaces/collector.py", no_log = false }
fixed_args = { "target_python" = "/usr/bin/python3" }

input_map = { "limit" = "limit" }
limits = { timeout_secs = 30 }
input_schema = { "type" = "object", "properties" = { "limit" = { "type" = "integer", "minimum" = 1, "maximum" = 16 } }, "required" = [], "additionalProperties" = false }
[tools.observe_network_namespaces.result]
kind = "capability_projection"
fields = { "entries" = ["mcp_result", "entries"], "scope" = ["mcp_result", "scope"], "truncated" = ["mcp_result", "truncated"] }
max_bytes = 4096
max_items = 256
max_depth = 8
schema = { "type" = "object", "properties" = { "entries" = { "type" = "array", "items" = { "type" = "object", "properties" = { "name" = { "type" = "string", "maxLength" = 64 }, "id" = { "type" = "integer", "minimum" = 0, "maximum" = 9007199254740991 } }, "required" = ["name"], "additionalProperties" = false }, "maxItems" = 16 }, "scope" = { "type" = "string", "const" = "approved_named_namespaces", "maxLength" = 32 }, "truncated" = { "type" = "boolean" } }, "required" = ["entries", "scope", "truncated"], "additionalProperties" = false }
