# Reviewed controller-owned native Python payload; no Ansible runtime required.
# Export, review payloads/observe_nic_channels/manifest.json and the fixed policy here, then enable it by name.
# Preparation creates explicit source/adapter/contract/authority approval; activation never refreshes it.
mode = "headless"
capabilities = { named = true }
enabled_tools = ["observe_nic_channels"]
[targets.server]
ssh_host = "server-ordinary"
[automation.targets.server]
destination = "server-ordinary"
python = "/usr/bin/python3"
[tools.observe_nic_channels]
description = "Actual selected driver observe_nic_channels fields; absent capabilities named, never fabricated zeros. Fixed ethtool command, no changes or duplicate setup offload features."
revision = "1_native1"
targets = ["server"]
authority = "automation"
effects = ["read"]
execution = { kind = "native_payload", source = "/etc/estus/payloads/observe_nic_channels/collector.py", no_log = false }
fixed_args = { target_python = "/usr/bin/python3" }
input_map = { "interface" = "interface" }
limits = { timeout_secs = 30 }
input_schema = { "type" = "object", "properties" = { "interface" = { "type" = "string", "minLength" = 1, "maxLength" = 15 } }, "required" = ["interface"], "additionalProperties" = false }
[tools.observe_nic_channels.result]
kind = "capability_projection"
fields = { "source" = ["mcp_result", "source"], "observed_at" = ["mcp_result", "observed_at"], "unavailable" = ["mcp_result", "unavailable"], "interface" = ["mcp_result", "interface"], "supported" = ["mcp_result", "supported"], "values" = ["mcp_result", "values"] , truncated = ["mcp_result", "truncated"], omitted_records = ["mcp_result", "omitted_records"] }
max_bytes = 4096
max_items = 256
max_depth = 8
schema = { "type" = "object", "properties" = { truncated = { type = "boolean" }, omitted_records = { type = "integer", minimum = 0, maximum = 9007199254740991 }, "source" = { "type" = "string", "maxLength" = 256 }, "observed_at" = { "type" = "string", "maxLength" = 64 }, "unavailable" = { "type" = "array", "items" = { "type" = "string", "maxLength" = 128 }, "maxItems" = 256 }, "interface" = { "type" = "string", "maxLength" = 15 }, "supported" = { "type" = "boolean" }, "values" = { "type" = "object", "properties" = { "maximum_rx" = { "type" = "string", "maxLength" = 4096 }, "maximum_tx" = { "type" = "string", "maxLength" = 4096 }, "maximum_other" = { "type" = "string", "maxLength" = 4096 }, "maximum_combined" = { "type" = "string", "maxLength" = 4096 }, "current_rx" = { "type" = "string", "maxLength" = 4096 }, "current_tx" = { "type" = "string", "maxLength" = 4096 }, "current_other" = { "type" = "string", "maxLength" = 4096 }, "current_combined" = { "type" = "string", "maxLength" = 4096 } }, "required" = [], "additionalProperties" = false } }, "required" = ["source", "observed_at", "unavailable", "interface", "supported", "values"], "additionalProperties" = false }
