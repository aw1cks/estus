# Reviewed controller-owned native Python payload; no Ansible runtime required.
# Export, review payloads/observe_kernel_state/manifest.json and the fixed policy here, then enable it by name.
# The site supplies targets, authority and fixed policy; the collector digest is checked at load.
mode = "headless"
capabilities = { named = true }
[selection]
allow = ["observe_kernel_state"]

[targets.server]
ssh_host = "server-ordinary"

[automation.targets.server]
destination = "server-ordinary"
python = "/usr/bin/python3"

[tools.observe_kernel_state]
description = "Read kernel taint, release, lockdown and module signature policy. Fields the kernel does not expose stay unavailable."
revision = "1_native1"
targets = ["server"]
authority = "automation"
effects = ["read"]
execution = { kind = "native_payload", source = "/etc/estus/payloads/observe_kernel_state/collector.py", no_log = false }
fixed_args = { target_python = "/usr/bin/python3" }
input_map = {  }
limits = { timeout_secs = 60 }
input_schema = { "type" = "object", "properties" = {  }, "required" = [], "additionalProperties" = false }
result = { kind = "capability_projection", fields = { "boot_id" = ["mcp_result", "boot_id"], "source" = ["mcp_result", "source"], "unavailable" = ["mcp_result", "unavailable"], "observed_at" = ["mcp_result", "observed_at"], "taint" = ["mcp_result", "taint"], "kernel_release" = ["mcp_result", "kernel_release"], "lockdown" = ["mcp_result", "lockdown"], "signature_enforce" = ["mcp_result", "signature_enforce"], "modules_disabled" = ["mcp_result", "modules_disabled"] }, max_bytes = 4096, max_items = 256, max_depth = 8, schema = { "type" = "object", "properties" = { "boot_id" = { "type" = "string", "minLength" = 36, "maxLength" = 36 }, "source" = { "type" = "string", "maxLength" = 128 }, "unavailable" = { "type" = "array", "maxItems" = 32, "items" = { "type" = "string", "maxLength" = 128 } }, "observed_at" = { "type" = "string", "maxLength" = 32 }, "taint" = { "type" = "integer", "minimum" = 0, "maximum" = 9007199254740991 }, "kernel_release" = { "type" = "string", "maxLength" = 256 }, "lockdown" = { "type" = "string", "maxLength" = 4096 }, "signature_enforce" = { "type" = "string", "maxLength" = 4096 }, "modules_disabled" = { "type" = "string", "maxLength" = 4096 } }, "required" = ["boot_id", "source", "unavailable", "observed_at", "taint", "kernel_release"], "additionalProperties" = false } }
