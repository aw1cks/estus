[tools.change_nic_fec]
description = "Set a virtual FEC mode and read the driver's view back. Lab-only with no physical FEC proof."
revision = "1_native1"
authority = "automation:catalog"
effects = ["read","runtime_write","availability"]
execution = { kind = "native_payload", source = "/etc/estus/payloads/change_nic_fec/collector.py", no_log = false }
fixed_args = { "target_python" = "/usr/bin/python3" }

input_map = {"interface" = "interface","mode" = "mode"}
limits = { timeout_secs = 40 }
input_schema = {"type" = "object","properties" = {"interface" = {"type" = "string","enum" = ["fec0"],"maxLength" = 15},"mode" = {"type" = "string","enum" = ["off","rs"],"maxLength" = 3}},"required" = ["interface","mode"],"additionalProperties" = false}
[tools.change_nic_fec.result]
kind = "capability_projection"
fields = {"interface" = ["mcp_result","interface"],"driver" = ["mcp_result","driver"],"before" = ["mcp_result","before"],"after" = ["mcp_result","after"],"changed" = ["mcp_result","changed"],"verified" = ["mcp_result","verified"],"persistence" = ["mcp_result","persistence"]}
max_bytes = 4096
max_items = 256
max_depth = 8
schema = {"type" = "object","properties" = {"interface" = {"type" = "string","enum" = ["fec0"],"maxLength" = 15},"driver" = {"type" = "string","enum" = ["netdevsim"],"maxLength" = 32},"before" = {"type" = "object","properties" = {"configured" = {"type" = "array","items" = {"type" = "string","enum" = ["none","off","auto","rs","baser","llrs"],"maxLength" = 5},"maxItems" = 6},"active" = {"type" = "string","enum" = ["none","off","auto","rs","baser","llrs"],"maxLength" = 5}},"required" = ["configured","active"],"additionalProperties" = false},"after" = {"type" = "object","properties" = {"configured" = {"type" = "array","items" = {"type" = "string","enum" = ["off","rs"],"maxLength" = 3},"maxItems" = 1},"active" = {"type" = "string","enum" = ["off","rs"],"maxLength" = 3}},"required" = ["configured","active"],"additionalProperties" = false},"changed" = {"type" = "boolean"},"verified" = {"type" = "boolean","const" = true},"persistence" = {"type" = "string","const" = "runtime_only","maxLength" = 32}},"required" = ["interface","driver","before","after","changed","verified","persistence"],"additionalProperties" = false}
