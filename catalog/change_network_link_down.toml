# Reviewed controller-owned native Python payload; no Ansible runtime required.
# Export, review payloads/change_network_link_down/manifest.json and fixed policy, then catalog prepare.
# Preparation creates explicit source/adapter/contract/authority approval; activation never refreshes it.
mode = "headless"
capabilities = { named = true }
enabled_tools = ["change_network_link_down"]
[targets.server]
ssh_host = "server-ordinary"
[automation.targets.server]
destination = "server-ordinary"
python = "/usr/bin/python3"
[automation.authorities.catalog]
ssh_config_file = "/etc/estus/catalog-ssh.conf"
become = { method = "sudo", user = "root" }
[automation.authorities.catalog.targets.server]
destination = "server-catalog"
python = "/usr/bin/python3"
[tools.change_network_link_down]
description = "network link down. One runtime-only mutation with readback; independent surviving root-control recovery REQUIRED, no persistence or automatic replay."
revision = "1_native1"
targets = ["server"]
authority = "automation:catalog"
effects = ["runtime_write", "availability", "read"]
execution = { kind = "native_payload", snapshot = "/etc/estus/change_network_link_down.payload.json", source = "/etc/estus/payloads/change_network_link_down/collector.py", no_log = false }
fixed_args = { "target_python" = "/usr/bin/python3", "operator_policy" = { "interface" = "catalog0", "interfaces" = ["lo", "catalog0"], "destinations" = ["127.0.0.1", "192.0.2.2"], "ports" = [18080], "addresses" = ["192.0.2.9/24"], "routes" = ["198.51.100.0/24"], "neighbors" = ["192.0.2.2"], "namespaces" = ["catalogns"], "dns_names" = ["catalog.test"], "resolver" = "127.0.0.1", "dns_port" = 15353 } }
input_map = { "interface" = "interface" }
limits = { timeout_secs = 30 }
input_schema = { "type" = "object", "properties" = { "interface" = { "type" = "string", "enum" = ["catalog0"], "maxLength" = 256 } }, "required" = ["interface"], "additionalProperties" = false }
[tools.change_network_link_down.result]
kind = "capability_projection"
fields = { "interface" = ["mcp_result", "interface"], "operation" = ["mcp_result", "operation"], "verified" = ["mcp_result", "verified"], "persistence" = ["mcp_result", "persistence"] }
max_bytes = 4096
max_items = 256
max_depth = 8
schema = { "type" = "object", "properties" = { "interface" = { "type" = "string", "maxLength" = 15 }, "operation" = { "type" = "string", "maxLength" = 64 }, "verified" = { "type" = "boolean", "const" = true }, "persistence" = { "type" = "string", "const" = "runtime_only", "maxLength" = 32 } }, "required" = ["interface", "operation", "verified", "persistence"], "additionalProperties" = false }
