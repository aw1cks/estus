# Reviewed controller-owned native Python payload; no Ansible runtime required.
# Export, review payloads/observe_nic_fec/manifest.json and fixed policy, then catalog prepare.
# Preparation creates explicit source/adapter/contract/authority approval; activation never refreshes it.
mode = "headless"
capabilities = { named = true }
enabled_tools = ["observe_nic_fec"]
[targets.server]
ssh_host = "server-ordinary"
[automation.targets.server]
destination = "server-ordinary"
python = "/usr/bin/python3"
[tools.observe_nic_fec]
description = "observe_nic_fec: driver-reported FEC configuration and active encoding; no physical proof or tuning permission."
revision = "1_native1"
targets = ["server"]
authority = "automation"
effects = ["read"]
execution = { kind = "native_payload", snapshot = "/etc/estus/observe_nic_fec.payload.json", source = "/etc/estus/payloads/observe_nic_fec/collector.py", no_log = false }
fixed_args = {"target_python" = "/usr/bin/python3","operator_policy" = {"interface" = "fec0","mac" = "52:54:00:12:34:59","driver" = "netdevsim"}}
input_map = {"interface" = "interface"}
limits = { timeout_secs = 40 }
input_schema = {"type" = "object","properties" = {"interface" = {"type" = "string","enum" = ["fec0"],"maxLength" = 15}},"required" = ["interface"],"additionalProperties" = false}
[tools.observe_nic_fec.result]
kind = "capability_projection"
fields = {"interface" = ["mcp_result","interface"],"driver" = ["mcp_result","driver"],"configured" = ["mcp_result","configured"],"active" = ["mcp_result","active"],"source" = ["mcp_result","source"]}
max_bytes = 4096
max_items = 256
max_depth = 8
schema = {"type" = "object","properties" = {"interface" = {"type" = "string","enum" = ["fec0"],"maxLength" = 15},"driver" = {"type" = "string","enum" = ["netdevsim"],"maxLength" = 32},"configured" = {"type" = "array","maxItems" = 6,"items" = {"type" = "string","enum" = ["none","off","auto","rs","baser","llrs"],"maxLength" = 5}},"active" = {"type" = "string","enum" = ["none","off","auto","rs","baser","llrs"],"maxLength" = 5},"source" = {"type" = "string","maxLength" = 128}},"required" = ["interface","driver","configured","active","source"],"additionalProperties" = false}
