# Reviewed controller-owned native Python payload; no Ansible runtime required.
# Export, review payloads/observe_hardware_system/manifest.json and fixed policy, then catalog prepare.
# Preparation creates explicit source/adapter/contract/authority approval; activation never refreshes it.
mode = "headless"
capabilities = { named = true }
enabled_tools = ["observe_hardware_system"]
[targets.server]
ssh_host = "server-ordinary"
[automation.targets.server]
destination = "server-ordinary"
python = "/usr/bin/python3"

[tools.observe_hardware_system]
description = "Selected firmware-reported DMI fields; unknown placeholders omitted, not authenticated identity."
revision = "1_native1"
targets = ["server"]
authority = "automation"
effects = ["read"]
execution = { kind = "native_payload", snapshot = "/etc/estus/observe_hardware_system.payload.json", source = "/etc/estus/payloads/observe_hardware_system/collector.py", no_log = false }
fixed_args = { "target_python" = "/usr/bin/python3" }
input_map = {  }
limits = { timeout_secs = 30 }
input_schema = { "type" = "object", "properties" = {  }, "required" = [], "additionalProperties" = false }
[tools.observe_hardware_system.result]
kind = "capability_projection"
fields = { "source" = ["mcp_result", "source"], "observed_at" = ["mcp_result", "observed_at"], "unavailable" = ["mcp_result", "unavailable"], "values" = ["mcp_result", "values"], "truncated" = ["mcp_result", "truncated"], "omitted_records" = ["mcp_result", "omitted_records"] }
max_bytes = 4096
max_items = 256
max_depth = 8
schema = { "type" = "object", "properties" = { "truncated" = { "type" = "boolean" }, "omitted_records" = { "type" = "integer", "minimum" = 0, "maximum" = 9007199254740991 }, "source" = { "type" = "string", "maxLength" = 256 }, "observed_at" = { "type" = "string", "maxLength" = 64 }, "unavailable" = { "type" = "array", "items" = { "type" = "string", "maxLength" = 128 }, "maxItems" = 256 }, "values" = { "type" = "object", "properties" = { "system_vendor" = { "type" = "string", "maxLength" = 4096 }, "product_name" = { "type" = "string", "maxLength" = 4096 }, "product_version" = { "type" = "string", "maxLength" = 4096 }, "board_vendor" = { "type" = "string", "maxLength" = 4096 }, "board_name" = { "type" = "string", "maxLength" = 4096 }, "board_version" = { "type" = "string", "maxLength" = 4096 }, "bios_vendor" = { "type" = "string", "maxLength" = 4096 }, "bios_version" = { "type" = "string", "maxLength" = 4096 }, "bios_date" = { "type" = "string", "maxLength" = 4096 } }, "required" = [], "additionalProperties" = false } }, "required" = ["source", "observed_at", "unavailable", "values"], "additionalProperties" = false }
