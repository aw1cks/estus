# Independently opt-in nic_fec_set; import and review this role snapshot before activation.
# Requires /usr/bin/python3, /usr/bin/ethtool and an isolated netdevsim fec0.
# Fixed interface/MAC/sysfs driver pins; NEVER target a management path.
# Virtual driver configuration/readback only, not physical or wire-level FEC proof.
# Runtime only; no persistence, rollback, replay or automatic recovery after failure.
# Import: estus --config nic_fec_set.toml schema import-role nic_fec_set --role-path /etc/estus/roles/nic_fec_set --overlay overlay.json --output /etc/estus/nic_fec_set.schema.json
profile = "actions-only"
enabled_tools = ["nic_fec_set"]
[targets.server]
ssh_host = "server-ordinary"
[automation]
workspace_root = "/var/lib/estus/runner"
max_concurrent = 2
max_scratch_bytes = 16777216
max_scratch_files = 512
[automation.targets.server]
destination = "server-ordinary"
python = "/usr/bin/python3"
[automation.authorities.catalog]
ssh_config_file = "/etc/estus/catalog-ssh.conf"
become = { method = "sudo", user = "root" }
[automation.authorities.catalog.targets.server]
destination = "server-catalog"
python = "/usr/bin/python3"
[tools.nic_fec_set]
description = "nic_fec_set: reviewed runtime-only virtual FEC setting with driver readback; independent surviving control path required, no physical FEC proof."
revision = "1"
targets = ["server"]
authority = "automation:catalog"
effects = ["read","runtime_write","availability"]
execution = { "kind" = "ansible_role", "snapshot" = "/etc/estus/nic_fec_set.schema.json", "role_path" = "/etc/estus/nic_fec_set.schema.roles/nic_fec_set", "no_log" = false }
fixed_args = {"target_python" = "/usr/bin/python3","operator_policy" = {"interface" = "fec0","mac" = "52:54:00:12:34:59","driver" = "netdevsim","allow_runtime_tuning" = true,"modes" = ["off","rs"]}}
input_map = {"interface" = "interface","mode" = "mode"}
limits = { timeout_secs = 40 }
input_schema = {"type" = "object","properties" = {"interface" = {"type" = "string","enum" = ["fec0"],"maxLength" = 15},"mode" = {"type" = "string","enum" = ["off","rs"],"maxLength" = 3}},"required" = ["interface","mode"],"additionalProperties" = false}
[tools.nic_fec_set.result]
kind = "ansible_projection"
fields = {"interface" = ["mcp_result","interface"],"driver" = ["mcp_result","driver"],"before" = ["mcp_result","before"],"after" = ["mcp_result","after"],"changed" = ["mcp_result","changed"],"verified" = ["mcp_result","verified"],"persistence" = ["mcp_result","persistence"]}
max_bytes = 4096
max_items = 256
max_depth = 8
schema = {"type" = "object","properties" = {"interface" = {"type" = "string","enum" = ["fec0"],"maxLength" = 15},"driver" = {"type" = "string","enum" = ["netdevsim"],"maxLength" = 32},"before" = {"type" = "object","properties" = {"configured" = {"type" = "array","items" = {"type" = "string","enum" = ["none","off","auto","rs","baser","llrs"],"maxLength" = 5},"maxItems" = 6},"active" = {"type" = "string","enum" = ["none","off","auto","rs","baser","llrs"],"maxLength" = 5}},"required" = ["configured","active"],"additionalProperties" = false},"after" = {"type" = "object","properties" = {"configured" = {"type" = "array","items" = {"type" = "string","enum" = ["off","rs"],"maxLength" = 3},"maxItems" = 1},"active" = {"type" = "string","enum" = ["off","rs"],"maxLength" = 3}},"required" = ["configured","active"],"additionalProperties" = false},"changed" = {"type" = "boolean"},"verified" = {"type" = "boolean","const" = true},"persistence" = {"type" = "string","const" = "runtime_only","maxLength" = 32}},"required" = ["interface","driver","before","after","changed","verified","persistence"],"additionalProperties" = false}
