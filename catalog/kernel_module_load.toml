# Reviewed controller-owned native Python payload; no Ansible runtime required.
# Export, review payloads/kernel_module_load/manifest.json and fixed policy, then catalog prepare.
# Preparation creates explicit source/adapter/contract/authority approval; activation never refreshes it.
mode = "headless"
capabilities = { named = true }
enabled_tools = ["kernel_module_load"]

[targets.server]
ssh_host = "server-ordinary"

[automation.authorities.catalog]
ssh_config_file = "/etc/estus/catalog-ssh.conf"
become = { method = "sudo", user = "root" }

[automation.authorities.catalog.targets.server]
destination = "server-catalog-admin"
python = "/usr/bin/python3"

[tools.kernel_module_load]
description = "Load one approved installed module with only typed approved parameters and observe module-set and taint deltas. Effective modprobe dependency/install hooks may run; no arbitrary ko, force, flags or persistence; preview does not authorize this mutation."
revision = "1_native1"
targets = ["server"]
authority = "automation:catalog"
effects = ["read", "runtime_write", "availability"]
execution = { kind = "native_payload", snapshot = "/etc/estus/kernel_module_load.payload.json", source = "/etc/estus/payloads/kernel_module_load/collector.py", no_log = false }
fixed_args = { target_python = "/usr/bin/python3" }
input_map = { "name" = "name", "parameters" = "parameters" }
limits = { timeout_secs = 60 }
input_schema = { "type" = "object", "properties" = { "name" = { "type" = "string", "enum" = ["dummy", "estus_catalog"], "minLength" = 1, "maxLength" = 64 }, "parameters" = { "type" = "object", "properties" = { "numdummies" = { "type" = "integer", "minimum" = 0, "maximum" = 4 } }, "required" = [], "additionalProperties" = false } }, "required" = ["name", "parameters"], "additionalProperties" = false }
result = { kind = "capability_projection", fields = { "boot_id" = ["mcp_result", "boot_id"], "source" = ["mcp_result", "source"], "unavailable" = ["mcp_result", "unavailable"], "observed_at" = ["mcp_result", "observed_at"], "name" = ["mcp_result", "name"], "outcome" = ["mcp_result", "outcome"], "command_returncode" = ["mcp_result", "command_returncode"], "postcondition_verified" = ["mcp_result", "postcondition_verified"], "loaded_before" = ["mcp_result", "loaded_before"], "loaded_after" = ["mcp_result", "loaded_after"], "added_modules" = ["mcp_result", "added_modules"], "removed_modules" = ["mcp_result", "removed_modules"], "taint_before" = ["mcp_result", "taint_before"], "taint_after" = ["mcp_result", "taint_after"], "hooks_may_have_executed" = ["mcp_result", "hooks_may_have_executed"], "quiescence_proven" = ["mcp_result", "quiescence_proven"] }, max_bytes = 4096, max_items = 256, max_depth = 8, schema = { "type" = "object", "properties" = { "boot_id" = { "type" = "string", "minLength" = 36, "maxLength" = 36 }, "source" = { "type" = "string", "maxLength" = 128 }, "unavailable" = { "type" = "array", "maxItems" = 32, "items" = { "type" = "string", "maxLength" = 128 } }, "observed_at" = { "type" = "string", "maxLength" = 32 }, "name" = { "type" = "string", "maxLength" = 64 }, "outcome" = { "type" = "string", "maxLength" = 32 }, "command_returncode" = { "type" = "integer", "minimum" = -255, "maximum" = 255 }, "postcondition_verified" = { "type" = "boolean" }, "loaded_before" = { "type" = "boolean" }, "loaded_after" = { "type" = "boolean" }, "added_modules" = { "type" = "array", "maxItems" = 256, "items" = { "type" = "string", "maxLength" = 64 } }, "removed_modules" = { "type" = "array", "maxItems" = 256, "items" = { "type" = "string", "maxLength" = 64 } }, "taint_before" = { "type" = "integer", "minimum" = 0, "maximum" = 9007199254740991 }, "taint_after" = { "type" = "integer", "minimum" = 0, "maximum" = 9007199254740991 }, "hooks_may_have_executed" = { "type" = "boolean" }, "quiescence_proven" = { "type" = "boolean" } }, "required" = ["boot_id", "source", "unavailable", "observed_at", "name", "outcome", "command_returncode", "postcondition_verified", "loaded_before", "loaded_after", "added_modules", "removed_modules", "taint_before", "taint_after", "hooks_may_have_executed", "quiescence_proven"], "additionalProperties" = false } }
