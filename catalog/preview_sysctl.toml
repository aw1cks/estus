[tools.preview_sysctl]
description = "Preview a sysctl parameter change without modifying runtime or persistent configuration. mode='config' diffs the dedicated catalog sysctl.d file for change_sysctl_config; mode='runtime' previews only /proc/sys for change_sysctl_runtime."
revision = "2_native1"
authority = "automation:catalog"
effects = ["read"]
execution = { kind = "native_payload", source = "/etc/estus/payloads/preview_sysctl/collector.py", no_log = false }
fixed_args = { target_python = "/usr/bin/python3" }
input_map = { key = "key", value = "value", mode = "mode" }
limits = { timeout_secs = 30 }
input_schema = { type = "object", properties = { key = { type = "string", minLength = 1, maxLength = 128 }, value = { type = "integer", minimum = 0, maximum = 9007199254740991 }, mode = { type = "string", enum = ["config", "runtime"] } }, required = ["key", "value", "mode"], additionalProperties = false }
[tools.preview_sysctl.result]
kind = "capability_projection"
fields = { key = ["mcp_result", "key"], mode = ["mcp_result", "mode"], before_runtime = ["mcp_result", "before_runtime"], after_runtime = ["mcp_result", "after_runtime"], changed = ["mcp_result", "changed"], persistent = ["mcp_result", "persistent"], config_path = ["mcp_result", "config_path"], before_config = ["mcp_result", "before_config"], after_config = ["mcp_result", "after_config"] }
max_bytes = 4096
max_items = 256
max_depth = 8
schema = { type = "object", properties = { key = { type = "string", minLength = 1, maxLength = 128 }, mode = { type = "string", enum = ["config", "runtime"], maxLength = 16 }, before_runtime = { type = "integer", minimum = 0, maximum = 9007199254740991 }, after_runtime = { type = "integer", minimum = 0, maximum = 9007199254740991 }, changed = { type = "boolean" }, persistent = { type = "boolean" }, config_path = { type = "string", maxLength = 128 }, before_config = { type = "string", maxLength = 1024 }, after_config = { type = "string", maxLength = 1024 } }, required = ["key", "mode", "before_runtime", "after_runtime", "changed", "persistent", "config_path", "before_config", "after_config"], additionalProperties = false }
