# Opt-in Linux network_route_lookup; reviewed role and separately imported snapshot required.
# Copy roles/network_route_lookup to /etc/estus/roles/network_route_lookup; export input_schema/fixed_args/input_map as overlay.json.
# estus --config network_route_lookup.toml schema import-role network_route_lookup --role-path /etc/estus/roles/network_route_lookup --overlay overlay.json --output /etc/estus/network_route_lookup.schema.json
# Offline import never runs tasks; review snapshot before enabling. Provision runner root mode 0700.
# Requires pinned /usr/bin/python3 and fixed iproute2 utilities; probes additionally ping/traceroute as applicable.
# Operator policy is fixed_args only: callers cannot replace it. No persistent manager changes or flush/batch.
profile = "actions-only"
enabled_tools = ["network_route_lookup"]
[targets.server]
ssh_host = "server-ordinary"
[automation]
workspace_root = "/var/lib/estus/runner"
max_concurrent = 2
max_scratch_bytes = 16777216
max_scratch_files = 512
[automation.targets.server]
destination = "server-ordinary"
python = "/usr/bin/python3"
[tools.network_route_lookup]
description = "network route lookup. Bounded Linux observations; operator-approved interfaces; no process attribution, flags, namespace execution or mutation."
revision = "1"
targets = ["server"]
authority = "automation"
effects = ["read"]
execution = { "kind" = "ansible_role", "snapshot" = "/etc/estus/network_route_lookup.schema.json", "role_path" = "/etc/estus/network_route_lookup.schema.roles/network_route_lookup", "no_log" = false }
fixed_args = { "target_python" = "/usr/bin/python3", "operator_policy" = { "interface" = "catalog0", "interfaces" = ["lo", "catalog0"], "destinations" = ["127.0.0.1", "192.0.2.2"], "ports" = [18080], "addresses" = ["192.0.2.9/24"], "routes" = ["198.51.100.0/24"], "neighbors" = ["192.0.2.2"], "namespaces" = ["catalogns"], "dns_names" = ["catalog.test"], "resolver" = "127.0.0.1", "dns_port" = 15353 } }
input_map = { "destination" = "destination", "source" = "source" }
limits = { timeout_secs = 30 }
input_schema = { "type" = "object", "properties" = { "destination" = { "type" = "string", "enum" = ["127.0.0.1", "192.0.2.2"], "maxLength" = 256 }, "source" = { "type" = "string", "enum" = ["127.0.0.1", "192.0.2.1"], "maxLength" = 256 } }, "required" = ["destination"], "additionalProperties" = false }
[tools.network_route_lookup.result]
kind = "ansible_projection"
fields = { "entries" = ["mcp_result", "entries"], "truncated" = ["mcp_result", "truncated"], "scope" = ["mcp_result", "scope"] }
max_bytes = 4096
max_items = 256
max_depth = 8
schema = { "type" = "object", "properties" = { "entries" = { "type" = "array", "items" = { "type" = "object", "properties" = { "destination" = { "type" = "string", "maxLength" = 64 }, "interface" = { "type" = "string", "maxLength" = 15 }, "gateway" = { "type" = "string", "maxLength" = 64 }, "source" = { "type" = "string", "maxLength" = 64 }, "table" = { "type" = "string", "maxLength" = 32 }, "protocol" = { "type" = "string", "maxLength" = 32 }, "scope" = { "type" = "string", "maxLength" = 32 }, "type" = { "type" = "string", "maxLength" = 32 }, "metric" = { "type" = "integer", "minimum" = 0, "maximum" = 9007199254740991 } }, "required" = [], "additionalProperties" = false }, "maxItems" = 16 }, "truncated" = { "type" = "boolean" }, "scope" = { "type" = "string", "const" = "current_network_namespace", "maxLength" = 32 } }, "required" = ["entries", "truncated", "scope"], "additionalProperties" = false }
