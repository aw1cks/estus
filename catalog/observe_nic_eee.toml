# Reviewed controller-owned native Python payload; no Ansible runtime required.
# Export, review payloads/observe_nic_eee/manifest.json and the fixed policy here, then enable it by name.
# Preparation creates explicit source/adapter/contract/authority approval; activation never refreshes it.
mode = "headless"
capabilities = { named = true }
enabled_tools = ["observe_nic_eee"]
[targets.server]
ssh_host = "server-ordinary"
[automation.targets.server]
destination = "server-ordinary"
python = "/usr/bin/python3"
[tools.observe_nic_eee]
description = "observe_nic_eee: Synthetic model EEE configuration and separate active state via real ethtool; no tuning or physical link proof."
revision = "1_native1"
targets = ["server"]
authority = "automation"
effects = ["read"]
execution = { kind = "native_payload", source = "/etc/estus/payloads/observe_nic_eee/collector.py", no_log = false }
fixed_args = {"target_python" = "/usr/bin/python3","operator_policy" = {"interface" = "model0","mac" = "52:54:00:12:34:5a","driver" = "estus_nic_model"}}
input_map = {"interface" = "interface"}
limits = {"timeout_secs" = 40}
input_schema = {"type" = "object","properties" = {"interface" = {"type" = "string","maxLength" = 15,"enum" = ["model0"]}},"required" = ["interface"],"additionalProperties" = false}
[tools.observe_nic_eee.result]
kind = "capability_projection"
fields = {"interface" = ["mcp_result","interface"],"driver" = ["mcp_result","driver"],"scope" = ["mcp_result","scope"],"enabled" = ["mcp_result","enabled"],"active" = ["mcp_result","active"],"tx_lpi_enabled" = ["mcp_result","tx_lpi_enabled"],"tx_lpi_timer_us" = ["mcp_result","tx_lpi_timer_us"],"supported_modes" = ["mcp_result","supported_modes"],"advertised_modes" = ["mcp_result","advertised_modes"],"peer_modes" = ["mcp_result","peer_modes"]}
max_bytes = 4096
max_items = 256
max_depth = 8
schema = {"type" = "object","properties" = {"interface" = {"type" = "string","maxLength" = 15,"enum" = ["model0"]},"driver" = {"type" = "string","maxLength" = 32,"enum" = ["estus_nic_model"]},"scope" = {"type" = "string","maxLength" = 14,"enum" = ["software_model"]},"enabled" = {"type" = "boolean"},"active" = {"type" = "boolean"},"tx_lpi_enabled" = {"type" = "boolean"},"tx_lpi_timer_us" = {"type" = "integer","minimum" = 0,"maximum" = 4294967295},"supported_modes" = {"type" = "array","maxItems" = 16,"items" = {"type" = "string","maxLength" = 64}},"advertised_modes" = {"type" = "array","maxItems" = 16,"items" = {"type" = "string","maxLength" = 64}},"peer_modes" = {"type" = "array","maxItems" = 16,"items" = {"type" = "string","maxLength" = 64}}},"required" = ["interface","driver","scope","enabled","active","tx_lpi_enabled","supported_modes","advertised_modes","peer_modes"],"additionalProperties" = false}
