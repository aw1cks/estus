# Reviewed controller-owned native Python payload; no Ansible runtime required.
# Export, review payloads/observe_kernel_module_parameters/manifest.json and the fixed policy here, then enable it by name.
# Preparation creates explicit source/adapter/contract/authority approval; activation never refreshes it.
mode = "headless"
capabilities = { named = true }
enabled_tools = ["observe_kernel_module_parameters"]

[targets.server]
ssh_host = "server-ordinary"

[automation.targets.server]
destination = "server-ordinary"
python = "/usr/bin/python3"

[tools.observe_kernel_module_parameters]
description = "Read only reviewed current module parameters, preserving absent/unreadable values as unsupported and actual sysfs writable mode. No arbitrary parameter paths."
revision = "1_native1"
targets = ["server"]
authority = "automation"
effects = ["read"]
execution = { kind = "native_payload", source = "/etc/estus/payloads/observe_kernel_module_parameters/collector.py", no_log = false }
fixed_args = { target_python = "/usr/bin/python3" }
input_map = { "name" = "name" }
limits = { timeout_secs = 60 }
input_schema = { "type" = "object", "properties" = { "name" = { "type" = "string", "enum" = ["dummy", "estus_catalog"], "minLength" = 1, "maxLength" = 64 } }, "required" = ["name"], "additionalProperties" = false }
result = { kind = "capability_projection", fields = { "boot_id" = ["mcp_result", "boot_id"], "source" = ["mcp_result", "source"], "unavailable" = ["mcp_result", "unavailable"], "observed_at" = ["mcp_result", "observed_at"], "name" = ["mcp_result", "name"], "parameters" = ["mcp_result", "parameters"], "approval_scope" = ["mcp_result", "approval_scope"] }, max_bytes = 4096, max_items = 256, max_depth = 8, schema = { "type" = "object", "properties" = { "boot_id" = { "type" = "string", "minLength" = 36, "maxLength" = 36 }, "source" = { "type" = "string", "maxLength" = 128 }, "unavailable" = { "type" = "array", "maxItems" = 32, "items" = { "type" = "string", "maxLength" = 128 } }, "observed_at" = { "type" = "string", "maxLength" = 32 }, "name" = { "type" = "string", "maxLength" = 64 }, "parameters" = { "type" = "array", "maxItems" = 16, "items" = { "type" = "object", "properties" = { "parameter" = { "type" = "string", "maxLength" = 64 }, "supported" = { "type" = "boolean" }, "writable" = { "type" = "boolean" }, "source" = { "type" = "string", "maxLength" = 32 }, "value" = { "type" = "string", "maxLength" = 4096 } }, "required" = ["parameter", "supported", "writable", "source"], "additionalProperties" = false } }, "approval_scope" = { "type" = "string", "maxLength" = 256 } }, "required" = ["boot_id", "source", "unavailable", "observed_at", "name", "parameters", "approval_scope"], "additionalProperties" = false } }
