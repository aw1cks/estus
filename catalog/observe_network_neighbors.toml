# Reviewed controller-owned native Python payload; no Ansible runtime required.
# Export, review payloads/observe_network_neighbors/manifest.json and fixed policy, then catalog prepare.
# Preparation creates explicit source/adapter/contract/authority approval; activation never refreshes it.
mode = "headless"
capabilities = { named = true }
enabled_tools = ["observe_network_neighbors"]
[targets.server]
ssh_host = "server-ordinary"
[automation.targets.server]
destination = "server-ordinary"
python = "/usr/bin/python3"
[tools.observe_network_neighbors]
description = "network neighbors list. Bounded Linux observations; operator-approved interfaces; no process attribution, flags, namespace execution or mutation."
revision = "1_native1"
targets = ["server"]
authority = "automation"
effects = ["read"]
execution = { kind = "native_payload", snapshot = "/etc/estus/observe_network_neighbors.payload.json", source = "/etc/estus/payloads/observe_network_neighbors/collector.py", no_log = false }
fixed_args = { "target_python" = "/usr/bin/python3", "operator_policy" = { "interfaces" = [], "destinations" = [], "ports" = [], "addresses" = [], "routes" = [], "neighbors" = [], "namespaces" = [], "dns_names" = [] } }
input_map = { "interface" = "interface", "family" = "family", "limit" = "limit" }
limits = { timeout_secs = 30 }
input_schema = { "type" = "object", "properties" = { "interface" = { "type" = "string", "minLength" = 1, "maxLength" = 15 }, "family" = { "type" = "string", "enum" = ["inet", "inet6"], "maxLength" = 256 }, "limit" = { "type" = "integer", "minimum" = 1, "maximum" = 16 } }, "required" = [], "additionalProperties" = false }
[tools.observe_network_neighbors.result]
kind = "capability_projection"
fields = { "entries" = ["mcp_result", "entries"], "truncated" = ["mcp_result", "truncated"], "scope" = ["mcp_result", "scope"] }
max_bytes = 4096
max_items = 256
max_depth = 8
schema = { "type" = "object", "properties" = { "entries" = { "type" = "array", "items" = { "type" = "object", "properties" = { "destination" = { "type" = "string", "maxLength" = 64 }, "interface" = { "type" = "string", "maxLength" = 15 }, "address" = { "type" = "string", "maxLength" = 64 }, "state" = { "type" = "array", "items" = { "type" = "string", "maxLength" = 32 }, "maxItems" = 16 } }, "required" = ["destination", "interface", "state"], "additionalProperties" = false }, "maxItems" = 16 }, "truncated" = { "type" = "boolean" }, "scope" = { "type" = "string", "const" = "approved_interfaces", "maxLength" = 32 } }, "required" = ["entries", "truncated", "scope"], "additionalProperties" = false }
