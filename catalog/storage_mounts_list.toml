# Opt-in: copy roles/storage_mounts_list to /etc/estus/roles/storage_mounts_list; export input_schema,
# fixed_args and input_map as overlay.json. Review the offline imported snapshot:
# estus --config storage_mounts_list.toml schema import-role storage_mounts_list --role-path /etc/estus/roles/storage_mounts_list --overlay overlay.json --output /etc/estus/storage_mounts_list.schema.json
# Provision mode0700 /var/lib/estus/runner, Python3 and declared inspection utilities.
# Current mounts including overmount duplicates; no static configuration, options, labels, UUIDs or raw context. Capacity is non-atomic.
profile = "actions-only"
enabled_tools = ["storage_mounts_list"]
[targets.server]
ssh_host = "server-ordinary"
[automation]
workspace_root = "/var/lib/estus/runner"
max_concurrent = 2
max_scratch_bytes = 16777216
max_scratch_files = 512
[automation.targets.server]
destination = "server-ordinary"
python = "/usr/bin/python3"
[tools.storage_mounts_list]
description = "Current mounts including overmount duplicates; no static configuration, options, labels, UUIDs or raw context. Capacity is non-atomic."
revision = "1"
targets = ["server"]
authority = "automation"
effects = ["read"]
execution = { kind = "ansible_role", snapshot = "/etc/estus/storage_mounts_list.schema.json", role_path = "/etc/estus/storage_mounts_list.schema.roles/storage_mounts_list", no_log = false }
fixed_args = { target_python = "/usr/bin/python3" }
input_map = {  }
limits = { timeout_secs = 30 }
input_schema = { "type" = "object", "properties" = {  }, "required" = [], "additionalProperties" = false }
[tools.storage_mounts_list.result]
kind = "ansible_projection"
fields = { "source" = ["mcp_result", "source"], "observed_at" = ["mcp_result", "observed_at"], "unavailable" = ["mcp_result", "unavailable"], "mounts" = ["mcp_result", "mounts"] , truncated = ["mcp_result", "truncated"], omitted_records = ["mcp_result", "omitted_records"] }
max_bytes = 4096
max_items = 256
max_depth = 8
schema = { "type" = "object", "properties" = { truncated = { type = "boolean" }, omitted_records = { type = "integer", minimum = 0, maximum = 9007199254740991 }, "source" = { "type" = "string", "maxLength" = 256 }, "observed_at" = { "type" = "string", "maxLength" = 64 }, "unavailable" = { "type" = "array", "items" = { "type" = "string", "maxLength" = 128 }, "maxItems" = 256 }, "mounts" = { "type" = "array", "items" = { "type" = "object", "properties" = { "mount" = { "type" = "string", "maxLength" = 4096 }, "device" = { "type" = "string", "maxLength" = 4096 }, "fstype" = { "type" = "string", "maxLength" = 4096 }, "size_total" = { "type" = "integer", "minimum" = 0, "maximum" = 9007199254740991 }, "size_available" = { "type" = "integer", "minimum" = 0, "maximum" = 9007199254740991 }, "inode_total" = { "type" = "integer", "minimum" = 0, "maximum" = 9007199254740991 }, "inode_available" = { "type" = "integer", "minimum" = 0, "maximum" = 9007199254740991 } }, "required" = ["mount", "device", "fstype"], "additionalProperties" = false }, "maxItems" = 256 } }, "required" = ["source", "observed_at", "unavailable", "mounts"], "additionalProperties" = false }
