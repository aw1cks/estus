[tools.change_dnf]
description = "Install, upgrade or remove packages with dnf/dnf5, including the repo and best-effort options. Invalid or interrupted transitions are not replayed."
revision = "1"
authority = "automation:catalog"
effects = ["persistent_write", "read"]
execution = { kind = "ansible_module", module = "ansible.builtin.dnf", no_log = false, check_mode = false, diff = false }
fixed_args = {}

input_map = { name = "name", state = "state", update_cache = "update_cache", enablerepo = "enablerepo", disablerepo = "disablerepo", allowerasing = "allowerasing", nobest = "nobest" }
limits = { timeout_secs = 120 }
input_schema = { type = "object", properties = { name = { type = "array", items = { type = "string", minLength = 1, maxLength = 128 }, minItems = 1, maxItems = 32 }, state = { type = "string", enum = ["present", "absent", "latest"] }, update_cache = { type = "boolean" }, enablerepo = { type = "array", items = { type = "string", minLength = 1, maxLength = 128 }, maxItems = 16 }, disablerepo = { type = "array", items = { type = "string", minLength = 1, maxLength = 128 }, maxItems = 16 }, allowerasing = { type = "boolean" }, nobest = { type = "boolean" } }, required = ["name", "state"], additionalProperties = false }

[tools.change_dnf.result]
kind = "ansible_projection"
fields = { changed = ["changed"] }
max_bytes = 4096
max_items = 64
max_depth = 4
schema = { type = "object", properties = { changed = { type = "boolean" } }, required = ["changed"], additionalProperties = false }
