---
- name: Execute fixed bounded journal_read operation
  ansible.builtin.command:
    argv:
      - '{{ target_python }}'
      - '-I'
      - '-c'
      - "{{ lookup('ansible.builtin.file', role_path ~ '/files/collector.py', rstrip=False) }}"
      - '{{ unit | to_json }}'
      - '{{ boot_id | to_json }}'
      - '{{ since | to_json }}'
      - '{{ journal_until | to_json }}'
      - '{{ priority | to_json }}'
      - '{{ cursor | default("") | to_json }}'
      - '{{ limit | to_json }}'
    expand_argument_vars: false
  register: observation
  changed_when: false

- name: Publish typed selected result
  ansible.builtin.set_fact:
    mcp_result: '{{ observation.stdout | from_json }}'
