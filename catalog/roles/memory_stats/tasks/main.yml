---
- name: Observe bounded Linux memory gauges and VM counters without a shell
  ansible.builtin.command:
    argv:
      - '{{ target_python }}'
      - '-I'
      - '-c'
      - "{{ lookup('ansible.builtin.file', role_path ~ '/files/collector.py', rstrip=False) }}"
    expand_argument_vars: false
  register: memory_stats_observation
  changed_when: false

- name: Publish only the typed memory observation
  ansible.builtin.set_fact:
    mcp_result: '{{ memory_stats_observation.stdout | from_json }}'
