---
- name: Collect bounded reviewed Linux observation
  ansible.builtin.command:
    argv:
      - '{{ target_python }}'
      - -I
      - -c
      - "{{ lookup('ansible.builtin.file', role_path ~ '/files/collector.py', rstrip=False) }}"
      - "{{ {'uid': uid, 'name_contains': name_contains, 'limit': limit} | to_json }}"
    expand_argument_vars: false
  register: observation
  changed_when: false

- name: Publish typed observation only
  ansible.builtin.set_fact:
    mcp_result: '{{ observation.stdout | from_json }}'
