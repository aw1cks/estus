---
- name: Read reviewed software model EEPROM through real ethtool decoder
  ansible.builtin.command:
    argv:
      - '{{ target_python }}'
      - '-I'
      - '-c'
      - "{{ lookup('ansible.builtin.file', role_path ~ '/files/collector.py', rstrip=False) }}"
      - '{{ {"interface": interface} | to_json }}'
      - '{{ operator_policy | to_json }}'
    expand_argument_vars: false
  register: nic_observation
  changed_when: false
- name: Publish selected nonserial typed transceiver result
  ansible.builtin.set_fact:
    mcp_result: '{{ nic_observation.stdout | from_json }}'
