---
- name: Collect maintained selected facts
  ansible.builtin.setup:
    gather_subset: ["!all", "!min", "network"]
    gather_timeout: 5
    filter: ["ansible_{{ interface | replace(\"-\", \"_\") }}"]
  register: selected
- name: Observe selected bounded data without shell
  ansible.builtin.command:
    argv:
      - "{{ target_python }}"
      - "-I"
      - "-c"
      - "{{ lookup('ansible.builtin.file', role_path ~ '/files/collector.py', rstrip=False) }}"
      - "{{ interface }}"
    expand_argument_vars: false
    stdin: "{{ selected.ansible_facts | to_json }}"
  register: observation
  changed_when: false
- name: Publish closed selected observation
  ansible.builtin.set_fact:
    mcp_result: "{{ observation.stdout | from_json }}"
