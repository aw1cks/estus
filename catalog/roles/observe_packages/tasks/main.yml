---
- name: Collect maintained apt package facts without installing dependencies
  ansible.builtin.package_facts:
    manager: [apt]
    strategy: first
  register: package_inventory

- name: Reject inventory exceeding the reviewed transport bound
  ansible.builtin.assert:
    that:
      - package_inventory.ansible_facts.packages | length <= 4096
      - (package_inventory.ansible_facts.packages | to_json | length) <= 1048576

- name: Project bounded maintained package facts
  ansible.builtin.command:
    argv:
      - '{{ target_python }}'
      - '-I'
      - '-c'
      - "{{ lookup('ansible.builtin.file', role_path ~ '/files/collector.py', rstrip=False) }}"
      - '{{ offset | string }}'
      - '{{ limit | string }}'
    stdin: '{{ package_inventory.ansible_facts.packages | to_json }}'
    expand_argument_vars: false
  register: package_observation
  changed_when: false

- name: Publish typed maintained package inventory
  ansible.builtin.set_fact:
    mcp_result: '{{ package_observation.stdout | from_json }}'
