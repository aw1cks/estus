---
- name: Execute one fixed bounded network operation
  ansible.builtin.command:
    argv:
      - '{{ target_python }}'
      - '-I'
      - '-c'
      - "{{ lookup('ansible.builtin.file', role_path ~ '/files/collector.py', rstrip=False) }}"
      - '{{ {"protocol": protocol | default(none), "state": state | default(none), "address": address | default(none), "local_port": local_port | default(none), "limit": limit | default(none)} | to_json }}'
      - '{{ operator_policy | to_json }}'
    expand_argument_vars: false
  register: network_observation
  changed_when: false

- name: Publish typed semantic network result
  ansible.builtin.set_fact:
    mcp_result: '{{ network_observation.stdout | from_json }}'
