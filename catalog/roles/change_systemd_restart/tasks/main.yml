---
- name: Enforce fixed operator unit selection
  ansible.builtin.assert:
    that:
      - manager_scope in ['system', 'user']
      - unit in allowed_units
      - unit is match('^[A-Za-z0-9_@.:-]{1,128}$')
    quiet: true
- name: Resolve executing account runtime directory without privilege changes
  ansible.builtin.command:
    argv: ['{{ target_python }}', '-I', '-c', 'import os; print(os.getuid())']
    expand_argument_vars: false
  register: systemd_account
  changed_when: false
- name: Use maintained module with exactly this capability's semantics
  ansible.builtin.systemd_service:
    name: '{{ unit }}'
    scope: '{{ manager_scope }}'
    daemon_reload: false
    daemon_reexec: false
    state: "restarted"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ systemd_account.stdout | trim }}"
  register: systemd_effect
- name: Execute bounded fixed operation and selected observation
  ansible.builtin.command:
    argv:
      - '{{ target_python }}'
      - '-I'
      - '-c'
      - "{{ lookup('ansible.builtin.file', role_path ~ '/files/collector.py', rstrip=False) }}"
      - "{{ {'target_python': target_python, 'manager_scope': manager_scope, 'allowed_units': allowed_units, 'unit': unit} | to_json }}"
    expand_argument_vars: false
  register: systemd_observation
  changed_when: false
- name: Publish typed result separate from application health
  ansible.builtin.set_fact:
    mcp_result: '{{ systemd_observation.stdout | from_json }}'
