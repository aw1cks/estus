---
- name: Read selected Linux MD RAID1 state without changing the array
  ansible.builtin.command:
    argv:
      - '{{ target_python }}'
      - '-I'
      - '-c'
      - "{{ lookup('ansible.builtin.file', role_path ~ '/files/collector.py', rstrip=False) }}"
      - '{{ device }}'
    expand_argument_vars: false
  register: storage_raid_status_observation
  changed_when: false

- name: Publish selected typed MD observations
  ansible.builtin.set_fact:
    mcp_result: '{{ storage_raid_status_observation.stdout | from_json }}'
