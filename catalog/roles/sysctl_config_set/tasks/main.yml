---
- name: Execute fixed bounded sysctl_config_set operation
  ansible.builtin.command:
    argv:
      - '{{ target_python }}'
      - '-I'
      - '-c'
      - "{{ lookup('ansible.builtin.file', role_path ~ '/files/collector.py', rstrip=False) }}"
      - '{{ key | to_json }}'
      - '{{ value | to_json }}'
    expand_argument_vars: false
  register: observation
  changed_when: observation.rc == 0

- name: Publish typed selected result
  ansible.builtin.set_fact:
    mcp_result: '{{ observation.stdout | from_json }}'
