# Independently opt-in nic_pause_get; import and review this role snapshot before activation.
# Requires /usr/bin/python3, /usr/bin/ethtool and reviewed e1000e capabilities.
# Operator pins isolated interface/MAC/driver. NEVER target management0 or a management path.
# Reported state only; not a wire-level flow-control guarantee or tuning grant.
# Import: estus --config nic_pause_get.toml schema import-role nic_pause_get --role-path /etc/estus/roles/nic_pause_get --overlay overlay.json --output /etc/estus/nic_pause_get.schema.json
profile = "actions-only"
enabled_tools = ["nic_pause_get"]
[targets.server]
ssh_host = "server-ordinary"
[automation]
workspace_root = "/var/lib/estus/runner"
max_concurrent = 2
max_scratch_bytes = 16777216
max_scratch_files = 512
[automation.targets.server]
destination = "server-ordinary"
python = "/usr/bin/python3"
[tools.nic_pause_get]
description = "nic_pause_get: selected driver-reported pause state; inspection grants no tuning permission."
revision = "1"
targets = ["server"]
authority = "automation"
effects = ["read"]
execution = { "kind" = "ansible_role", "snapshot" = "/etc/estus/nic_pause_get.schema.json", "role_path" = "/etc/estus/nic_pause_get.schema.roles/nic_pause_get", "no_log" = false }
fixed_args = {"target_python" = "/usr/bin/python3","operator_policy" = {"interface" = "pause0","mac" = "52:54:00:12:34:58","driver" = "e1000e"}}
input_map = {"interface" = "interface"}
limits = { timeout_secs = 40 }
input_schema = {"type" = "object","properties" = {"interface" = {"type" = "string","enum" = ["pause0"],"maxLength" = 15}},"required" = ["interface"],"additionalProperties" = false}
[tools.nic_pause_get.result]
kind = "ansible_projection"
fields = {"interface" = ["mcp_result","interface"],"autoneg" = ["mcp_result","autoneg"],"rx" = ["mcp_result","rx"],"tx" = ["mcp_result","tx"],"source" = ["mcp_result","source"]}
max_bytes = 4096
max_items = 256
max_depth = 8
schema = {"type" = "object","properties" = {"interface" = {"type" = "string","maxLength" = 15},"autoneg" = {"type" = "boolean"},"rx" = {"type" = "boolean"},"tx" = {"type" = "boolean"},"source" = {"type" = "string","maxLength" = 128}},"required" = ["interface","autoneg","rx","tx","source"],"additionalProperties" = false}
