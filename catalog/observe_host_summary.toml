# Reviewed controller-owned native Python payload; no Ansible runtime required.
# Export, review payloads/observe_host_summary/manifest.json and the fixed policy here, then enable it by name.
# The site supplies targets, authority and fixed policy; the collector digest is checked at load.
mode = "headless"
capabilities = { named = true }
enabled_tools = ["observe_host_summary"]
[targets.server]
ssh_host = "server-ordinary"
[automation.targets.server]
destination = "server-ordinary"
python = "/usr/bin/python3"

[tools.observe_host_summary]
description = "Observe selected Linux OS facts, boot identifier and bounded uptime through the ordinary SSH process view. Virtualization hints are not isolation attestation; the collection is not an atomic snapshot."
revision = "1_native1"
targets = ["server"]
authority = "automation"
effects = ["read"]
execution = { kind = "native_payload", source = "/etc/estus/payloads/observe_host_summary/collector.py", no_log = false }
fixed_args = { "target_python" = "/usr/bin/python3" }
input_map = {  }
limits = { timeout_secs = 30 }
input_schema = { "type" = "object", "properties" = {  }, "required" = [], "additionalProperties" = false }
[tools.observe_host_summary.result]
kind = "capability_projection"
fields = { "system" = ["mcp_result", "system"], "distribution" = ["mcp_result", "distribution"], "distribution_version" = ["mcp_result", "distribution_version"], "kernel" = ["mcp_result", "kernel"], "architecture" = ["mcp_result", "architecture"], "boot_id" = ["mcp_result", "boot_id"], "uptime_seconds" = ["mcp_result", "uptime_seconds"], "observed_at" = ["mcp_result", "observed_at"], "scope" = ["mcp_result", "scope"], "virtualization_type" = ["mcp_result", "virtualization_type"], "virtualization_role" = ["mcp_result", "virtualization_role"], "unavailable" = ["mcp_result", "unavailable"] }
max_bytes = 4096
max_items = 64
max_depth = 4
schema = { "type" = "object", "required" = ["system", "kernel", "architecture", "observed_at", "scope", "unavailable"], "additionalProperties" = false, "properties" = { "system" = { "type" = "string", "maxLength" = 64 }, "distribution" = { "type" = "string", "maxLength" = 128 }, "distribution_version" = { "type" = "string", "maxLength" = 128 }, "kernel" = { "type" = "string", "maxLength" = 256 }, "architecture" = { "type" = "string", "maxLength" = 64 }, "boot_id" = { "type" = "string", "minLength" = 36, "maxLength" = 36 }, "uptime_seconds" = { "type" = "integer", "minimum" = 0, "maximum" = 9007199254740991 }, "observed_at" = { "type" = "string", "maxLength" = 32 }, "scope" = { "type" = "string", "const" = "ssh_process_view", "maxLength" = 32 }, "virtualization_type" = { "type" = "string", "maxLength" = 64 }, "virtualization_role" = { "type" = "string", "maxLength" = 5, "enum" = ["guest", "host"] }, "unavailable" = { "type" = "array", "maxItems" = 6, "uniqueItems" = true, "items" = { "type" = "string", "maxLength" = 32, "enum" = ["distribution", "distribution_version", "boot_id", "uptime_seconds", "virtualization_type", "virtualization_role"] } } } }
