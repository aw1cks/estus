# Reviewed controller-owned native Python payload; no Ansible runtime required.
# Export, review payloads/observe_boot_entries/manifest.json and the fixed policy here, then enable it by name.
# The site supplies targets, authority and fixed policy; the collector digest is checked at load.
mode = "headless"
capabilities = { named = true }
enabled_tools = ["observe_boot_entries"]

[targets.server]
ssh_host = "server-ordinary"

[automation.authorities.catalog]
ssh_config_file = "/etc/estus/catalog-ssh.conf"
become = { method = "sudo", user = "root" }

[automation.authorities.catalog.targets.server]
destination = "server-catalog-admin"
python = "/usr/bin/python3"

[tools.observe_boot_entries]
description = "List bounded real bootctl entries with exact IDs and kernel/initrd associations. Source/type may be unknown on older bootctl. Command lines are withheld as sensitive."
revision = "1_native1"
targets = ["server"]
authority = "automation:catalog"
effects = ["read"]
execution = { kind = "native_payload", source = "/etc/estus/payloads/observe_boot_entries/collector.py", no_log = false }
fixed_args = { target_python = "/usr/bin/python3" }
input_map = { "offset" = "offset" }
limits = { timeout_secs = 60 }
input_schema = { "type" = "object", "properties" = { "offset" = { "type" = "integer", "minimum" = 0, "maximum" = 128 } }, "required" = [], "additionalProperties" = false }
result = { kind = "capability_projection", fields = { "boot_id" = ["mcp_result", "boot_id"], "source" = ["mcp_result", "source"], "unavailable" = ["mcp_result", "unavailable"], "observed_at" = ["mcp_result", "observed_at"], "entries" = ["mcp_result", "entries"], "total_count" = ["mcp_result", "total_count"], "next_offset" = ["mcp_result", "next_offset"], "scope" = ["mcp_result", "scope"] }, max_bytes = 4096, max_items = 256, max_depth = 8, schema = { "type" = "object", "properties" = { "boot_id" = { "type" = "string", "minLength" = 36, "maxLength" = 36 }, "source" = { "type" = "string", "maxLength" = 128 }, "unavailable" = { "type" = "array", "maxItems" = 32, "items" = { "type" = "string", "maxLength" = 128 } }, "observed_at" = { "type" = "string", "maxLength" = 32 }, "entries" = { "type" = "array", "maxItems" = 4, "items" = { "type" = "object", "properties" = { "entry_id" = { "type" = "string", "maxLength" = 255 }, "source" = { "type" = "string", "maxLength" = 128 }, "type" = { "type" = "string", "maxLength" = 128 }, "command_line_sensitive" = { "type" = "boolean" }, "unknown" = { "type" = "array", "maxItems" = 8, "items" = { "type" = "string", "maxLength" = 64 } }, "linux" = { "type" = "string", "maxLength" = 2048 }, "efi" = { "type" = "string", "maxLength" = 2048 }, "title" = { "type" = "string", "maxLength" = 2048 }, "path" = { "type" = "string", "maxLength" = 2048 }, "initrd" = { "type" = "array", "maxItems" = 16, "items" = { "type" = "string", "maxLength" = 2048 } } }, "required" = ["entry_id", "source", "type", "command_line_sensitive", "unknown"], "additionalProperties" = false } }, "total_count" = { "type" = "integer", "minimum" = 0, "maximum" = 128 }, "next_offset" = { "type" = "integer", "minimum" = -1, "maximum" = 128 }, "scope" = { "type" = "string", "maxLength" = 128 } }, "required" = ["boot_id", "source", "unavailable", "observed_at", "entries", "total_count", "next_offset", "scope"], "additionalProperties" = false } }
