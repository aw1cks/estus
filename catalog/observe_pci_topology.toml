[tools.observe_pci_topology]
description = "Read the PCI topology: root bridges, buses and the device tree beneath them. Numeric addresses only, from bounded sysfs reads."
revision = "1_native1"
authority = "automation"
effects = ["read"]
execution = { kind = "native_payload", source = "/etc/estus/payloads/observe_pci_topology/collector.py", no_log = false }
fixed_args = { target_python = "/usr/bin/python3" }

input_map = {  }
limits = { timeout_secs = 30 }
input_schema = { "type" = "object", "properties" = {  }, "required" = [], "additionalProperties" = false }
[tools.observe_pci_topology.result]
kind = "capability_projection"
fields = { "source" = ["mcp_result", "source"], "observed_at" = ["mcp_result", "observed_at"], "unavailable" = ["mcp_result", "unavailable"], "nodes" = ["mcp_result", "nodes"] , truncated = ["mcp_result", "truncated"], omitted_records = ["mcp_result", "omitted_records"] }
max_bytes = 4096
max_items = 256
max_depth = 8
schema = { "type" = "object", "properties" = { truncated = { type = "boolean" }, omitted_records = { type = "integer", minimum = 0, maximum = 9007199254740991 }, "source" = { "type" = "string", "maxLength" = 256 }, "observed_at" = { "type" = "string", "maxLength" = 64 }, "unavailable" = { "type" = "array", "items" = { "type" = "string", "maxLength" = 128 }, "maxItems" = 256 }, "nodes" = { "type" = "array", "items" = { "type" = "object", "properties" = { "address" = { "type" = "string", "maxLength" = 12 }, "ancestors" = { "type" = "array", "items" = { "type" = "string", "maxLength" = 12 }, "maxItems" = 32 } }, "required" = ["address", "ancestors"], "additionalProperties" = false }, "maxItems" = 256 } }, "required" = ["source", "observed_at", "unavailable", "nodes"], "additionalProperties" = false }
