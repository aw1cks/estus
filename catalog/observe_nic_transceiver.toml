[tools.observe_nic_transceiver]
description = "Read nonserial identity and typed sensor fields from a lab-only synthetic SFP EEPROM via real ethtool. Not physical optical measurement."
revision = "1_native1"
authority = "automation:catalog"
effects = ["read"]
execution = { kind = "native_payload", source = "/etc/estus/payloads/observe_nic_transceiver/collector.py", no_log = false }
fixed_args = { "target_python" = "/usr/bin/python3" }

input_map = {"interface" = "interface"}
limits = { timeout_secs = 40 }
input_schema = {"type" = "object","properties" = {"interface" = {"type" = "string","enum" = ["model0"],"maxLength" = 15}},"required" = ["interface"],"additionalProperties" = false}
[tools.observe_nic_transceiver.result]
kind = "capability_projection"
fields = {"interface" = ["mcp_result","interface"],"driver" = ["mcp_result","driver"],"scope" = ["mcp_result","scope"],"vendor" = ["mcp_result","vendor"],"part" = ["mcp_result","part"],"temperature_c" = ["mcp_result","temperature_c"],"voltage_v" = ["mcp_result","voltage_v"],"tx_bias_ma" = ["mcp_result","tx_bias_ma"],"tx_power_mw" = ["mcp_result","tx_power_mw"],"rx_power_mw" = ["mcp_result","rx_power_mw"],"source" = ["mcp_result","source"]}
max_bytes = 4096
max_items = 256
max_depth = 8
schema = {"type" = "object","properties" = {"interface" = {"type" = "string","enum" = ["model0"],"maxLength" = 15},"driver" = {"type" = "string","enum" = ["estus_nic_model"],"maxLength" = 32},"scope" = {"type" = "string","enum" = ["software_model"],"maxLength" = 14},"vendor" = {"type" = "string","enum" = ["ESTUS TEST"],"maxLength" = 16},"part" = {"type" = "string","enum" = ["SIM-SFP-1"],"maxLength" = 16},"temperature_c" = {"type" = "number","minimum" = -128,"maximum" = 127.996},"voltage_v" = {"type" = "number","minimum" = 0,"maximum" = 6.5535},"tx_bias_ma" = {"type" = "number","minimum" = 0,"maximum" = 131.07},"tx_power_mw" = {"type" = "number","minimum" = 0,"maximum" = 6.5535},"rx_power_mw" = {"type" = "number","minimum" = 0,"maximum" = 6.5535},"source" = {"type" = "string","maxLength" = 160}},"required" = ["interface","driver","scope","vendor","part","temperature_c","voltage_v","tx_bias_ma","tx_power_mw","rx_power_mw","source"],"additionalProperties" = false}
