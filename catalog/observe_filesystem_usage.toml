[tools.observe_filesystem_usage]
description = "Report capacity, available bytes and inode counts for one configured path's filesystem. Available may exclude reserved blocks."
revision = "1_native1"
authority = "automation"
effects = ["read"]
execution = { kind = "native_payload", source = "/etc/estus/payloads/observe_filesystem_usage/collector.py", no_log = false }
fixed_args = { "target_python" = "/usr/bin/python3" }

input_map = { "path_id" = "path_id" }
limits = { timeout_secs = 20 }
[tools.observe_filesystem_usage.input_schema]
type = "object"
required = ["path_id"]
additionalProperties = false
properties = { "path_id" = { "type" = "string", "maxLength" = 32, "enum" = ["data"] } }
[tools.observe_filesystem_usage.result]
kind = "capability_projection"
fields = { "observed_at" = ["mcp_result", "observed_at"], "path_id" = ["mcp_result", "path_id"], "configured_path" = ["mcp_result", "configured_path"], "resolved_path" = ["mcp_result", "resolved_path"], "status" = ["mcp_result", "status"], "device_id" = ["mcp_result", "device_id"], "fragment_size_bytes" = ["mcp_result", "fragment_size_bytes"], "total_bytes" = ["mcp_result", "total_bytes"], "free_bytes" = ["mcp_result", "free_bytes"], "available_bytes" = ["mcp_result", "available_bytes"], "inodes_total" = ["mcp_result", "inodes_total"], "inodes_free" = ["mcp_result", "inodes_free"], "inodes_available" = ["mcp_result", "inodes_available"] }
max_bytes = 4096
max_items = 256
max_depth = 8
[tools.observe_filesystem_usage.result.schema]
type = "object"
required = ["observed_at", "path_id", "configured_path", "resolved_path", "status"]
additionalProperties = false
properties = { "observed_at" = { "type" = "string", "maxLength" = 40 }, "path_id" = { "type" = "string", "maxLength" = 32 }, "configured_path" = { "type" = "string", "maxLength" = 1024 }, "resolved_path" = { "type" = "string", "maxLength" = 1024 }, "status" = { "type" = "string", "maxLength" = 16, "enum" = ["available", "missing", "denied"] }, "device_id" = { "type" = "integer", "minimum" = 0, "maximum" = 9007199254740991 }, "fragment_size_bytes" = { "type" = "integer", "minimum" = 0, "maximum" = 9007199254740991 }, "total_bytes" = { "type" = "integer", "minimum" = 0, "maximum" = 9007199254740991 }, "free_bytes" = { "type" = "integer", "minimum" = 0, "maximum" = 9007199254740991 }, "available_bytes" = { "type" = "integer", "minimum" = 0, "maximum" = 9007199254740991 }, "inodes_total" = { "type" = "integer", "minimum" = 0, "maximum" = 9007199254740991 }, "inodes_free" = { "type" = "integer", "minimum" = 0, "maximum" = 9007199254740991 }, "inodes_available" = { "type" = "integer", "minimum" = 0, "maximum" = 9007199254740991 } }
