# Reviewed controller-owned native Python payload; no Ansible runtime required.
# Export, review payloads/observe_nic_stats/manifest.json and fixed policy, then catalog prepare.
# Preparation creates explicit source/adapter/contract/authority approval; activation never refreshes it.
mode = "headless"
capabilities = { named = true }
enabled_tools = ["observe_nic_stats"]
[targets.server]
ssh_host = "server-ordinary"
[automation.targets.server]
destination = "server-ordinary"
python = "/usr/bin/python3"
[tools.observe_nic_stats]
description = "Actual bounded driver-specific cumulative statistics, not duplicated standard interface counters or invented rates."
revision = "1_native1"
targets = ["server"]
authority = "automation"
effects = ["read"]
execution = { kind = "native_payload", snapshot = "/etc/estus/observe_nic_stats.payload.json", source = "/etc/estus/payloads/observe_nic_stats/collector.py", no_log = false }
fixed_args = { target_python = "/usr/bin/python3" }
input_map = { "interface" = "interface", "filter" = "filter" }
limits = { timeout_secs = 30 }
input_schema = { "type" = "object", "properties" = { "interface" = { "type" = "string", "minLength" = 1, "maxLength" = 15 }, "filter" = { "type" = "string", "minLength" = 1, "maxLength" = 64 } }, "required" = ["interface"], "additionalProperties" = false }
[tools.observe_nic_stats.result]
kind = "capability_projection"
fields = { "source" = ["mcp_result", "source"], "observed_at" = ["mcp_result", "observed_at"], "unavailable" = ["mcp_result", "unavailable"], "interface" = ["mcp_result", "interface"], "supported" = ["mcp_result", "supported"], "counters" = ["mcp_result", "counters"] , total_counters = ["mcp_result", "total_counters"], truncated = ["mcp_result", "truncated"], omitted_records = ["mcp_result", "omitted_records"] }
max_bytes = 16384
max_items = 1024
max_depth = 8
schema = { "type" = "object", "properties" = { total_counters = { type = "integer", minimum = 0, maximum = 9007199254740991 }, truncated = { type = "boolean" }, omitted_records = { type = "integer", minimum = 0, maximum = 9007199254740991 }, "source" = { "type" = "string", "maxLength" = 256 }, "observed_at" = { "type" = "string", "maxLength" = 64 }, "unavailable" = { "type" = "array", "items" = { "type" = "string", "maxLength" = 128 }, "maxItems" = 256 }, "interface" = { "type" = "string", "maxLength" = 15 }, "supported" = { "type" = "boolean" }, "counters" = { "type" = "array", "items" = { "type" = "object", "properties" = { "name" = { "type" = "string", "maxLength" = 128 }, "value" = { "type" = "integer", "minimum" = 0, "maximum" = 9007199254740991 } }, "required" = ["name", "value"], "additionalProperties" = false }, "maxItems" = 1024 } }, "required" = ["source", "observed_at", "unavailable", "interface", "supported", "counters", "total_counters"], "additionalProperties" = false }
