[tools.observe_network_rules]
description = "Read the policy-routing rules that select routing tables before a lookup. Use it when a lookup disagrees with `observe_network_routes` or traffic takes an unexpected table. Rules selecting an interface outside the operator policy are omitted, and entries are capped by the limit."
revision = "1_native1"
authority = "automation"
effects = ["read"]
execution = { kind = "native_payload", source = "/etc/estus/payloads/observe_network_rules/collector.py", no_log = false }
fixed_args = { "target_python" = "/usr/bin/python3" }

input_map = { "family" = "family", "limit" = "limit" }
limits = { timeout_secs = 30 }
input_schema = { "type" = "object", "properties" = { "family" = { "type" = "string", "enum" = ["inet", "inet6"], "maxLength" = 256 }, "limit" = { "type" = "integer", "minimum" = 1, "maximum" = 16 } }, "required" = [], "additionalProperties" = false }
[tools.observe_network_rules.result]
kind = "capability_projection"
fields = { "entries" = ["mcp_result", "entries"], "truncated" = ["mcp_result", "truncated"], "scope" = ["mcp_result", "scope"] }
max_bytes = 4096
max_items = 256
max_depth = 8
schema = { "type" = "object", "properties" = { "entries" = { "type" = "array", "items" = { "type" = "object", "properties" = { "priority" = { "type" = "integer", "minimum" = 0, "maximum" = 9007199254740991 }, "source" = { "type" = "string", "maxLength" = 64 }, "destination" = { "type" = "string", "maxLength" = 64 }, "table" = { "type" = "string", "maxLength" = 32 }, "action" = { "type" = "string", "maxLength" = 32 } }, "required" = [], "additionalProperties" = false }, "maxItems" = 16 }, "truncated" = { "type" = "boolean" }, "scope" = { "type" = "string", "const" = "current_network_namespace", "maxLength" = 32 } }, "required" = ["entries", "truncated", "scope"], "additionalProperties" = false }
