# Opt-in: copy roles/observe_storage_devices to /etc/estus/roles/observe_storage_devices; export input_schema,
# fixed_args and input_map as overlay.json. Review the offline imported snapshot:
# estus --config observe_storage_devices.toml schema import-role observe_storage_devices --role-path /etc/estus/roles/observe_storage_devices --overlay overlay.json --output /etc/estus/observe_storage_devices.schema.json
# Provision mode0700 /var/lib/estus/runner, Python3 and declared inspection utilities.
# Maintained block geometry, partitions and holder/master relationships; no health probing or sensitive UUIDs/labels/serials.
mode = "headless"
capabilities = { named = true }
enabled_tools = ["observe_storage_devices"]
[targets.server]
ssh_host = "server-ordinary"
[automation]
workspace_root = "/var/lib/estus/runner"
max_concurrent = 2
max_scratch_bytes = 16777216
max_scratch_files = 512
[automation.targets.server]
destination = "server-ordinary"
python = "/usr/bin/python3"
[tools.observe_storage_devices]
description = "Maintained block geometry, partitions and holder/master relationships; no health probing or sensitive UUIDs/labels/serials."
revision = "1"
targets = ["server"]
authority = "automation"
effects = ["read"]
execution = { kind = "ansible_role", snapshot = "/etc/estus/observe_storage_devices.schema.json", role_path = "/etc/estus/observe_storage_devices.schema.roles/observe_storage_devices", no_log = false }
fixed_args = { target_python = "/usr/bin/python3" }
input_map = {  }
limits = { timeout_secs = 30 }
input_schema = { "type" = "object", "properties" = {  }, "required" = [], "additionalProperties" = false }
[tools.observe_storage_devices.result]
kind = "ansible_projection"
fields = { "source" = ["mcp_result", "source"], "observed_at" = ["mcp_result", "observed_at"], "unavailable" = ["mcp_result", "unavailable"], "devices" = ["mcp_result", "devices"] , truncated = ["mcp_result", "truncated"], omitted_records = ["mcp_result", "omitted_records"] }
max_bytes = 4096
max_items = 256
max_depth = 8
schema = { "type" = "object", "properties" = { truncated = { type = "boolean" }, omitted_records = { type = "integer", minimum = 0, maximum = 9007199254740991 }, "source" = { "type" = "string", "maxLength" = 256 }, "observed_at" = { "type" = "string", "maxLength" = 64 }, "unavailable" = { "type" = "array", "items" = { "type" = "string", "maxLength" = 128 }, "maxItems" = 256 }, "devices" = { "type" = "array", "items" = { "type" = "object", "properties" = { "name" = { "type" = "string", "maxLength" = 4096 }, "partitions" = { "type" = "array", "items" = { "type" = "object", "properties" = { "name" = { "type" = "string", "maxLength" = 4096 }, "sectors" = { "type" = "string", "maxLength" = 4096 }, "sectorsize" = { "type" = "string", "maxLength" = 4096 }, "size" = { "type" = "string", "maxLength" = 4096 }, "start" = { "type" = "string", "maxLength" = 4096 }, "holders" = { "type" = "array", "items" = { "type" = "string", "maxLength" = 4096 }, "maxItems" = 256 } }, "required" = ["name"], "additionalProperties" = false }, "maxItems" = 256 }, "model" = { "type" = "string", "maxLength" = 4096 }, "vendor" = { "type" = "string", "maxLength" = 4096 }, "size" = { "type" = "string", "maxLength" = 4096 }, "sectors" = { "type" = "string", "maxLength" = 4096 }, "sectorsize" = { "type" = "string", "maxLength" = 4096 }, "rotational" = { "type" = "string", "maxLength" = 4096 }, "removable" = { "type" = "string", "maxLength" = 4096 }, "scheduler_mode" = { "type" = "string", "maxLength" = 4096 }, "support_discard" = { "type" = "string", "maxLength" = 4096 }, "holders" = { "type" = "array", "items" = { "type" = "string", "maxLength" = 4096 }, "maxItems" = 256 }, "masters" = { "type" = "array", "items" = { "type" = "string", "maxLength" = 4096 }, "maxItems" = 256 } }, "required" = ["name", "partitions"], "additionalProperties" = false }, "maxItems" = 256 } }, "required" = ["source", "observed_at", "unavailable", "devices"], "additionalProperties" = false }
