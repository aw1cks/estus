# Reviewed controller-owned native Python payload; no Ansible runtime required.
# Export, review payloads/observe_journal_boots/manifest.json and the fixed policy here, then enable it by name.
# The site supplies targets, authority and fixed policy; the collector digest is checked at load.
mode = "headless"
capabilities = { named = true }
enabled_tools = ["observe_journal_boots"]
[targets.server]
ssh_host = "server-ordinary"
[automation.targets.server]
destination = "server-ordinary"
python = "/usr/bin/python3"
# Separate reviewed root automation identity; independent of native sudo allowlists.
[automation.authorities.catalog]
ssh_config_file = "/etc/estus/catalog-ssh.conf"
become = { method = "sudo", user = "root" }
[automation.authorities.catalog.targets.server]
destination = "server-catalog"
python = "/usr/bin/python3"
[tools.observe_journal_boots]
description = "List retained journal boots with their timestamps. Retention may omit older boots."
revision = "1_native1"
targets = ["server"]
authority = "automation:catalog"
effects = ["read"]
execution = { kind = "native_payload", source = "/etc/estus/payloads/observe_journal_boots/collector.py", no_log = false }
fixed_args = { "target_python" = "/usr/bin/python3" }
input_map = { "limit" = "limit" }
limits = { timeout_secs = 40 }
input_schema = { "type" = "object", "properties" = { "limit" = { "type" = "integer", "minimum" = 1, "maximum" = 8 } }, "required" = ["limit"], "additionalProperties" = false }
[tools.observe_journal_boots.result]
kind = "capability_projection"
fields = { "boots" = ["mcp_result", "boots"], "incomplete" = ["mcp_result", "incomplete"], "truncated" = ["mcp_result", "truncated"] }
max_bytes = 4096
max_items = 256
max_depth = 8
schema = { "type" = "object", "properties" = { "boots" = { "type" = "array", "items" = { "type" = "object", "properties" = { "index" = { "type" = "integer", "minimum" = -2147483648, "maximum" = 2147483647 }, "boot_id" = { "type" = "string", "maxLength" = 32 }, "retained_range_text" = { "type" = "string", "maxLength" = 256 } }, "required" = ["index", "boot_id", "retained_range_text"], "additionalProperties" = false }, "maxItems" = 8 }, "incomplete" = { "type" = "boolean", "const" = true }, "truncated" = { "type" = "boolean" } }, "required" = ["boots", "incomplete", "truncated"], "additionalProperties" = false }
