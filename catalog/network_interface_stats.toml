# Opt-in Linux network_interface_stats; reviewed role and separately imported snapshot required.
# Copy roles/network_interface_stats to /etc/estus/roles/network_interface_stats; export input_schema/fixed_args/input_map as overlay.json.
# estus --config network_interface_stats.toml schema import-role network_interface_stats --role-path /etc/estus/roles/network_interface_stats --overlay overlay.json --output /etc/estus/network_interface_stats.schema.json
# Offline import never runs tasks; review snapshot before enabling. Provision runner root mode 0700.
# Requires pinned /usr/bin/python3 and fixed iproute2 utilities; probes additionally ping/traceroute as applicable.
# Operator policy is fixed_args only: callers cannot replace it. No persistent manager changes or flush/batch.
profile = "actions-only"
enabled_tools = ["network_interface_stats"]
[targets.server]
ssh_host = "server-ordinary"
[automation]
workspace_root = "/var/lib/estus/runner"
max_concurrent = 2
max_scratch_bytes = 16777216
max_scratch_files = 512
[automation.targets.server]
destination = "server-ordinary"
python = "/usr/bin/python3"
[tools.network_interface_stats]
description = "network interface stats. Bounded Linux observations; operator-approved interfaces; no process attribution, flags, namespace execution or mutation."
revision = "1"
targets = ["server"]
authority = "automation"
effects = ["read"]
execution = { "kind" = "ansible_role", "snapshot" = "/etc/estus/network_interface_stats.schema.json", "role_path" = "/etc/estus/network_interface_stats.schema.roles/network_interface_stats", "no_log" = false }
fixed_args = { "target_python" = "/usr/bin/python3", "operator_policy" = { "interface" = "catalog0", "interfaces" = ["lo", "catalog0"], "destinations" = ["127.0.0.1", "192.0.2.2"], "ports" = [18080], "addresses" = ["192.0.2.9/24"], "routes" = ["198.51.100.0/24"], "neighbors" = ["192.0.2.2"], "namespaces" = ["catalogns"], "dns_names" = ["catalog.test"], "resolver" = "127.0.0.1", "dns_port" = 15353 } }
input_map = { "interface" = "interface" }
limits = { timeout_secs = 30 }
input_schema = { "type" = "object", "properties" = { "interface" = { "type" = "string", "enum" = ["lo", "catalog0"], "maxLength" = 256 } }, "required" = ["interface"], "additionalProperties" = false }
[tools.network_interface_stats.result]
kind = "ansible_projection"
fields = { "interface" = ["mcp_result", "interface"], "counters" = ["mcp_result", "counters"] }
max_bytes = 4096
max_items = 256
max_depth = 8
schema = { "type" = "object", "properties" = { "interface" = { "type" = "string", "maxLength" = 15 }, "counters" = { "type" = "object", "properties" = { "rx_bytes" = { "type" = "integer", "minimum" = 0, "maximum" = 9007199254740991 }, "rx_packets" = { "type" = "integer", "minimum" = 0, "maximum" = 9007199254740991 }, "rx_errors" = { "type" = "integer", "minimum" = 0, "maximum" = 9007199254740991 }, "rx_dropped" = { "type" = "integer", "minimum" = 0, "maximum" = 9007199254740991 }, "tx_bytes" = { "type" = "integer", "minimum" = 0, "maximum" = 9007199254740991 }, "tx_packets" = { "type" = "integer", "minimum" = 0, "maximum" = 9007199254740991 }, "tx_errors" = { "type" = "integer", "minimum" = 0, "maximum" = 9007199254740991 }, "tx_dropped" = { "type" = "integer", "minimum" = 0, "maximum" = 9007199254740991 } }, "required" = ["rx_bytes", "rx_packets", "rx_errors", "rx_dropped", "tx_bytes", "tx_packets", "tx_errors", "tx_dropped"], "additionalProperties" = false } }, "required" = ["interface", "counters"], "additionalProperties" = false }
