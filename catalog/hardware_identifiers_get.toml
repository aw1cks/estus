# Opt-in: copy roles/hardware_identifiers_get to /etc/estus/roles/hardware_identifiers_get; export input_schema,
# fixed_args and input_map as overlay.json. Review the offline imported snapshot:
# estus --config hardware_identifiers_get.toml schema import-role hardware_identifiers_get --role-path /etc/estus/roles/hardware_identifiers_get --overlay overlay.json --output /etc/estus/hardware_identifiers_get.schema.json
# Provision mode0700 /var/lib/estus/runner, Python3 and declared inspection utilities.
# Selected firmware-reported DMI fields; unknown placeholders omitted, not authenticated identity. Sensitive serial/UUID/asset capability requires independent privileged approval; results intentionally disclose these selected identifiers.
mode = "headless"
capabilities = { named = true }
enabled_tools = ["hardware_identifiers_get"]
[targets.server]
ssh_host = "server-ordinary"
[automation]
workspace_root = "/var/lib/estus/runner"
max_concurrent = 2
max_scratch_bytes = 16777216
max_scratch_files = 512
[automation.targets.server]
destination = "server-ordinary"
python = "/usr/bin/python3"
[tools.hardware_identifiers_get]
description = "Selected firmware-reported DMI fields; unknown placeholders omitted, not authenticated identity. Sensitive serial/UUID/asset capability requires independent privileged approval; results intentionally disclose these selected identifiers."
revision = "1"
targets = ["server"]
authority = "automation:catalog"
effects = ["read"]
# Typed disclosure requires uncensored projection events; do not enable without
# separate sensitive-read approval and private Runner scratch/event handling.
execution = { kind = "ansible_role", snapshot = "/etc/estus/hardware_identifiers_get.schema.json", role_path = "/etc/estus/hardware_identifiers_get.schema.roles/hardware_identifiers_get", no_log = false }
fixed_args = { target_python = "/usr/bin/python3" }
input_map = {  }
limits = { timeout_secs = 30 }
input_schema = { "type" = "object", "properties" = {  }, "required" = [], "additionalProperties" = false }
[tools.hardware_identifiers_get.result]
kind = "ansible_projection"
fields = { "source" = ["mcp_result", "source"], "observed_at" = ["mcp_result", "observed_at"], "unavailable" = ["mcp_result", "unavailable"], "values" = ["mcp_result", "values"] , truncated = ["mcp_result", "truncated"], omitted_records = ["mcp_result", "omitted_records"] }
max_bytes = 4096
max_items = 256
max_depth = 8
schema = { "type" = "object", "properties" = { truncated = { type = "boolean" }, omitted_records = { type = "integer", minimum = 0, maximum = 9007199254740991 }, "source" = { "type" = "string", "maxLength" = 256 }, "observed_at" = { "type" = "string", "maxLength" = 64 }, "unavailable" = { "type" = "array", "items" = { "type" = "string", "maxLength" = 128 }, "maxItems" = 256 }, "values" = { "type" = "object", "properties" = { "product_serial" = { "type" = "string", "maxLength" = 4096 }, "product_uuid" = { "type" = "string", "maxLength" = 4096 }, "board_serial" = { "type" = "string", "maxLength" = 4096 }, "chassis_serial" = { "type" = "string", "maxLength" = 4096 }, "chassis_asset_tag" = { "type" = "string", "maxLength" = 4096 } }, "required" = [], "additionalProperties" = false } }, "required" = ["source", "observed_at", "unavailable", "values"], "additionalProperties" = false }
