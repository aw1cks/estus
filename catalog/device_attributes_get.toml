# Reviewed controller-owned native Python payload; no Ansible runtime required.
# Export, review payloads/device_attributes_get/manifest.json and fixed policy, then catalog prepare.
# Preparation creates explicit source/adapter/contract/authority approval; activation never refreshes it.
mode = "headless"
capabilities = { named = true }
enabled_tools = ["device_attributes_get"]
[targets.server]
ssh_host = "server-ordinary"
[automation.targets.server]
destination = "server-ordinary"
python = "/usr/bin/python3"
[tools.device_attributes_get]
description = "Read reviewed net/block sysfs device attributes through operator logical aliases. No caller paths, arbitrary classes, privileged controls, reset, unbind or config-space reads. Symlink resolution stays below /sys/devices. Values are bounded text with missing/denied explicit, not hardware capability claims."
revision = "1_native1"
targets = ["server"]
authority = "automation"
effects = ["read"]
execution = { kind = "native_payload", snapshot = "/etc/estus/device_attributes_get.payload.json", source = "/etc/estus/payloads/device_attributes_get/collector.py", no_log = false }
fixed_args = { "target_python" = "/usr/bin/python3", "reviewed_devices" = { "loopback" = { "class" = "net", "name" = "lo", "attributes" = ["mtu", "operstate", "address"] } } }
input_map = { "device" = "device", "attributes" = "attributes" }
limits = { timeout_secs = 20 }
[tools.device_attributes_get.input_schema]
type = "object"
required = ["device", "attributes"]
additionalProperties = false
properties = { "device" = { "type" = "string", "maxLength" = 32, "enum" = ["loopback"] }, "attributes" = { "type" = "array", "maxItems" = 3, "items" = { "type" = "string", "maxLength" = 32, "enum" = ["mtu", "operstate", "address"] } } }
[tools.device_attributes_get.result]
kind = "capability_projection"
fields = { "observed_at" = ["mcp_result", "observed_at"], "device" = ["mcp_result", "device"], "class" = ["mcp_result", "class"], "name" = ["mcp_result", "name"], "sysfs_path" = ["mcp_result", "sysfs_path"], "attributes" = ["mcp_result", "attributes"] }
max_bytes = 4096
max_items = 256
max_depth = 8
[tools.device_attributes_get.result.schema]
type = "object"
required = ["observed_at", "device", "class", "name", "sysfs_path", "attributes"]
additionalProperties = false
properties = { "observed_at" = { "type" = "string", "maxLength" = 40 }, "device" = { "type" = "string", "maxLength" = 32 }, "class" = { "type" = "string", "maxLength" = 16, "enum" = ["net", "block"] }, "name" = { "type" = "string", "maxLength" = 64 }, "sysfs_path" = { "type" = "string", "maxLength" = 1024 }, "attributes" = { "type" = "array", "maxItems" = 3, "items" = { "type" = "object", "required" = ["attribute", "status"], "additionalProperties" = false, "properties" = { "attribute" = { "type" = "string", "maxLength" = 32 }, "status" = { "type" = "string", "maxLength" = 16, "enum" = ["available", "missing", "denied"] }, "value" = { "type" = "string", "maxLength" = 4096 } } } } }
