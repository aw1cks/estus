# Reviewed controller-owned native Python payload; no Ansible runtime required.
# Export, review payloads/inspect_processes/manifest.json and the fixed policy here, then enable it by name.
# Preparation creates explicit source/adapter/contract/authority approval; activation never refreshes it.
mode = "headless"
capabilities = { named = true }
enabled_tools = ["inspect_processes"]
[targets.server]
ssh_host = "server-ordinary"
[automation.targets.server]
destination = "server-ordinary"
python = "/usr/bin/python3"
[tools.inspect_processes]
description = "Bounded procfs process inventory filtered by exact real UID and literal name substring. No argv, environment, memory contents or FD targets. PID identity includes boot ID and start ticks; churn is skipped and counted, truncated means incomplete scan or result. Counters are cumulative ticks/pages, not rates."
revision = "1_native1"
targets = ["server"]
authority = "automation"
effects = ["read", "sensitive_read"]
execution = { kind = "native_payload", source = "/etc/estus/payloads/inspect_processes/collector.py", no_log = false }
fixed_args = { "target_python" = "/usr/bin/python3" }
input_map = { "uid" = "uid", "name_contains" = "name_contains", "limit" = "limit" }
limits = { timeout_secs = 20 }
[tools.inspect_processes.input_schema]
type = "object"
required = ["uid", "name_contains", "limit"]
additionalProperties = false
properties = { "uid" = { "type" = "integer", "minimum" = 0, "maximum" = 4294967295 }, "name_contains" = { "type" = "string", "maxLength" = 64 }, "limit" = { "type" = "integer", "minimum" = 1, "maximum" = 8 } }
[tools.inspect_processes.result]
kind = "capability_projection"
fields = { "observed_at" = ["mcp_result", "observed_at"], "processes" = ["mcp_result", "processes"], "scanned" = ["mcp_result", "scanned"], "skipped" = ["mcp_result", "skipped"], "truncated" = ["mcp_result", "truncated"], "clock_ticks_per_second" = ["mcp_result", "clock_ticks_per_second"], "page_size_bytes" = ["mcp_result", "page_size_bytes"] }
max_bytes = 4096
max_items = 256
max_depth = 8
[tools.inspect_processes.result.schema]
type = "object"
required = ["observed_at", "processes", "scanned", "skipped", "truncated", "clock_ticks_per_second", "page_size_bytes"]
additionalProperties = false
properties = { "observed_at" = { "type" = "string", "maxLength" = 40 }, "processes" = { "type" = "array", "maxItems" = 128, "items" = { "type" = "object", "required" = ["pid", "start_ticks", "boot_id", "name", "state", "ppid", "uid", "user_ticks", "system_ticks", "virtual_bytes", "resident_pages"], "additionalProperties" = false, "properties" = { "pid" = { "type" = "integer", "minimum" = 1, "maximum" = 4194304 }, "start_ticks" = { "type" = "integer", "minimum" = 0, "maximum" = 9007199254740991 }, "boot_id" = { "type" = "string", "maxLength" = 36, "minLength" = 36 }, "name" = { "type" = "string", "maxLength" = 256 }, "state" = { "type" = "string", "maxLength" = 1 }, "ppid" = { "type" = "integer", "minimum" = 0, "maximum" = 9007199254740991 }, "uid" = { "type" = "integer", "minimum" = 0, "maximum" = 9007199254740991 }, "user_ticks" = { "type" = "integer", "minimum" = 0, "maximum" = 9007199254740991 }, "system_ticks" = { "type" = "integer", "minimum" = 0, "maximum" = 9007199254740991 }, "virtual_bytes" = { "type" = "integer", "minimum" = 0, "maximum" = 9007199254740991 }, "resident_pages" = { "type" = "integer", "minimum" = 0, "maximum" = 9007199254740991 } } } }, "scanned" = { "type" = "integer", "minimum" = 0, "maximum" = 4096 }, "skipped" = { "type" = "integer", "minimum" = 0, "maximum" = 4096 }, "truncated" = { "type" = "boolean" }, "clock_ticks_per_second" = { "type" = "integer", "minimum" = 1, "maximum" = 1048576 }, "page_size_bytes" = { "type" = "integer", "minimum" = 1, "maximum" = 1048576 } }
