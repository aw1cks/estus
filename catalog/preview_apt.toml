[tools.preview_apt]
description = "Preview an apt change in check mode, including a diff where apt supports one. Nothing is installed."
revision = "1"
authority = "automation:catalog"
effects = ["read"]
execution = { kind = "ansible_module", module = "ansible.builtin.apt", no_log = false, check_mode = true, diff = true }
fixed_args = { auto_install_module_deps = false }

input_map = { name = "name", state = "state", update_cache = "update_cache", purge = "purge", allow_downgrade = "allow_downgrade" }
limits = { timeout_secs = 60 }
input_schema = { type = "object", properties = { name = { type = "array", items = { type = "string", minLength = 1, maxLength = 128 }, minItems = 1, maxItems = 32 }, state = { type = "string", enum = ["present", "absent", "latest"] }, update_cache = { type = "boolean" }, purge = { type = "boolean" }, allow_downgrade = { type = "boolean" } }, required = ["name", "state"], additionalProperties = false }

[tools.preview_apt.result]
kind = "ansible_projection"
fields = { changed = ["changed"], diff = ["diff"] }
max_bytes = 4096
max_items = 64
max_depth = 5
schema = { type = "object", properties = { changed = { type = "boolean" }, diff = { type = "object", properties = { before = { type = "string", maxLength = 2048 }, after = { type = "string", maxLength = 2048 }, before_header = { type = "string", maxLength = 256 }, after_header = { type = "string", maxLength = 256 }, prepared = { type = "string", maxLength = 2048 } }, additionalProperties = false } }, required = ["changed"], additionalProperties = false }
