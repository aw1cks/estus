[tools.observe_packages]
description = "List installed packages from the target's dpkg (apt), rpm or apk database without refreshing caches or installing anything."
revision = "1_native1"
authority = "automation"
effects = ["read"]
execution = { kind = "native_payload", source = "/etc/estus/payloads/observe_packages/collector.py", no_log = false }
fixed_args = { "target_python" = "/usr/bin/python3" }

input_map = { "offset" = "offset", "limit" = "limit", "name" = "name" }
limits = { timeout_secs = 30 }
input_schema = { "type" = "object", "properties" = { "offset" = { "type" = "integer", "minimum" = 0, "maximum" = 65536 }, "limit" = { "type" = "integer", "minimum" = 1, "maximum" = 100 }, "name" = { "type" = "string", "minLength" = 1, "maxLength" = 64 } }, "required" = [], "additionalProperties" = false }
[tools.observe_packages.result]
kind = "capability_projection"
fields = { "backend" = ["mcp_result", "backend"], "packages" = ["mcp_result", "packages"], "offset" = ["mcp_result", "offset"], "total" = ["mcp_result", "total"], "truncated" = ["mcp_result", "truncated"] }
max_bytes = 16384
max_items = 1024
max_depth = 6
schema = { "type" = "object", "additionalProperties" = false, "required" = ["backend", "packages", "offset", "total", "truncated"], "properties" = { "backend" = { "type" = "string", "enum" = ["apt", "rpm", "apk"], "maxLength" = 5 }, "packages" = { "type" = "array", "maxItems" = 1024, "items" = { "type" = "object", "additionalProperties" = false, "required" = ["name", "version", "architecture", "source"], "properties" = { "name" = { "type" = "string", "maxLength" = 64 }, "version" = { "type" = "string", "maxLength" = 96 }, "architecture" = { "type" = "string", "maxLength" = 64 }, "source" = { "type" = "string", "maxLength" = 128 } } } }, "offset" = { "type" = "integer", "minimum" = 0, "maximum" = 4096 }, "total" = { "type" = "integer", "minimum" = 0, "maximum" = 4096 }, "truncated" = { "type" = "boolean" } } }
