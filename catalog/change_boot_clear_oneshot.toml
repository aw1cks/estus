# Reviewed controller-owned native Python payload; no Ansible runtime required.
# Export, review payloads/change_boot_clear_oneshot/manifest.json and fixed policy, then catalog prepare.
# Preparation creates explicit source/adapter/contract/authority approval; activation never refreshes it.
mode = "headless"
capabilities = { named = true }
enabled_tools = ["change_boot_clear_oneshot"]

[targets.server]
ssh_host = "server-ordinary"

[automation.authorities.catalog]
ssh_config_file = "/etc/estus/catalog-ssh.conf"
become = { method = "sudo", user = "root" }

[automation.authorities.catalog.targets.server]
destination = "server-catalog-admin"
python = "/usr/bin/python3"

[tools.change_boot_clear_oneshot]
description = "Clear systemd-boot EFI next-boot override and verify absence. Does not clear persistent defaults or reboot."
revision = "1_native1"
targets = ["server"]
authority = "automation:catalog"
effects = ["read", "runtime_write"]
execution = { kind = "native_payload", snapshot = "/etc/estus/change_boot_clear_oneshot.payload.json", source = "/etc/estus/payloads/change_boot_clear_oneshot/collector.py", no_log = false }
fixed_args = { target_python = "/usr/bin/python3" }
input_map = {  }
limits = { timeout_secs = 60 }
input_schema = { "type" = "object", "properties" = {  }, "required" = [], "additionalProperties" = false }
result = { kind = "capability_projection", fields = { "boot_id" = ["mcp_result", "boot_id"], "source" = ["mcp_result", "source"], "unavailable" = ["mcp_result", "unavailable"], "observed_at" = ["mcp_result", "observed_at"], "entry_id" = ["mcp_result", "entry_id"], "selection_variable" = ["mcp_result", "selection_variable"], "previous_selection" = ["mcp_result", "previous_selection"], "observed_selection" = ["mcp_result", "observed_selection"], "reboot_requested" = ["mcp_result", "reboot_requested"], "outcome" = ["mcp_result", "outcome"], "command_returncode" = ["mcp_result", "command_returncode"], "postcondition_verified" = ["mcp_result", "postcondition_verified"], "persistent" = ["mcp_result", "persistent"] }, max_bytes = 4096, max_items = 256, max_depth = 8, schema = { "type" = "object", "properties" = { "boot_id" = { "type" = "string", "minLength" = 36, "maxLength" = 36 }, "source" = { "type" = "string", "maxLength" = 128 }, "unavailable" = { "type" = "array", "maxItems" = 32, "items" = { "type" = "string", "maxLength" = 128 } }, "observed_at" = { "type" = "string", "maxLength" = 32 }, "entry_id" = { "type" = "string", "maxLength" = 255 }, "selection_variable" = { "type" = "string", "maxLength" = 64 }, "previous_selection" = { "type" = "string", "maxLength" = 2048 }, "observed_selection" = { "type" = "string", "maxLength" = 2048 }, "reboot_requested" = { "type" = "boolean" }, "outcome" = { "type" = "string", "maxLength" = 32 }, "command_returncode" = { "type" = "integer", "minimum" = -255, "maximum" = 255 }, "postcondition_verified" = { "type" = "boolean" }, "persistent" = { "type" = "boolean" } }, "required" = ["boot_id", "source", "unavailable", "observed_at", "entry_id", "selection_variable", "previous_selection", "observed_selection", "reboot_requested", "outcome", "command_returncode", "postcondition_verified", "persistent"], "additionalProperties" = false } }
