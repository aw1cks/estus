[tools.inspect_tcp_connect_probe]
description = "Attempt one bounded TCP connection to an approved destination and port. Active probe; success proves reachability only."
revision = "1_native1"
authority = "automation"
effects = ["probe"]
execution = { kind = "native_payload", source = "/etc/estus/payloads/inspect_tcp_connect_probe/collector.py", no_log = false }
fixed_args = { "target_python" = "/usr/bin/python3" }

input_map = { "destination" = "destination", "destination_port" = "destination_port", "probe_timeout" = "timeout" }
limits = { timeout_secs = 30 }
input_schema = { "type" = "object", "properties" = { "destination" = { "type" = "string", "minLength" = 1, "maxLength" = 64 }, "destination_port" = { "type" = "integer", "minimum" = 1024, "maximum" = 65535 }, "timeout" = { "type" = "integer", "minimum" = 1, "maximum" = 3 } }, "required" = ["destination", "destination_port", "timeout"], "additionalProperties" = false }
[tools.inspect_tcp_connect_probe.result]
kind = "capability_projection"
fields = { "destination" = ["mcp_result", "destination"], "destination_port" = ["mcp_result", "destination_port"], "connected" = ["mcp_result", "connected"], "elapsed_ms" = ["mcp_result", "elapsed_ms"], "bytes_sent" = ["mcp_result", "bytes_sent"] }
max_bytes = 4096
max_items = 256
max_depth = 8
schema = { "type" = "object", "properties" = { "destination" = { "type" = "string", "maxLength" = 64 }, "destination_port" = { "type" = "integer", "minimum" = 1, "maximum" = 65535 }, "connected" = { "type" = "boolean" }, "elapsed_ms" = { "type" = "integer", "minimum" = 0, "maximum" = 9007199254740991 }, "bytes_sent" = { "type" = "integer", "const" = 0 } }, "required" = ["destination", "destination_port", "connected", "elapsed_ms", "bytes_sent"], "additionalProperties" = false }
