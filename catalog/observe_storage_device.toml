# Reviewed controller-owned native Python payload; no Ansible runtime required.
# Export, review payloads/observe_storage_device/manifest.json and the fixed policy here, then enable it by name.
# The site supplies targets, authority and fixed policy; the collector digest is checked at load.
mode = "headless"
capabilities = { named = true }
[selection]
allow = ["observe_storage_device"]
[targets.server]
ssh_host = "server-ordinary"
[automation.targets.server]
destination = "server-ordinary"
python = "/usr/bin/python3"

[tools.observe_storage_device]
description = "Read one block device's geometry, partitions and holder relationships. No health probing and no UUIDs, labels or serials."
revision = "1_native1"
targets = ["server"]
authority = "automation"
effects = ["read"]
execution = { kind = "native_payload", source = "/etc/estus/payloads/observe_storage_device/collector.py", no_log = false }
fixed_args = { "target_python" = "/usr/bin/python3" }
input_map = { "device" = "device" }
limits = { timeout_secs = 30 }
input_schema = { "type" = "object", "properties" = { "device" = { "type" = "string", "minLength" = 1, "maxLength" = 64 } }, "required" = ["device"], "additionalProperties" = false }
[tools.observe_storage_device.result]
kind = "capability_projection"
fields = { "source" = ["mcp_result", "source"], "observed_at" = ["mcp_result", "observed_at"], "unavailable" = ["mcp_result", "unavailable"], "device" = ["mcp_result", "device"], "truncated" = ["mcp_result", "truncated"], "omitted_records" = ["mcp_result", "omitted_records"] }
max_bytes = 4096
max_items = 256
max_depth = 8
schema = { "type" = "object", "properties" = { "truncated" = { "type" = "boolean" }, "omitted_records" = { "type" = "integer", "minimum" = 0, "maximum" = 9007199254740991 }, "source" = { "type" = "string", "maxLength" = 256 }, "observed_at" = { "type" = "string", "maxLength" = 64 }, "unavailable" = { "type" = "array", "items" = { "type" = "string", "maxLength" = 128 }, "maxItems" = 256 }, "device" = { "type" = "object", "properties" = { "name" = { "type" = "string", "maxLength" = 4096 }, "partitions" = { "type" = "array", "items" = { "type" = "object", "properties" = { "name" = { "type" = "string", "maxLength" = 4096 }, "sectors" = { "type" = "string", "maxLength" = 4096 }, "sectorsize" = { "type" = "string", "maxLength" = 4096 }, "size" = { "type" = "string", "maxLength" = 4096 }, "start" = { "type" = "string", "maxLength" = 4096 }, "holders" = { "type" = "array", "items" = { "type" = "string", "maxLength" = 4096 }, "maxItems" = 256 } }, "required" = ["name"], "additionalProperties" = false }, "maxItems" = 256 }, "model" = { "type" = "string", "maxLength" = 4096 }, "vendor" = { "type" = "string", "maxLength" = 4096 }, "size" = { "type" = "string", "maxLength" = 4096 }, "sectors" = { "type" = "string", "maxLength" = 4096 }, "sectorsize" = { "type" = "string", "maxLength" = 4096 }, "rotational" = { "type" = "string", "maxLength" = 4096 }, "removable" = { "type" = "string", "maxLength" = 4096 }, "scheduler_mode" = { "type" = "string", "maxLength" = 4096 }, "support_discard" = { "type" = "string", "maxLength" = 4096 }, "holders" = { "type" = "array", "items" = { "type" = "string", "maxLength" = 4096 }, "maxItems" = 256 }, "masters" = { "type" = "array", "items" = { "type" = "string", "maxLength" = 4096 }, "maxItems" = 256 } }, "required" = ["name", "partitions"], "additionalProperties" = false } }, "required" = ["source", "observed_at", "unavailable", "device"], "additionalProperties" = false }
