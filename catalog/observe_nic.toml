# Reviewed controller-owned native Python payload; no Ansible runtime required.
# Export, review payloads/observe_nic/manifest.json and the fixed policy here, then enable it by name.
# The site supplies targets, authority and fixed policy; the collector digest is checked at load.
mode = "headless"
capabilities = { named = true }
[selection]
allow = ["observe_nic"]
[targets.server]
ssh_host = "server-ordinary"
[automation.targets.server]
destination = "server-ordinary"
python = "/usr/bin/python3"
[tools.observe_nic]
description = "Read one interface's link settings, ring sizes, channel counts or coalescing parameters through fixed read-only ethtool queries. Values stay as driver-reported text; unsupported fields are listed as unavailable."
revision = "1_native1"
targets = ["server"]
authority = "automation"
effects = ["read"]
execution = { kind = "native_payload", source = "/etc/estus/payloads/observe_nic/collector.py", no_log = false }
fixed_args = { target_python = "/usr/bin/python3" }
limits = { timeout_secs = 30 }
input_map = { interface = "interface", aspect = "aspect" }
input_schema = { type = "object", properties = { interface = { type = "string", minLength = 1, maxLength = 15 }, aspect = { type = "string", enum = ["channels", "coalesce", "link", "rings"] } }, required = ["interface", "aspect"], additionalProperties = false }
[tools.observe_nic.result]
kind = "capability_projection"
fields = { "source" = ["mcp_result", "source"], "observed_at" = ["mcp_result", "observed_at"], "unavailable" = ["mcp_result", "unavailable"], "interface" = ["mcp_result", "interface"], "aspect" = ["mcp_result", "aspect"], "channels" = ["mcp_result", "channels"], "coalesce" = ["mcp_result", "coalesce"], "link" = ["mcp_result", "link"], "rings" = ["mcp_result", "rings"], truncated = ["mcp_result", "truncated"], omitted_records = ["mcp_result", "omitted_records"] }
max_bytes = 4096
max_items = 256
max_depth = 8
schema = { "type" = "object", "properties" = { "truncated" = { "type" = "boolean" }, "omitted_records" = { "type" = "integer", "minimum" = 0, "maximum" = 9007199254740991 }, "source" = { "type" = "string", "maxLength" = 256 }, "observed_at" = { "type" = "string", "maxLength" = 64 }, "unavailable" = { "type" = "array", "items" = { "type" = "string", "maxLength" = 128 }, "maxItems" = 256 }, "interface" = { "type" = "string", "maxLength" = 15 }, "aspect" = { "type" = "string", "enum" = ["channels", "coalesce", "link", "rings"], "maxLength" = 8 }, "channels" = { "type" = "object", "properties" = { "supported" = { "type" = "boolean" }, "values" = { "type" = "object", "properties" = { "maximum_rx" = { "type" = "string", "maxLength" = 4096 }, "maximum_tx" = { "type" = "string", "maxLength" = 4096 }, "maximum_other" = { "type" = "string", "maxLength" = 4096 }, "maximum_combined" = { "type" = "string", "maxLength" = 4096 }, "current_rx" = { "type" = "string", "maxLength" = 4096 }, "current_tx" = { "type" = "string", "maxLength" = 4096 }, "current_other" = { "type" = "string", "maxLength" = 4096 }, "current_combined" = { "type" = "string", "maxLength" = 4096 } }, "required" = [], "additionalProperties" = false } }, "required" = ["supported", "values"], "additionalProperties" = false }, "coalesce" = { "type" = "object", "properties" = { "supported" = { "type" = "boolean" }, "values" = { "type" = "object", "properties" = { "rx_usecs" = { "type" = "string", "maxLength" = 4096 }, "rx_frames" = { "type" = "string", "maxLength" = 4096 }, "rx_usecs_irq" = { "type" = "string", "maxLength" = 4096 }, "rx_frames_irq" = { "type" = "string", "maxLength" = 4096 }, "tx_usecs" = { "type" = "string", "maxLength" = 4096 }, "tx_frames" = { "type" = "string", "maxLength" = 4096 }, "tx_usecs_irq" = { "type" = "string", "maxLength" = 4096 }, "tx_frames_irq" = { "type" = "string", "maxLength" = 4096 }, "stats_block_usecs" = { "type" = "string", "maxLength" = 4096 }, "pkt_rate_low" = { "type" = "string", "maxLength" = 4096 }, "rx_usecs_low" = { "type" = "string", "maxLength" = 4096 }, "rx_frames_low" = { "type" = "string", "maxLength" = 4096 }, "tx_usecs_low" = { "type" = "string", "maxLength" = 4096 }, "tx_frames_low" = { "type" = "string", "maxLength" = 4096 }, "pkt_rate_high" = { "type" = "string", "maxLength" = 4096 }, "rx_usecs_high" = { "type" = "string", "maxLength" = 4096 }, "rx_frames_high" = { "type" = "string", "maxLength" = 4096 }, "tx_usecs_high" = { "type" = "string", "maxLength" = 4096 }, "tx_frames_high" = { "type" = "string", "maxLength" = 4096 }, "sample_interval" = { "type" = "string", "maxLength" = 4096 } }, "required" = [], "additionalProperties" = false } }, "required" = ["supported", "values"], "additionalProperties" = false }, "link" = { "type" = "object", "properties" = { "supported" = { "type" = "boolean" }, "values" = { "type" = "object", "properties" = { "speed" = { "type" = "string", "maxLength" = 4096 }, "duplex" = { "type" = "string", "maxLength" = 4096 }, "auto_negotiation" = { "type" = "string", "maxLength" = 4096 }, "port" = { "type" = "string", "maxLength" = 4096 }, "link_detected" = { "type" = "string", "maxLength" = 4096 } }, "required" = [], "additionalProperties" = false } }, "required" = ["supported", "values"], "additionalProperties" = false }, "rings" = { "type" = "object", "properties" = { "supported" = { "type" = "boolean" }, "values" = { "type" = "object", "properties" = { "maximum_rx" = { "type" = "string", "maxLength" = 4096 }, "maximum_rx_mini" = { "type" = "string", "maxLength" = 4096 }, "maximum_rx_jumbo" = { "type" = "string", "maxLength" = 4096 }, "maximum_tx" = { "type" = "string", "maxLength" = 4096 }, "maximum_rx_buf_len" = { "type" = "string", "maxLength" = 4096 }, "maximum_cqe_size" = { "type" = "string", "maxLength" = 4096 }, "current_rx" = { "type" = "string", "maxLength" = 4096 }, "current_rx_mini" = { "type" = "string", "maxLength" = 4096 }, "current_rx_jumbo" = { "type" = "string", "maxLength" = 4096 }, "current_tx" = { "type" = "string", "maxLength" = 4096 }, "current_rx_buf_len" = { "type" = "string", "maxLength" = 4096 }, "current_cqe_size" = { "type" = "string", "maxLength" = 4096 } }, "required" = [], "additionalProperties" = false } }, "required" = ["supported", "values"], "additionalProperties" = false } }, "required" = ["source", "observed_at", "unavailable", "interface", "aspect"], "additionalProperties" = false }
