# Reviewed controller-owned native Python payload; no Ansible runtime required.
# Export, review payloads/inspect_process/manifest.json and the fixed policy here, then enable it by name.
# The site supplies targets, authority and fixed policy; the collector digest is checked at load.
mode = "headless"
capabilities = { named = true }
[selection]
allow = ["inspect_process"]
[targets.server]
ssh_host = "server-ordinary"
[automation.targets.server]
destination = "server-ordinary"
python = "/usr/bin/python3"
[tools.inspect_process]
description = "Read one exact process identity: owner, state, CPU ticks, memory, limits and cgroup. No arguments, environment or memory contents."
revision = "1_native1"
targets = ["server"]
authority = "automation:catalog"
effects = ["read", "sensitive_read"]
execution = { kind = "native_payload", source = "/etc/estus/payloads/inspect_process/collector.py", no_log = false }
fixed_args = { "target_python" = "/usr/bin/python3" }
input_map = { "pid" = "pid", "boot_id" = "boot_id", "start_ticks" = "start_ticks" }
limits = { timeout_secs = 20 }
[tools.inspect_process.input_schema]
type = "object"
required = ["pid", "boot_id", "start_ticks"]
additionalProperties = false
properties = { "pid" = { "type" = "integer", "minimum" = 1, "maximum" = 4194304 }, "boot_id" = { "type" = "string", "maxLength" = 36, "minLength" = 36 }, "start_ticks" = { "type" = "integer", "minimum" = 0, "maximum" = 9007199254740991 } }
[tools.inspect_process.result]
kind = "capability_projection"
fields = { "observed_at" = ["mcp_result", "observed_at"], "status" = ["mcp_result", "status"], "requested" = ["mcp_result", "requested"], "observed_identity" = ["mcp_result", "observed_identity"], "process" = ["mcp_result", "process"], "clock_ticks_per_second" = ["mcp_result", "clock_ticks_per_second"], "page_size_bytes" = ["mcp_result", "page_size_bytes"] }
max_bytes = 4096
max_items = 256
max_depth = 8
[tools.inspect_process.result.schema]
type = "object"
required = ["observed_at", "status", "requested"]
additionalProperties = false
properties = { "observed_at" = { "type" = "string", "maxLength" = 40 }, "status" = { "type" = "string", "maxLength" = 24, "enum" = ["available", "gone", "denied", "raced", "identity_mismatch"] }, "requested" = { "type" = "object", "required" = ["pid", "start_ticks", "boot_id"], "additionalProperties" = false, "properties" = { "pid" = { "type" = "integer", "minimum" = 1, "maximum" = 4194304 }, "start_ticks" = { "type" = "integer", "minimum" = 0, "maximum" = 9007199254740991 }, "boot_id" = { "type" = "string", "maxLength" = 36, "minLength" = 36 } } }, "observed_identity" = { "type" = "object", "required" = ["pid", "start_ticks", "boot_id"], "additionalProperties" = false, "properties" = { "pid" = { "type" = "integer", "minimum" = 1, "maximum" = 4194304 }, "start_ticks" = { "type" = "integer", "minimum" = 0, "maximum" = 9007199254740991 }, "boot_id" = { "type" = "string", "maxLength" = 36, "minLength" = 36 } } }, "process" = { "type" = "object", "required" = ["pid", "start_ticks", "boot_id", "name", "state", "ppid", "uid", "user_ticks", "system_ticks", "virtual_bytes", "resident_pages", "cgroups", "limits"], "additionalProperties" = false, "properties" = { "pid" = { "type" = "integer", "minimum" = 1, "maximum" = 4194304 }, "start_ticks" = { "type" = "integer", "minimum" = 0, "maximum" = 9007199254740991 }, "boot_id" = { "type" = "string", "maxLength" = 36, "minLength" = 36 }, "name" = { "type" = "string", "maxLength" = 256 }, "state" = { "type" = "string", "maxLength" = 1 }, "ppid" = { "type" = "integer", "minimum" = 0, "maximum" = 9007199254740991 }, "uid" = { "type" = "integer", "minimum" = 0, "maximum" = 9007199254740991 }, "user_ticks" = { "type" = "integer", "minimum" = 0, "maximum" = 9007199254740991 }, "system_ticks" = { "type" = "integer", "minimum" = 0, "maximum" = 9007199254740991 }, "virtual_bytes" = { "type" = "integer", "minimum" = 0, "maximum" = 9007199254740991 }, "resident_pages" = { "type" = "integer", "minimum" = 0, "maximum" = 9007199254740991 }, "cgroups" = { "type" = "array", "maxItems" = 64, "items" = { "type" = "string", "maxLength" = 1024 } }, "limits" = { "type" = "array", "maxItems" = 63, "items" = { "type" = "object", "required" = ["name", "soft", "hard", "units"], "additionalProperties" = false, "properties" = { "name" = { "type" = "string", "maxLength" = 64 }, "soft" = { "type" = "string", "maxLength" = 32 }, "hard" = { "type" = "string", "maxLength" = 32 }, "units" = { "type" = "string", "maxLength" = 32 } } } } } }, "clock_ticks_per_second" = { "type" = "integer", "minimum" = 1, "maximum" = 1048576 }, "page_size_bytes" = { "type" = "integer", "minimum" = 1, "maximum" = 1048576 } }
