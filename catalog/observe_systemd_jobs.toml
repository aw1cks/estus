# Reviewed controller-owned native Python payload; no Ansible runtime required.
# Export, review payloads/observe_systemd_jobs/manifest.json and fixed policy, then catalog prepare.
# Preparation creates explicit source/adapter/contract/authority approval; activation never refreshes it.
mode = "headless"
capabilities = { named = true }
enabled_tools = ["observe_systemd_jobs"]
[targets.server]
ssh_host = "server-ordinary"
[automation.targets.server]
destination = "server-ordinary"
python = "/usr/bin/python3"
[tools.observe_systemd_jobs]
description = "Bounded actual pending/running systemd jobs. Snapshot can change immediately."
revision = "1_native1"
targets = ["server"]
authority = "automation"
effects = ["read"]
execution = { kind = "native_payload", snapshot = "/etc/estus/observe_systemd_jobs.payload.json", source = "/etc/estus/payloads/observe_systemd_jobs/collector.py", no_log = false }
fixed_args = { "target_python" = "/usr/bin/python3", "manager_scope" = "system" }
input_map = {  }
limits = { timeout_secs = 60 }
input_schema = { "type" = "object", "properties" = {  }, "required" = [], "additionalProperties" = false }
[tools.observe_systemd_jobs.result]
kind = "capability_projection"
fields = { "scope" = ["mcp_result", "scope"], "jobs" = ["mcp_result", "jobs"], "truncated" = ["mcp_result", "truncated"], "source_count" = ["mcp_result", "source_count"] }
max_bytes = 4096
max_items = 256
max_depth = 6
schema = { "type" = "object", "properties" = { "scope" = { "type" = "string", "enum" = ["system", "user"], "maxLength" = 6 }, "jobs" = { "type" = "array", "items" = { "type" = "object", "properties" = { "job" = { "type" = "integer", "minimum" = 0, "maximum" = 4294967295 }, "unit" = { "type" = "string", "maxLength" = 256 }, "type" = { "type" = "string", "maxLength" = 32 }, "state" = { "type" = "string", "maxLength" = 32 } }, "required" = ["job", "unit", "type", "state"], "additionalProperties" = false }, "maxItems" = 8 }, "truncated" = { "type" = "boolean" }, "source_count" = { "type" = "integer", "minimum" = 0, "maximum" = 256 } }, "required" = ["scope", "jobs", "truncated", "source_count"], "additionalProperties" = false }
