# Reviewed controller-owned native Python payload; no Ansible runtime required.
# Export, review payloads/change_nic_coalesce/manifest.json and the fixed policy here, then enable it by name.
# The site supplies targets, authority and fixed policy; the collector digest is checked at load.
mode = "headless"
capabilities = { named = true }
[selection]
allow = ["change_nic_coalesce"]
[targets.server]
ssh_host = "server-ordinary"
[automation.targets.server]
destination = "server-ordinary"
python = "/usr/bin/python3"
[automation.authorities.catalog]
ssh_config_file = "/etc/estus/catalog-ssh.conf"
become = { method = "sudo", user = "root" }
[automation.authorities.catalog.targets.server]
destination = "server-catalog"
python = "/usr/bin/python3"
[tools.change_nic_coalesce]
description = "Set one interface's coalescing parameters at runtime and read them back. Disruptive to latency and throughput, not persistent."
revision = "1_native1"
targets = ["server"]
authority = "automation:catalog"
effects = ["read","runtime_write","availability"]
execution = { kind = "native_payload", source = "/etc/estus/payloads/change_nic_coalesce/collector.py", no_log = false }
fixed_args = {"target_python" = "/usr/bin/python3","operator_policy" = {"interface" = "tune0","mac" = "52:54:00:12:34:57","driver" = "virtio_net","allow_runtime_tuning" = true}}
input_map = {"interface" = "interface","tx_frames" = "tx_frames"}
limits = { timeout_secs = 40 }
input_schema = {"type" = "object","properties" = {"interface" = {"type" = "string","enum" = ["tune0"],"maxLength" = 15},"tx_frames" = {"type" = "integer","enum" = [0,1]}},"required" = ["interface","tx_frames"],"additionalProperties" = false}
[tools.change_nic_coalesce.result]
kind = "capability_projection"
fields = {"interface" = ["mcp_result","interface"],"before" = ["mcp_result","before"],"after" = ["mcp_result","after"],"changed" = ["mcp_result","changed"],"verified" = ["mcp_result","verified"],"persistence" = ["mcp_result","persistence"]}
max_bytes = 4096
max_items = 256
max_depth = 8
schema = {"type" = "object","properties" = {"interface" = {"type" = "string","maxLength" = 15},"before" = {"type" = "object","properties" = {"tx_frames" = {"type" = "integer","enum" = [0,1]}},"required" = ["tx_frames"],"additionalProperties" = false},"after" = {"type" = "object","properties" = {"tx_frames" = {"type" = "integer","enum" = [0,1]}},"required" = ["tx_frames"],"additionalProperties" = false},"changed" = {"type" = "boolean"},"verified" = {"type" = "boolean","const" = true},"persistence" = {"type" = "string","const" = "runtime_only","maxLength" = 32}},"required" = ["interface","before","after","changed","verified","persistence"],"additionalProperties" = false}
