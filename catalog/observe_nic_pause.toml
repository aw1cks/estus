[tools.observe_nic_pause]
description = "Read an interface's driver-reported pause and autonegotiation state. Read-only; it does not tune anything."
revision = "1_native1"
authority = "automation"
effects = ["read"]
execution = { kind = "native_payload", source = "/etc/estus/payloads/observe_nic_pause/collector.py", no_log = false }
fixed_args = { "target_python" = "/usr/bin/python3" }

input_map = {"interface" = "interface"}
limits = { timeout_secs = 40 }
input_schema = {"type" = "object","properties" = {"interface" = {"type" = "string","enum" = ["pause0"],"maxLength" = 15}},"required" = ["interface"],"additionalProperties" = false}
[tools.observe_nic_pause.result]
kind = "capability_projection"
fields = {"interface" = ["mcp_result","interface"],"autoneg" = ["mcp_result","autoneg"],"rx" = ["mcp_result","rx"],"tx" = ["mcp_result","tx"],"source" = ["mcp_result","source"]}
max_bytes = 4096
max_items = 256
max_depth = 8
schema = {"type" = "object","properties" = {"interface" = {"type" = "string","maxLength" = 15},"autoneg" = {"type" = "boolean"},"rx" = {"type" = "boolean"},"tx" = {"type" = "boolean"},"source" = {"type" = "string","maxLength" = 128}},"required" = ["interface","autoneg","rx","tx","source"],"additionalProperties" = false}
