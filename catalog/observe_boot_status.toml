[tools.observe_boot_status]
description = "Read the EFI loader identity, current/default/one-shot selections and Secure Boot state. Missing variables mean unknown, not disabled."
revision = "1_native1"
authority = "automation:catalog"
effects = ["read"]
execution = { kind = "native_payload", source = "/etc/estus/payloads/observe_boot_status/collector.py", no_log = false }
fixed_args = { target_python = "/usr/bin/python3" }

input_map = {  }
limits = { timeout_secs = 60 }
input_schema = { "type" = "object", "properties" = {  }, "required" = [], "additionalProperties" = false }
result = { kind = "capability_projection", fields = { "boot_id" = ["mcp_result", "boot_id"], "source" = ["mcp_result", "source"], "unavailable" = ["mcp_result", "unavailable"], "observed_at" = ["mcp_result", "observed_at"], "firmware_mode" = ["mcp_result", "firmware_mode"], "loader" = ["mcp_result", "loader"], "selection_source" = ["mcp_result", "selection_source"], "security_source" = ["mcp_result", "security_source"], "current_entry" = ["mcp_result", "current_entry"], "default_entry" = ["mcp_result", "default_entry"], "oneshot_entry" = ["mcp_result", "oneshot_entry"], "secure_boot" = ["mcp_result", "secure_boot"], "setup_mode" = ["mcp_result", "setup_mode"] }, max_bytes = 4096, max_items = 256, max_depth = 8, schema = { "type" = "object", "properties" = { "boot_id" = { "type" = "string", "minLength" = 36, "maxLength" = 36 }, "source" = { "type" = "string", "maxLength" = 128 }, "unavailable" = { "type" = "array", "maxItems" = 32, "items" = { "type" = "string", "maxLength" = 128 } }, "observed_at" = { "type" = "string", "maxLength" = 32 }, "firmware_mode" = { "type" = "string", "maxLength" = 16 }, "loader" = { "type" = "string", "maxLength" = 2048 }, "selection_source" = { "type" = "string", "maxLength" = 128 }, "security_source" = { "type" = "string", "maxLength" = 128 }, "current_entry" = { "type" = "string", "maxLength" = 2048 }, "default_entry" = { "type" = "string", "maxLength" = 2048 }, "oneshot_entry" = { "type" = "string", "maxLength" = 2048 }, "secure_boot" = { "type" = "string", "maxLength" = 16 }, "setup_mode" = { "type" = "string", "maxLength" = 16 } }, "required" = ["boot_id", "source", "unavailable", "observed_at", "firmware_mode", "loader", "selection_source", "security_source", "secure_boot", "setup_mode"], "additionalProperties" = false } }
