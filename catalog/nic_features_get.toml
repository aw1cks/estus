# Operator approval: selector enum is a reviewed topology allowlist; edit and
# reimport it for the target before activation, never widen it from caller input.
# Opt-in: copy roles/nic_features_get to /etc/estus/roles/nic_features_get; export input_schema,
# fixed_args and input_map as overlay.json. Review the offline imported snapshot:
# estus --config nic_features_get.toml schema import-role nic_features_get --role-path /etc/estus/roles/nic_features_get --overlay overlay.json --output /etc/estus/nic_features_get.schema.json
# Provision mode0700 /var/lib/estus/runner, Python3 and declared inspection utilities.
# Selected maintained offload facts retain fixed/requested annotations. Missing capabilities explicit; no duplicate ethtool feature collector.
mode = "headless"
capabilities = { named = true }
enabled_tools = ["nic_features_get"]
[targets.server]
ssh_host = "server-ordinary"
[automation]
workspace_root = "/var/lib/estus/runner"
max_concurrent = 2
max_scratch_bytes = 16777216
max_scratch_files = 512
[automation.targets.server]
destination = "server-ordinary"
python = "/usr/bin/python3"
[tools.nic_features_get]
description = "Selected maintained offload facts retain fixed/requested annotations. Missing capabilities explicit; no duplicate ethtool feature collector."
revision = "1"
targets = ["server"]
authority = "automation"
effects = ["read"]
execution = { kind = "ansible_role", snapshot = "/etc/estus/nic_features_get.schema.json", role_path = "/etc/estus/nic_features_get.schema.roles/nic_features_get", no_log = false }
fixed_args = { target_python = "/usr/bin/python3" }
input_map = { "interface" = "interface" }
limits = { timeout_secs = 30 }
input_schema = { "type" = "object", "properties" = { "interface" = { "type" = "string", "maxLength" = 15, "enum" = ["eth0", "catalog0", "lo"] } }, "required" = ["interface"], "additionalProperties" = false }
[tools.nic_features_get.result]
kind = "ansible_projection"
fields = { "source" = ["mcp_result", "source"], "observed_at" = ["mcp_result", "observed_at"], "unavailable" = ["mcp_result", "unavailable"], "interface" = ["mcp_result", "interface"], "features" = ["mcp_result", "features"] , truncated = ["mcp_result", "truncated"], omitted_records = ["mcp_result", "omitted_records"] }
max_bytes = 4096
max_items = 256
max_depth = 8
schema = { "type" = "object", "properties" = { truncated = { type = "boolean" }, omitted_records = { type = "integer", minimum = 0, maximum = 9007199254740991 }, "source" = { "type" = "string", "maxLength" = 256 }, "observed_at" = { "type" = "string", "maxLength" = 64 }, "unavailable" = { "type" = "array", "items" = { "type" = "string", "maxLength" = 128 }, "maxItems" = 256 }, "interface" = { "type" = "string", "maxLength" = 15 }, "features" = { "type" = "object", "properties" = { "rx_checksumming" = { "type" = "string", "maxLength" = 4096 }, "tx_checksumming" = { "type" = "string", "maxLength" = 4096 }, "scatter_gather" = { "type" = "string", "maxLength" = 4096 }, "tcp_segmentation_offload" = { "type" = "string", "maxLength" = 4096 }, "generic_segmentation_offload" = { "type" = "string", "maxLength" = 4096 }, "generic_receive_offload" = { "type" = "string", "maxLength" = 4096 }, "large_receive_offload" = { "type" = "string", "maxLength" = 4096 }, "rx_vlan_offload" = { "type" = "string", "maxLength" = 4096 }, "tx_vlan_offload" = { "type" = "string", "maxLength" = 4096 }, "receive_hashing" = { "type" = "string", "maxLength" = 4096 } }, "required" = [], "additionalProperties" = false } }, "required" = ["source", "observed_at", "unavailable", "interface", "features"], "additionalProperties" = false }
