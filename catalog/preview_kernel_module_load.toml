[tools.preview_kernel_module_load]
description = "Preview one module's dependencies and effective modprobe hooks without loading it. The plan text is not a promise of what will happen."
revision = "1_native1"
authority = "automation"
effects = ["read", "sensitive_read"]
execution = { kind = "native_payload", source = "/etc/estus/payloads/preview_kernel_module_load/collector.py", no_log = false }
fixed_args = { target_python = "/usr/bin/python3" }

input_map = { "name" = "name" }
limits = { timeout_secs = 60 }
input_schema = { "type" = "object", "properties" = { "name" = { "type" = "string", "enum" = ["dummy", "estus_catalog"], "minLength" = 1, "maxLength" = 64 } }, "required" = ["name"], "additionalProperties" = false }
result = { kind = "capability_projection", fields = { "boot_id" = ["mcp_result", "boot_id"], "source" = ["mcp_result", "source"], "unavailable" = ["mcp_result", "unavailable"], "observed_at" = ["mcp_result", "observed_at"], "name" = ["mcp_result", "name"], "plan" = ["mcp_result", "plan"], "permission_granted" = ["mcp_result", "permission_granted"], "loaded" = ["mcp_result", "loaded"], "hooks_may_execute_on_load" = ["mcp_result", "hooks_may_execute_on_load"], "scope" = ["mcp_result", "scope"] }, max_bytes = 4096, max_items = 256, max_depth = 8, schema = { "type" = "object", "properties" = { "boot_id" = { "type" = "string", "minLength" = 36, "maxLength" = 36 }, "source" = { "type" = "string", "maxLength" = 128 }, "unavailable" = { "type" = "array", "maxItems" = 32, "items" = { "type" = "string", "maxLength" = 128 } }, "observed_at" = { "type" = "string", "maxLength" = 32 }, "name" = { "type" = "string", "maxLength" = 64 }, "plan" = { "type" = "array", "maxItems" = 128, "items" = { "type" = "string", "maxLength" = 4096 } }, "permission_granted" = { "type" = "boolean" }, "loaded" = { "type" = "boolean" }, "hooks_may_execute_on_load" = { "type" = "boolean" }, "scope" = { "type" = "string", "maxLength" = 256 } }, "required" = ["boot_id", "source", "unavailable", "observed_at", "name", "plan", "permission_granted", "loaded", "hooks_may_execute_on_load", "scope"], "additionalProperties" = false } }
