# Independently opt-in lab-only nic_eee_set; synthetic model, never physical EEE proof.
# Real ethtool JSON and pinned model0/MAC/sysfs driver; never target management0.
# Enabled configuration is distinct from active negotiation (model always inactive).
# An absent tx-lpi omits the unknown hidden timer; it is not zero.
# Runtime only; always request tx-lpi on with explicit timer, even when EEE off.
# One write maximum; actual readback/no-op, no replay, rollback or recovery.
# Import: estus --config nic_eee_set.toml schema import-role nic_eee_set --role-path /etc/estus/roles/nic_eee_set --overlay overlay.json --output /etc/estus/nic_eee_set.schema.json
profile = "actions-only"
enabled_tools = ["nic_eee_set"]
[targets.server]
ssh_host = "server-ordinary"
[automation]
workspace_root = "/var/lib/estus/runner"
max_concurrent = 2
max_scratch_bytes = 16777216
max_scratch_files = 512
[automation.targets.server]
destination = "server-ordinary"
python = "/usr/bin/python3"
[automation.authorities.catalog]
ssh_config_file = "/etc/estus/catalog-ssh.conf"
become = { method = "sudo", user = "root" }
[automation.authorities.catalog.targets.server]
destination = "server-catalog"
python = "/usr/bin/python3"
[tools.nic_eee_set]
description = "nic_eee_set: Reviewed runtime-only synthetic EEE configuration, fixed Tx LPI on and actual readback; not negotiated link proof."
revision = "1"
targets = ["server"]
authority = "automation:catalog"
effects = ["read","runtime_write","availability"]
execution = {"kind" = "ansible_role","snapshot" = "/etc/estus/nic_eee_set.schema.json","role_path" = "/etc/estus/nic_eee_set.schema.roles/nic_eee_set","no_log" = false}
fixed_args = {"target_python" = "/usr/bin/python3","operator_policy" = {"interface" = "model0","mac" = "52:54:00:12:34:5a","driver" = "estus_nic_model","allow_runtime_tuning" = true}}
input_map = {"interface" = "interface","enabled" = "enabled","tx_lpi_timer_us" = "tx_lpi_timer_us"}
limits = {"timeout_secs" = 40}
input_schema = {"type" = "object","properties" = {"interface" = {"type" = "string","maxLength" = 15,"enum" = ["model0"]},"enabled" = {"type" = "boolean"},"tx_lpi_timer_us" = {"type" = "integer","minimum" = 0,"maximum" = 1000000}},"required" = ["interface","enabled","tx_lpi_timer_us"],"additionalProperties" = false}
[tools.nic_eee_set.result]
kind = "ansible_projection"
fields = {"interface" = ["mcp_result","interface"],"driver" = ["mcp_result","driver"],"scope" = ["mcp_result","scope"],"before" = ["mcp_result","before"],"after" = ["mcp_result","after"],"changed" = ["mcp_result","changed"],"verified" = ["mcp_result","verified"],"persistence" = ["mcp_result","persistence"]}
max_bytes = 4096
max_items = 256
max_depth = 8
schema = {"type" = "object","properties" = {"interface" = {"type" = "string","maxLength" = 15,"enum" = ["model0"]},"driver" = {"type" = "string","maxLength" = 32,"enum" = ["estus_nic_model"]},"scope" = {"type" = "string","maxLength" = 14,"enum" = ["software_model"]},"before" = {"type" = "object","properties" = {"enabled" = {"type" = "boolean"},"active" = {"type" = "boolean"},"tx_lpi_enabled" = {"type" = "boolean"},"tx_lpi_timer_us" = {"type" = "integer","minimum" = 0,"maximum" = 4294967295},"supported_modes" = {"type" = "array","maxItems" = 16,"items" = {"type" = "string","maxLength" = 64}},"advertised_modes" = {"type" = "array","maxItems" = 16,"items" = {"type" = "string","maxLength" = 64}},"peer_modes" = {"type" = "array","maxItems" = 16,"items" = {"type" = "string","maxLength" = 64}}},"required" = ["enabled","active","tx_lpi_enabled","supported_modes","advertised_modes","peer_modes"],"additionalProperties" = false},"after" = {"type" = "object","properties" = {"enabled" = {"type" = "boolean"},"active" = {"type" = "boolean"},"tx_lpi_enabled" = {"type" = "boolean","const" = true},"tx_lpi_timer_us" = {"type" = "integer","minimum" = 0,"maximum" = 1000000},"supported_modes" = {"type" = "array","maxItems" = 16,"items" = {"type" = "string","maxLength" = 64}},"advertised_modes" = {"type" = "array","maxItems" = 16,"items" = {"type" = "string","maxLength" = 64}},"peer_modes" = {"type" = "array","maxItems" = 16,"items" = {"type" = "string","maxLength" = 64}}},"required" = ["enabled","active","tx_lpi_enabled","tx_lpi_timer_us","supported_modes","advertised_modes","peer_modes"],"additionalProperties" = false},"changed" = {"type" = "boolean"},"verified" = {"type" = "boolean","const" = true},"persistence" = {"type" = "string","maxLength" = 12,"enum" = ["runtime_only"]}},"required" = ["interface","driver","scope","before","after","changed","verified","persistence"],"additionalProperties" = false}
