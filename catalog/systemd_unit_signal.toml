# Reviewed controller-owned native Python payload; no Ansible runtime required.
# Export, review payloads/systemd_unit_signal/manifest.json and fixed policy, then catalog prepare.
# Preparation creates explicit source/adapter/contract/authority approval; activation never refreshes it.
mode = "headless"
capabilities = { named = true }
enabled_tools = ["systemd_unit_signal"]
[targets.server]
ssh_host = "server-ordinary"
[automation.targets.server]
destination = "server-ordinary"
python = "/usr/bin/python3"
[automation.authorities.catalog]
ssh_config_file = "/etc/estus/catalog-ssh.conf"
[automation.authorities.catalog.become]
method = "sudo"
user = "root"
[automation.authorities.catalog.targets.server]
destination = "server-catalog"
python = "/usr/bin/python3"
[tools.systemd_unit_signal]
description = "Fixed signal operation in operator manager scope. Explicit completion/readback is separate from application health. Dependencies/activation can affect other units; interrupted work is not replayed."
revision = "1_native1"
targets = ["server"]
authority = "automation:catalog"
effects = ["runtime_write", "availability", "read"]
execution = { kind = "native_payload", snapshot = "/etc/estus/systemd_unit_signal.payload.json", source = "/etc/estus/payloads/systemd_unit_signal/collector.py", no_log = false }
fixed_args = { "target_python" = "/usr/bin/python3", "manager_scope" = "system" }
input_map = { "unit" = "unit", "signal" = "signal" }
constraints = { allowed_units = ["estus-fixture.service", "estus-fixture-idle.service", "estus-fixture-fail.service", "estus-fixture.timer", "estus-fixture.socket", "estus-fixture-signal.service", "estus-fixture-block.service", "estus-fixture-manager.service", "estus-fixture@.service"] }
limits = { timeout_secs = 60 }
input_schema = { "type" = "object", "properties" = { "unit" = { "type" = "string", "maxLength" = 128 }, "signal" = { "type" = "string", "enum" = ["HUP", "USR1", "USR2", "TERM"] } }, "required" = ["unit", "signal"], "additionalProperties" = false }
[tools.systemd_unit_signal.result]
kind = "capability_projection"
fields = { "scope" = ["mcp_result", "scope"], "operation" = ["mcp_result", "operation"], "operation_completed" = ["mcp_result", "operation_completed"], "health" = ["mcp_result", "health"], "unit" = ["mcp_result", "unit"], "properties" = ["mcp_result", "properties"], "signal" = ["mcp_result", "signal"] }
max_bytes = 4096
max_items = 256
max_depth = 6
schema = { "type" = "object", "properties" = { "scope" = { "type" = "string", "enum" = ["system", "user"], "maxLength" = 6 }, "operation" = { "type" = "string", "const" = "signal", "maxLength" = 6 }, "operation_completed" = { "type" = "boolean", "const" = true }, "health" = { "type" = "string", "const" = "not_checked", "maxLength" = 11 }, "unit" = { "type" = "string", "maxLength" = 128 }, "properties" = { "type" = "object", "properties" = { "Id" = { "type" = "string", "maxLength" = 4096 }, "LoadState" = { "type" = "string", "maxLength" = 4096 }, "ActiveState" = { "type" = "string", "maxLength" = 4096 }, "SubState" = { "type" = "string", "maxLength" = 4096 }, "UnitFileState" = { "type" = "string", "maxLength" = 4096 }, "MainPID" = { "type" = "string", "maxLength" = 4096 }, "Result" = { "type" = "string", "maxLength" = 4096 } }, "required" = [], "additionalProperties" = false }, "signal" = { "type" = "string", "enum" = ["HUP", "USR1", "USR2", "TERM"], "maxLength" = 4 } }, "required" = ["scope", "operation", "operation_completed", "health", "unit", "properties", "signal"], "additionalProperties" = false }
