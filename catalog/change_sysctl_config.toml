[tools.change_sysctl_config]
description = "Persist one approved integer sysctl key to a dedicated sysctl.d file and apply exactly that file. Other settings are not reloaded and other files may still override it."
revision = "1_native1"
authority = "automation:catalog"
effects = ["persistent_write", "runtime_write", "read"]
execution = { kind = "native_payload", source = "/etc/estus/payloads/change_sysctl_config/collector.py", no_log = false }
fixed_args = { "target_python" = "/usr/bin/python3" }

input_map = { "key" = "key", "value" = "value" }
limits = { timeout_secs = 40 }
input_schema = { "type" = "object", "properties" = { "key" = { "type" = "string", "minLength" = 1, "maxLength" = 128 }, "value" = { "type" = "integer", "minimum" = 0, "maximum" = 9007199254740991 } }, "required" = ["key", "value"], "additionalProperties" = false }
[tools.change_sysctl_config.result]
kind = "capability_projection"
fields = { "key" = ["mcp_result", "key"], "before" = ["mcp_result", "before"], "value" = ["mcp_result", "value"], "verified" = ["mcp_result", "verified"], "persistent" = ["mcp_result", "persistent"], "application" = ["mcp_result", "application"], "config_path" = ["mcp_result", "config_path"], "atomic_compare_exchange" = ["mcp_result", "atomic_compare_exchange"], "rollback_guaranteed" = ["mcp_result", "rollback_guaranteed"] }
max_bytes = 4096
max_items = 256
max_depth = 8
schema = { "type" = "object", "properties" = { "key" = { "type" = "string", "minLength" = 1, "maxLength" = 128 }, "before" = { "type" = "integer", "minimum" = 0, "maximum" = 9007199254740991 }, "value" = { "type" = "integer", "minimum" = 0, "maximum" = 9007199254740991 }, "verified" = { "type" = "boolean", "const" = true }, "persistent" = { "type" = "boolean", "const" = true }, "application" = { "type" = "string", "maxLength" = 64 }, "config_path" = { "type" = "string", "maxLength" = 128 }, "atomic_compare_exchange" = { "type" = "boolean", "const" = false }, "rollback_guaranteed" = { "type" = "boolean", "const" = false } }, "required" = ["key", "before", "value", "verified", "persistent", "application", "config_path", "atomic_compare_exchange", "rollback_guaranteed"], "additionalProperties" = false }
