# Reviewed controller-owned native Python payload; no Ansible runtime required.
# Export, review payloads/memory_stats/manifest.json and fixed policy, then catalog prepare.
# Preparation creates explicit source/adapter/contract/authority approval; activation never refreshes it.
profile = "actions-only"
enabled_tools = ["memory_stats"]

[targets.server]
ssh_host = "server-ordinary"

[automation.targets.server]
destination = "server-ordinary"
python = "/usr/bin/python3"

[tools.memory_stats]
description = "Observe selected Linux memory gauges in bytes and cumulative VM event/page counters. The procfs view may be host/global, not effective cgroup, NUMA, cpuset or quota headroom; collection across proc sources is not atomic."
revision = "1_native1"
targets = ["server"]
authority = "automation"
effects = ["read"]
execution = { kind = "native_payload", snapshot = "/etc/estus/memory_stats.payload.json", source = "/etc/estus/payloads/memory_stats/collector.py", no_log = false }
fixed_args = { target_python = "/usr/bin/python3" }
input_map = {}
limits = { timeout_secs = 20 }

[tools.memory_stats.input_schema]
type = "object"
required = []
additionalProperties = false
properties = {}

[tools.memory_stats.result]
kind = "capability_projection"
fields = { system = ["mcp_result", "system"], scope = ["mcp_result", "scope"], observed_at = ["mcp_result", "observed_at"], page_size_bytes = ["mcp_result", "page_size_bytes"], memory_bytes = ["mcp_result", "memory_bytes"], vm_counters = ["mcp_result", "vm_counters"], unavailable = ["mcp_result", "unavailable"], boot_id = ["mcp_result", "boot_id"] }
max_bytes = 4096
max_items = 128
max_depth = 4

[tools.memory_stats.result.schema]
type = "object"
required = ["system", "scope", "observed_at", "page_size_bytes", "memory_bytes", "vm_counters", "unavailable"]
additionalProperties = false

[tools.memory_stats.result.schema.properties]
system = { type = "string", const = "Linux", maxLength = 64 }
scope = { type = "string", const = "procfs_view", maxLength = 32 }
observed_at = { type = "string", maxLength = 32 }
page_size_bytes = { type = "integer", minimum = 1, maximum = 1048576 }
boot_id = { type = "string", minLength = 36, maxLength = 36 }
unavailable = { type = "array", maxItems = 18, uniqueItems = true, items = { type = "string", maxLength = 64, enum = ["memory_bytes.mem_available_bytes", "memory_bytes.buffers_bytes", "memory_bytes.cached_bytes", "memory_bytes.swap_total_bytes", "memory_bytes.swap_free_bytes", "memory_bytes.dirty_bytes", "memory_bytes.writeback_bytes", "memory_bytes.slab_bytes", "memory_bytes.sreclaimable_bytes", "memory_bytes.sunreclaim_bytes", "vm_counters.page_faults", "vm_counters.major_page_faults", "vm_counters.swap_in_pages", "vm_counters.swap_out_pages", "vm_counters.oom_kill_events", "vm_counters.kswapd_scan_pages", "vm_counters.direct_scan_pages", "boot_id"] } }

[tools.memory_stats.result.schema.properties.memory_bytes]
type = "object"
required = ["mem_total_bytes", "mem_free_bytes"]
additionalProperties = false
properties = { mem_total_bytes = { type = "integer", minimum = 0, maximum = 9007199254740991 }, mem_free_bytes = { type = "integer", minimum = 0, maximum = 9007199254740991 }, mem_available_bytes = { type = "integer", minimum = 0, maximum = 9007199254740991 }, buffers_bytes = { type = "integer", minimum = 0, maximum = 9007199254740991 }, cached_bytes = { type = "integer", minimum = 0, maximum = 9007199254740991 }, swap_total_bytes = { type = "integer", minimum = 0, maximum = 9007199254740991 }, swap_free_bytes = { type = "integer", minimum = 0, maximum = 9007199254740991 }, dirty_bytes = { type = "integer", minimum = 0, maximum = 9007199254740991 }, writeback_bytes = { type = "integer", minimum = 0, maximum = 9007199254740991 }, slab_bytes = { type = "integer", minimum = 0, maximum = 9007199254740991 }, sreclaimable_bytes = { type = "integer", minimum = 0, maximum = 9007199254740991 }, sunreclaim_bytes = { type = "integer", minimum = 0, maximum = 9007199254740991 } }

[tools.memory_stats.result.schema.properties.vm_counters]
type = "object"
required = []
additionalProperties = false
properties = { page_faults = { type = "integer", minimum = 0, maximum = 9007199254740991 }, major_page_faults = { type = "integer", minimum = 0, maximum = 9007199254740991 }, swap_in_pages = { type = "integer", minimum = 0, maximum = 9007199254740991 }, swap_out_pages = { type = "integer", minimum = 0, maximum = 9007199254740991 }, oom_kill_events = { type = "integer", minimum = 0, maximum = 9007199254740991 }, kswapd_scan_pages = { type = "integer", minimum = 0, maximum = 9007199254740991 }, direct_scan_pages = { type = "integer", minimum = 0, maximum = 9007199254740991 } }
