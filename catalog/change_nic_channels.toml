# Reviewed controller-owned native Python payload; no Ansible runtime required.
# Export, review payloads/change_nic_channels/manifest.json and the fixed policy here, then enable it by name.
# Preparation creates explicit source/adapter/contract/authority approval; activation never refreshes it.
mode = "headless"
capabilities = { named = true }
enabled_tools = ["change_nic_channels"]
[targets.server]
ssh_host = "server-ordinary"
[automation.targets.server]
destination = "server-ordinary"
python = "/usr/bin/python3"
[automation.authorities.catalog]
ssh_config_file = "/etc/estus/catalog-ssh.conf"
become = { method = "sudo", user = "root" }
[automation.authorities.catalog.targets.server]
destination = "server-catalog"
python = "/usr/bin/python3"
[tools.change_nic_channels]
description = "change_nic_channels: disruptive reviewed runtime-only tuning, actual readback required; independent surviving control path required."
revision = "1_native1"
targets = ["server"]
authority = "automation:catalog"
effects = ["read","runtime_write","availability"]
execution = { kind = "native_payload", source = "/etc/estus/payloads/change_nic_channels/collector.py", no_log = false }
fixed_args = { target_python = "/usr/bin/python3", operator_policy = { interface = "queue0", mac = "52:54:00:12:34:59", driver = "veth", allow_runtime_tuning = true } }
input_map = { interface = "interface", rx = "rx" }
limits = { timeout_secs = 40 }
input_schema = {"type" = "object","properties" = {"interface" = {"type" = "string","enum" = ["queue0"],"maxLength" = 15},"rx" = {"type" = "integer","minimum" = 1,"maximum" = 4}},"required" = ["interface","rx"],"additionalProperties" = false}
[tools.change_nic_channels.result]
kind = "capability_projection"
fields = {"interface" = ["mcp_result","interface"],"before" = ["mcp_result","before"],"after" = ["mcp_result","after"],"changed" = ["mcp_result","changed"],"verified" = ["mcp_result","verified"],"persistence" = ["mcp_result","persistence"]}
max_bytes = 4096
max_items = 256
max_depth = 8
schema = {"type" = "object","properties" = {"interface" = {"type" = "string","maxLength" = 15},"before" = {"type" = "object","properties" = {"rx" = {"type" = "integer","minimum" = 1,"maximum" = 1048576},"tx" = {"type" = "integer","minimum" = 1,"maximum" = 1048576}},"required" = ["rx","tx"],"additionalProperties" = false},"after" = {"type" = "object","properties" = {"rx" = {"type" = "integer","minimum" = 1,"maximum" = 1048576},"tx" = {"type" = "integer","minimum" = 1,"maximum" = 1048576}},"required" = ["rx","tx"],"additionalProperties" = false},"changed" = {"type" = "boolean"},"verified" = {"type" = "boolean","const" = true},"persistence" = {"type" = "string","const" = "runtime_only","maxLength" = 32}},"required" = ["interface","before","after","changed","verified","persistence"],"additionalProperties" = false}
