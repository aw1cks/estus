# Reviewed controller-owned native Python payload; no Ansible runtime required.
# Export, review payloads/change_host_reboot/manifest.json and the fixed policy here, then enable it by name.
# The site supplies targets, authority and fixed policy; the collector digest is checked at load.
mode = "headless"
capabilities = { named = true }
enabled_tools = ["change_host_reboot"]

[targets.server]
ssh_host = "server-ordinary"

[automation.authorities.catalog]
ssh_config_file = "/etc/estus/catalog-ssh.conf"
become = { method = "sudo", user = "root" }

[automation.authorities.catalog.targets.server]
destination = "server-catalog-admin"
python = "/usr/bin/python3"

[tools.change_host_reboot]
description = "Schedule a host reboot in five seconds and return a scheduling receipt. Confirm it independently by reconnecting and comparing boot IDs; SSH loss proves nothing."
revision = "1_native1"
targets = ["server"]
authority = "automation:catalog"
effects = ["read", "runtime_write", "availability"]
execution = { kind = "native_payload", source = "/etc/estus/payloads/change_host_reboot/collector.py", no_log = false }
fixed_args = { target_python = "/usr/bin/python3" }
input_map = {  }
limits = { timeout_secs = 60 }
input_schema = { "type" = "object", "properties" = {  }, "required" = [], "additionalProperties" = false }
result = { kind = "capability_projection", fields = { "boot_id" = ["mcp_result", "boot_id"], "source" = ["mcp_result", "source"], "unavailable" = ["mcp_result", "unavailable"], "observed_at" = ["mcp_result", "observed_at"], "outcome" = ["mcp_result", "outcome"], "command_returncode" = ["mcp_result", "command_returncode"], "reboot_confirmed" = ["mcp_result", "reboot_confirmed"], "reconciliation_required" = ["mcp_result", "reconciliation_required"], "schedule_unit" = ["mcp_result", "schedule_unit"] }, max_bytes = 4096, max_items = 256, max_depth = 8, schema = { "type" = "object", "properties" = { "boot_id" = { "type" = "string", "minLength" = 36, "maxLength" = 36 }, "source" = { "type" = "string", "maxLength" = 128 }, "unavailable" = { "type" = "array", "maxItems" = 32, "items" = { "type" = "string", "maxLength" = 128 } }, "observed_at" = { "type" = "string", "maxLength" = 32 }, "outcome" = { "type" = "string", "maxLength" = 32 }, "command_returncode" = { "type" = "integer", "minimum" = -255, "maximum" = 255 }, "reboot_confirmed" = { "type" = "boolean" }, "reconciliation_required" = { "type" = "string", "maxLength" = 256 }, "schedule_unit" = { "type" = "string", "maxLength" = 128 } }, "required" = ["boot_id", "source", "unavailable", "observed_at", "outcome", "command_returncode", "reboot_confirmed", "reconciliation_required", "schedule_unit"], "additionalProperties" = false } }
