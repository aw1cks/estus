[tools.observe_sysctl]
description = "Read reviewed side-effect-free sysctl keys by name. Missing and denied keys are explicit; it never enumerates /proc/sys."
revision = "1_native1"
authority = "automation"
effects = ["read"]
execution = { kind = "native_payload", source = "/etc/estus/payloads/observe_sysctl/collector.py", no_log = false }
fixed_args = { "target_python" = "/usr/bin/python3" }

input_map = { "keys" = "keys" }
limits = { timeout_secs = 20 }
[tools.observe_sysctl.input_schema]
type = "object"
required = ["keys"]
additionalProperties = false
properties = { "keys" = { "type" = "array", "maxItems" = 3, "items" = { "type" = "string", "maxLength" = 64, "enum" = ["vm.swappiness", "net.ipv4.ip_forward", "kernel.pid_max"] } } }
[tools.observe_sysctl.result]
kind = "capability_projection"
fields = { "observed_at" = ["mcp_result", "observed_at"], "values" = ["mcp_result", "values"] }
max_bytes = 4096
max_items = 256
max_depth = 8
[tools.observe_sysctl.result.schema]
type = "object"
required = ["observed_at", "values"]
additionalProperties = false
properties = { "observed_at" = { "type" = "string", "maxLength" = 40 }, "values" = { "type" = "array", "maxItems" = 16, "items" = { "type" = "object", "required" = ["key", "status"], "additionalProperties" = false, "properties" = { "key" = { "type" = "string", "maxLength" = 64 }, "status" = { "type" = "string", "maxLength" = 16, "enum" = ["available", "missing", "denied"] }, "value" = { "type" = "integer", "minimum" = 0, "maximum" = 9007199254740991 } } } } }
