# Reviewed controller-owned native Python payload; no Ansible runtime required.
# Export, review payloads/systemd_unit_dependencies/manifest.json and fixed policy, then catalog prepare.
# Preparation creates explicit source/adapter/contract/authority approval; activation never refreshes it.
profile = "actions-only"
enabled_tools = ["systemd_unit_dependencies"]
[targets.server]
ssh_host = "server-ordinary"
[automation.targets.server]
destination = "server-ordinary"
python = "/usr/bin/python3"
[tools.systemd_unit_dependencies]
description = "Bounded forward/reverse dependency, ordering and activation relationships. Traversal depth is not the full mutation blast radius."
revision = "1_native1"
targets = ["server"]
authority = "automation"
effects = ["read"]
execution = { kind = "native_payload", snapshot = "/etc/estus/systemd_unit_dependencies.payload.json", source = "/etc/estus/payloads/systemd_unit_dependencies/collector.py", no_log = false }
fixed_args = { "target_python" = "/usr/bin/python3", "manager_scope" = "system", "allowed_units" = ["estus-fixture.service", "estus-fixture-idle.service", "estus-fixture-fail.service", "estus-fixture.timer", "estus-fixture.socket", "estus-fixture-signal.service", "estus-fixture-block.service", "estus-fixture-manager.service", "estus-fixture@.service"] }
input_map = { "unit" = "unit", "direction" = "direction", "depth" = "depth" }
limits = { timeout_secs = 60 }
input_schema = { "type" = "object", "properties" = { "unit" = { "type" = "string", "enum" = ["estus-fixture.service", "estus-fixture-idle.service", "estus-fixture-fail.service", "estus-fixture.timer", "estus-fixture.socket", "estus-fixture-signal.service", "estus-fixture-block.service", "estus-fixture-manager.service", "estus-fixture@.service"], "maxLength" = 128 }, "direction" = { "type" = "string", "enum" = ["forward", "reverse"] }, "depth" = { "type" = "integer", "minimum" = 1, "maximum" = 3 } }, "required" = ["unit", "direction", "depth"], "additionalProperties" = false }
[tools.systemd_unit_dependencies.result]
kind = "capability_projection"
fields = { "scope" = ["mcp_result", "scope"], "unit" = ["mcp_result", "unit"], "direction" = ["mcp_result", "direction"], "depth" = ["mcp_result", "depth"], "relationships" = ["mcp_result", "relationships"], "truncated" = ["mcp_result", "truncated"] }
max_bytes = 4096
max_items = 256
max_depth = 6
schema = { "type" = "object", "properties" = { "scope" = { "type" = "string", "enum" = ["system", "user"], "maxLength" = 6 }, "unit" = { "type" = "string", "maxLength" = 128 }, "direction" = { "type" = "string", "maxLength" = 16 }, "depth" = { "type" = "integer", "minimum" = 1, "maximum" = 3 }, "relationships" = { "type" = "array", "items" = { "type" = "object", "properties" = { "source" = { "type" = "string", "maxLength" = 256 }, "relation" = { "type" = "string", "maxLength" = 32 }, "target" = { "type" = "string", "maxLength" = 256 }, "depth" = { "type" = "integer", "minimum" = 1, "maximum" = 3 } }, "required" = ["source", "relation", "target", "depth"], "additionalProperties" = false }, "maxItems" = 16 }, "truncated" = { "type" = "boolean" } }, "required" = ["scope", "unit", "direction", "depth", "relationships", "truncated"], "additionalProperties" = false }
