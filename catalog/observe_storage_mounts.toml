# Reviewed controller-owned native Python payload; no Ansible runtime required.
# Export, review payloads/observe_storage_mounts/manifest.json and the fixed policy here, then enable it by name.
# The site supplies targets, authority and fixed policy; the collector digest is checked at load.
mode = "headless"
capabilities = { named = true }
enabled_tools = ["observe_storage_mounts"]
[targets.server]
ssh_host = "server-ordinary"
[automation.targets.server]
destination = "server-ordinary"
python = "/usr/bin/python3"

[tools.observe_storage_mounts]
description = "List current mounts, including overmount duplicates. Capacity is non-atomic and no labels or UUIDs are exposed."
revision = "1_native1"
targets = ["server"]
authority = "automation"
effects = ["read"]
execution = { kind = "native_payload", source = "/etc/estus/payloads/observe_storage_mounts/collector.py", no_log = false }
fixed_args = { "target_python" = "/usr/bin/python3" }
input_map = {  }
limits = { timeout_secs = 30 }
input_schema = { "type" = "object", "properties" = {  }, "required" = [], "additionalProperties" = false }
[tools.observe_storage_mounts.result]
kind = "capability_projection"
fields = { "source" = ["mcp_result", "source"], "observed_at" = ["mcp_result", "observed_at"], "unavailable" = ["mcp_result", "unavailable"], "mounts" = ["mcp_result", "mounts"], "truncated" = ["mcp_result", "truncated"], "omitted_records" = ["mcp_result", "omitted_records"] }
max_bytes = 4096
max_items = 256
max_depth = 8
schema = { "type" = "object", "properties" = { "truncated" = { "type" = "boolean" }, "omitted_records" = { "type" = "integer", "minimum" = 0, "maximum" = 9007199254740991 }, "source" = { "type" = "string", "maxLength" = 256 }, "observed_at" = { "type" = "string", "maxLength" = 64 }, "unavailable" = { "type" = "array", "items" = { "type" = "string", "maxLength" = 128 }, "maxItems" = 256 }, "mounts" = { "type" = "array", "items" = { "type" = "object", "properties" = { "mount" = { "type" = "string", "maxLength" = 4096 }, "device" = { "type" = "string", "maxLength" = 4096 }, "fstype" = { "type" = "string", "maxLength" = 4096 }, "size_total" = { "type" = "integer", "minimum" = 0, "maximum" = 9007199254740991 }, "size_available" = { "type" = "integer", "minimum" = 0, "maximum" = 9007199254740991 }, "inode_total" = { "type" = "integer", "minimum" = 0, "maximum" = 9007199254740991 }, "inode_available" = { "type" = "integer", "minimum" = 0, "maximum" = 9007199254740991 } }, "required" = ["mount", "device", "fstype"], "additionalProperties" = false }, "maxItems" = 256 } }, "required" = ["source", "observed_at", "unavailable", "mounts"], "additionalProperties" = false }
