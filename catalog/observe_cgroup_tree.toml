# Reviewed controller-owned native Python payload; no Ansible runtime required.
# Export, review payloads/observe_cgroup_tree/manifest.json and the fixed policy here, then enable it by name.
# The site supplies targets, authority and fixed policy; the collector digest is checked at load.
mode = "headless"
capabilities = { named = true }
[selection]
allow = ["observe_cgroup_tree"]
[targets.server]
ssh_host = "server-ordinary"
[automation.targets.server]
destination = "server-ordinary"
python = "/usr/bin/python3"
[tools.observe_cgroup_tree]
description = "Walk one approved cgroup subtree to a bounded depth. Ancestor limits are context, not an effective capacity."
revision = "1_native1"
targets = ["server"]
authority = "automation"
effects = ["read"]
execution = { kind = "native_payload", source = "/etc/estus/payloads/observe_cgroup_tree/collector.py", no_log = false }
fixed_args = { "target_python" = "/usr/bin/python3", "approved_root" = "/system.slice" }
input_map = { "depth" = "depth", "limit" = "limit" }
limits = { timeout_secs = 40 }
input_schema = { "type" = "object", "properties" = { "depth" = { "type" = "integer", "minimum" = 0, "maximum" = 4 }, "limit" = { "type" = "integer", "minimum" = 1, "maximum" = 8 } }, "required" = ["depth", "limit"], "additionalProperties" = false }
[tools.observe_cgroup_tree.result]
kind = "capability_projection"
fields = { "root" = ["mcp_result", "root"], "boot_id" = ["mcp_result", "boot_id"], "identity" = ["mcp_result", "identity"], "controllers" = ["mcp_result", "controllers"], "subtree_control" = ["mcp_result", "subtree_control"], "ancestors" = ["mcp_result", "ancestors"], "scope" = ["mcp_result", "scope"], "nodes" = ["mcp_result", "nodes"], "truncated" = ["mcp_result", "truncated"] }
max_bytes = 4096
max_items = 256
max_depth = 8
schema = { "type" = "object", "properties" = { "root" = { "type" = "string", "maxLength" = 256 }, "boot_id" = { "type" = "string", "maxLength" = 36 }, "identity" = { "type" = "string", "maxLength" = 128 }, "controllers" = { "type" = "array", "items" = { "type" = "string", "maxLength" = 64 }, "maxItems" = 32 }, "subtree_control" = { "type" = "array", "items" = { "type" = "string", "maxLength" = 64 }, "maxItems" = 32 }, "ancestors" = { "type" = "array", "items" = { "type" = "object", "properties" = { "path" = { "type" = "string", "maxLength" = 1024 }, "constraints" = { "type" = "array", "items" = { "type" = "object", "properties" = { "name" = { "type" = "string", "maxLength" = 64 }, "value" = { "type" = "string", "maxLength" = 4096 } }, "required" = ["name", "value"], "additionalProperties" = false }, "maxItems" = 8 } }, "required" = ["path", "constraints"], "additionalProperties" = false }, "maxItems" = 32 }, "scope" = { "type" = "string", "maxLength" = 64 }, "nodes" = { "type" = "array", "items" = { "type" = "object", "properties" = { "path" = { "type" = "string", "maxLength" = 1024 }, "parent" = { "type" = "string", "maxLength" = 1024 }, "systemd_component" = { "type" = "string", "maxLength" = 256 }, "identity" = { "type" = "string", "maxLength" = 128 } }, "required" = ["path", "parent", "systemd_component", "identity"], "additionalProperties" = false }, "maxItems" = 8 }, "truncated" = { "type" = "boolean" } }, "required" = ["root", "boot_id", "identity", "controllers", "subtree_control", "ancestors", "scope", "nodes", "truncated"], "additionalProperties" = false }
