[tools.change_network_route_add]
description = "Add one approved route at runtime and read the result back. Not persistent, and a wrong route can cut connectivity."
revision = "1_native1"
authority = "automation:catalog"
effects = ["runtime_write", "availability", "read"]
execution = { kind = "native_payload", source = "/etc/estus/payloads/change_network_route_add/collector.py", no_log = false }
fixed_args = { "target_python" = "/usr/bin/python3" }

input_map = { "interface" = "interface", "destination" = "destination" }
limits = { timeout_secs = 30 }
input_schema = { "type" = "object", "properties" = { "interface" = { "type" = "string", "minLength" = 1, "maxLength" = 15 }, "destination" = { "type" = "string", "minLength" = 1, "maxLength" = 64 } }, "required" = ["interface", "destination"], "additionalProperties" = false }
[tools.change_network_route_add.result]
kind = "capability_projection"
fields = { "interface" = ["mcp_result", "interface"], "operation" = ["mcp_result", "operation"], "verified" = ["mcp_result", "verified"], "persistence" = ["mcp_result", "persistence"] }
max_bytes = 4096
max_items = 256
max_depth = 8
schema = { "type" = "object", "properties" = { "interface" = { "type" = "string", "maxLength" = 15 }, "operation" = { "type" = "string", "maxLength" = 64 }, "verified" = { "type" = "boolean", "const" = true }, "persistence" = { "type" = "string", "const" = "runtime_only", "maxLength" = 32 } }, "required" = ["interface", "operation", "verified", "persistence"], "additionalProperties" = false }
