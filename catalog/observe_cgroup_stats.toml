# Reviewed controller-owned native Python payload; no Ansible runtime required.
# Export, review payloads/observe_cgroup_stats/manifest.json and the fixed policy here, then enable it by name.
# The site supplies targets, authority and fixed policy; the collector digest is checked at load.
mode = "headless"
capabilities = { named = true }
enabled_tools = ["observe_cgroup_stats"]
[targets.server]
ssh_host = "server-ordinary"
[automation.targets.server]
destination = "server-ordinary"
python = "/usr/bin/python3"
[tools.observe_cgroup_stats]
description = "Observe approved cgroup v2 controller files with cumulative/gauge/limit/pressure labels and actual ancestor constraints; absent controllers remain unavailable. No writes."
revision = "1_native1"
targets = ["server"]
authority = "automation"
effects = ["read"]
execution = { kind = "native_payload", source = "/etc/estus/payloads/observe_cgroup_stats/collector.py", no_log = false }
fixed_args = { "target_python" = "/usr/bin/python3", "approved_root" = "/system.slice" }
input_map = {  }
limits = { timeout_secs = 40 }
input_schema = { "type" = "object", "properties" = {  }, "required" = [], "additionalProperties" = false }
[tools.observe_cgroup_stats.result]
kind = "capability_projection"
fields = { "root" = ["mcp_result", "root"], "boot_id" = ["mcp_result", "boot_id"], "identity" = ["mcp_result", "identity"], "controllers" = ["mcp_result", "controllers"], "subtree_control" = ["mcp_result", "subtree_control"], "ancestors" = ["mcp_result", "ancestors"], "scope" = ["mcp_result", "scope"], "files" = ["mcp_result", "files"], "unavailable" = ["mcp_result", "unavailable"] }
max_bytes = 4096
max_items = 256
max_depth = 8
schema = { "type" = "object", "properties" = { "root" = { "type" = "string", "maxLength" = 256 }, "boot_id" = { "type" = "string", "maxLength" = 36 }, "identity" = { "type" = "string", "maxLength" = 128 }, "controllers" = { "type" = "array", "items" = { "type" = "string", "maxLength" = 64 }, "maxItems" = 32 }, "subtree_control" = { "type" = "array", "items" = { "type" = "string", "maxLength" = 64 }, "maxItems" = 32 }, "ancestors" = { "type" = "array", "items" = { "type" = "object", "properties" = { "path" = { "type" = "string", "maxLength" = 1024 }, "constraints" = { "type" = "array", "items" = { "type" = "object", "properties" = { "name" = { "type" = "string", "maxLength" = 64 }, "value" = { "type" = "string", "maxLength" = 4096 } }, "required" = ["name", "value"], "additionalProperties" = false }, "maxItems" = 8 } }, "required" = ["path", "constraints"], "additionalProperties" = false }, "maxItems" = 32 }, "scope" = { "type" = "string", "maxLength" = 64 }, "files" = { "type" = "array", "items" = { "type" = "object", "properties" = { "name" = { "type" = "string", "maxLength" = 64 }, "kind" = { "type" = "string", "maxLength" = 32, "enum" = ["cumulative", "gauge", "limit", "pressure"] }, "text" = { "type" = "string", "maxLength" = 4096 } }, "required" = ["name", "kind", "text"], "additionalProperties" = false }, "maxItems" = 17 }, "unavailable" = { "type" = "array", "items" = { "type" = "string", "maxLength" = 64 }, "maxItems" = 17 } }, "required" = ["root", "boot_id", "identity", "controllers", "subtree_control", "ancestors", "scope", "files", "unavailable"], "additionalProperties" = false }
