# Reviewed controller-owned native Python payload; no Ansible runtime required.
# Export, review payloads/process_fds_list/manifest.json and fixed policy, then catalog prepare.
# Preparation creates explicit source/adapter/contract/authority approval; activation never refreshes it.
mode = "headless"
capabilities = { named = true }
enabled_tools = ["process_fds_list"]
[targets.server]
ssh_host = "server-ordinary"
[automation.targets.server]
destination = "server-ordinary"
python = "/usr/bin/python3"
[tools.process_fds_list]
description = "Separately sensitive FD targets for one exact boot/start/PID identity. Paths may disclose secrets; explicitly privileged reviewed authority. Bounded live enumeration is not atomic: individual FDs may disappear or be reused, and process identity changes discard all targets. No file content reads."
revision = "1_native1"
targets = ["server"]
authority = "automation:catalog"
effects = ["read"]
execution = { kind = "native_payload", snapshot = "/etc/estus/process_fds_list.payload.json", source = "/etc/estus/payloads/process_fds_list/collector.py", no_log = false }
fixed_args = { "target_python" = "/usr/bin/python3" }
input_map = { "pid" = "pid", "boot_id" = "boot_id", "start_ticks" = "start_ticks", "limit" = "limit" }
limits = { timeout_secs = 20 }
[tools.process_fds_list.input_schema]
type = "object"
required = ["pid", "boot_id", "start_ticks", "limit"]
additionalProperties = false
properties = { "pid" = { "type" = "integer", "minimum" = 1, "maximum" = 4194304 }, "boot_id" = { "type" = "string", "maxLength" = 36, "minLength" = 36 }, "start_ticks" = { "type" = "integer", "minimum" = 0, "maximum" = 9007199254740991 }, "limit" = { "type" = "integer", "minimum" = 1, "maximum" = 8 } }
[tools.process_fds_list.result]
kind = "capability_projection"
fields = { "observed_at" = ["mcp_result", "observed_at"], "status" = ["mcp_result", "status"], "requested" = ["mcp_result", "requested"], "observed_identity" = ["mcp_result", "observed_identity"], "descriptors" = ["mcp_result", "descriptors"], "truncated" = ["mcp_result", "truncated"] }
max_bytes = 4096
max_items = 256
max_depth = 8
[tools.process_fds_list.result.schema]
type = "object"
required = ["observed_at", "status", "requested"]
additionalProperties = false
properties = { "observed_at" = { "type" = "string", "maxLength" = 40 }, "status" = { "type" = "string", "maxLength" = 24, "enum" = ["available", "gone", "denied", "raced", "identity_mismatch"] }, "requested" = { "type" = "object", "required" = ["pid", "start_ticks", "boot_id"], "additionalProperties" = false, "properties" = { "pid" = { "type" = "integer", "minimum" = 1, "maximum" = 4194304 }, "start_ticks" = { "type" = "integer", "minimum" = 0, "maximum" = 9007199254740991 }, "boot_id" = { "type" = "string", "maxLength" = 36, "minLength" = 36 } } }, "observed_identity" = { "type" = "object", "required" = ["pid", "start_ticks", "boot_id"], "additionalProperties" = false, "properties" = { "pid" = { "type" = "integer", "minimum" = 1, "maximum" = 4194304 }, "start_ticks" = { "type" = "integer", "minimum" = 0, "maximum" = 9007199254740991 }, "boot_id" = { "type" = "string", "maxLength" = 36, "minLength" = 36 } } }, "descriptors" = { "type" = "array", "maxItems" = 128, "items" = { "type" = "object", "required" = ["fd", "status"], "additionalProperties" = false, "properties" = { "fd" = { "type" = "integer", "minimum" = 0, "maximum" = 9007199254740991 }, "status" = { "type" = "string", "maxLength" = 16, "enum" = ["available", "gone", "denied"] }, "target" = { "type" = "string", "maxLength" = 4096 } } } }, "truncated" = { "type" = "boolean" } }
