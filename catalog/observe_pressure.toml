# Reviewed controller-owned native Python payload; no Ansible runtime required.
# Export, review payloads/observe_pressure/manifest.json and the fixed policy here, then enable it by name.
# The site supplies targets, authority and fixed policy; the collector digest is checked at load.
mode = "headless"
capabilities = { named = true }
enabled_tools = ["observe_pressure"]
[targets.server]
ssh_host = "server-ordinary"
[automation.targets.server]
destination = "server-ordinary"
python = "/usr/bin/python3"
[tools.observe_pressure]
description = "Read PSI some/full averages and cumulative stall time. Procfs view, not cgroup-effective pressure."
revision = "1_native1"
targets = ["server"]
authority = "automation"
effects = ["read"]
execution = { kind = "native_payload", source = "/etc/estus/payloads/observe_pressure/collector.py", no_log = false }
fixed_args = { "target_python" = "/usr/bin/python3" }
input_map = {  }
limits = { timeout_secs = 20 }
[tools.observe_pressure.input_schema]
type = "object"
required = []
additionalProperties = false
properties = {  }
[tools.observe_pressure.result]
kind = "capability_projection"
fields = { "observed_at" = ["mcp_result", "observed_at"], "scope" = ["mcp_result", "scope"], "pressure" = ["mcp_result", "pressure"] }
max_bytes = 4096
max_items = 256
max_depth = 8
[tools.observe_pressure.result.schema]
type = "object"
required = ["observed_at", "scope", "pressure"]
additionalProperties = false
properties = { "observed_at" = { "type" = "string", "maxLength" = 40 }, "scope" = { "type" = "string", "maxLength" = 32, "const" = "procfs_view" }, "pressure" = { "type" = "array", "maxItems" = 3, "items" = { "type" = "object", "required" = ["resource", "status"], "additionalProperties" = false, "properties" = { "resource" = { "type" = "string", "maxLength" = 6, "enum" = ["cpu", "memory", "io"] }, "status" = { "type" = "string", "maxLength" = 16, "enum" = ["available", "unsupported", "denied"] }, "some" = { "type" = "object", "required" = ["avg10_percent", "avg60_percent", "avg300_percent", "total_microseconds"], "additionalProperties" = false, "properties" = { "avg10_percent" = { "type" = "number", "minimum" = 0, "maximum" = 100 }, "avg60_percent" = { "type" = "number", "minimum" = 0, "maximum" = 100 }, "avg300_percent" = { "type" = "number", "minimum" = 0, "maximum" = 100 }, "total_microseconds" = { "type" = "integer", "minimum" = 0, "maximum" = 9007199254740991 } } }, "full" = { "type" = "object", "required" = ["avg10_percent", "avg60_percent", "avg300_percent", "total_microseconds"], "additionalProperties" = false, "properties" = { "avg10_percent" = { "type" = "number", "minimum" = 0, "maximum" = 100 }, "avg60_percent" = { "type" = "number", "minimum" = 0, "maximum" = 100 }, "avg300_percent" = { "type" = "number", "minimum" = 0, "maximum" = 100 }, "total_microseconds" = { "type" = "integer", "minimum" = 0, "maximum" = 9007199254740991 } } } } } } }
