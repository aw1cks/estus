[tools.observe_pressure]
description = "Read PSI some/full averages and cumulative stall time. Procfs view, not cgroup-effective pressure. status=disabled means the kernel has PSI switched off (reason kernel_default: boot with psi=1; boot_parameter: psi=0 is set)."
revision = "2_native1"
authority = "automation"
effects = ["read"]
execution = { kind = "native_payload", source = "/etc/estus/payloads/observe_pressure/collector.py", no_log = false }
fixed_args = { "target_python" = "/usr/bin/python3" }

input_map = {  }
limits = { timeout_secs = 20 }
[tools.observe_pressure.input_schema]
type = "object"
required = []
additionalProperties = false
properties = {  }
[tools.observe_pressure.result]
kind = "capability_projection"
fields = { "observed_at" = ["mcp_result", "observed_at"], "scope" = ["mcp_result", "scope"], "pressure" = ["mcp_result", "pressure"] }
max_bytes = 4096
max_items = 256
max_depth = 8
[tools.observe_pressure.result.schema]
type = "object"
required = ["observed_at", "scope", "pressure"]
additionalProperties = false
properties = { "observed_at" = { "type" = "string", "maxLength" = 40 }, "scope" = { "type" = "string", "maxLength" = 32, "const" = "procfs_view" }, "pressure" = { "type" = "array", "maxItems" = 3, "items" = { "type" = "object", "required" = ["resource", "status"], "additionalProperties" = false, "properties" = { "resource" = { "type" = "string", "maxLength" = 6, "enum" = ["cpu", "memory", "io"] }, "status" = { "type" = "string", "maxLength" = 16, "enum" = ["available", "disabled", "unsupported", "denied"] }, "reason" = { "type" = "string", "maxLength" = 16, "enum" = ["kernel_default", "boot_parameter"] }, "some" = { "type" = "object", "required" = ["avg10_percent", "avg60_percent", "avg300_percent", "total_microseconds"], "additionalProperties" = false, "properties" = { "avg10_percent" = { "type" = "number", "minimum" = 0, "maximum" = 100 }, "avg60_percent" = { "type" = "number", "minimum" = 0, "maximum" = 100 }, "avg300_percent" = { "type" = "number", "minimum" = 0, "maximum" = 100 }, "total_microseconds" = { "type" = "integer", "minimum" = 0, "maximum" = 9007199254740991 } } }, "full" = { "type" = "object", "required" = ["avg10_percent", "avg60_percent", "avg300_percent", "total_microseconds"], "additionalProperties" = false, "properties" = { "avg10_percent" = { "type" = "number", "minimum" = 0, "maximum" = 100 }, "avg60_percent" = { "type" = "number", "minimum" = 0, "maximum" = 100 }, "avg300_percent" = { "type" = "number", "minimum" = 0, "maximum" = 100 }, "total_microseconds" = { "type" = "integer", "minimum" = 0, "maximum" = 9007199254740991 } } } } } } }
