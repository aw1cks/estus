[tools.inspect_sockets]
description = "List sockets filtered by protocol, state, address or port. No process attribution and no namespace execution."
revision = "1_native1"
authority = "automation"
effects = ["read", "sensitive_read"]
execution = { kind = "native_payload", source = "/etc/estus/payloads/inspect_sockets/collector.py", no_log = false }
fixed_args = { "target_python" = "/usr/bin/python3" }

input_map = { "protocol" = "protocol", "state" = "state", "address" = "address", "local_port" = "local_port", "limit" = "limit" }
limits = { timeout_secs = 30 }
input_schema = { "type" = "object", "properties" = { "protocol" = { "type" = "string", "enum" = ["tcp", "udp"], "maxLength" = 8 }, "state" = { "type" = "string", "enum" = ["all", "listening", "established"], "maxLength" = 16 }, "address" = { "type" = "string", "minLength" = 1, "maxLength" = 64 }, "local_port" = { "type" = "integer", "minimum" = 1, "maximum" = 65535 }, "limit" = { "type" = "integer", "minimum" = 1, "maximum" = 16 } }, "required" = [], "additionalProperties" = false }
[tools.inspect_sockets.result]
kind = "capability_projection"
fields = { "entries" = ["mcp_result", "entries"], "process_attribution" = ["mcp_result", "process_attribution"], "truncated" = ["mcp_result", "truncated"], "scope" = ["mcp_result", "scope"] }
max_bytes = 4096
max_items = 256
max_depth = 8
schema = { "type" = "object", "properties" = { "entries" = { "type" = "array", "items" = { "type" = "object", "properties" = { "protocol" = { "type" = "string", "enum" = ["tcp", "udp"], "maxLength" = 8 }, "state" = { "type" = "string", "maxLength" = 32 }, "local_address" = { "type" = "string", "maxLength" = 64 }, "local_port" = { "type" = "integer", "minimum" = 0, "maximum" = 65535 }, "peer_address" = { "type" = "string", "maxLength" = 64 }, "peer_port" = { "type" = "integer", "minimum" = 0, "maximum" = 65535 }, "receive_queue" = { "type" = "integer", "minimum" = 0, "maximum" = 9007199254740991 }, "send_queue" = { "type" = "integer", "minimum" = 0, "maximum" = 9007199254740991 } }, "required" = ["protocol", "state", "local_address", "local_port", "peer_address", "peer_port", "receive_queue", "send_queue"], "additionalProperties" = false }, "maxItems" = 16 }, "process_attribution" = { "type" = "string", "const" = "not_collected", "maxLength" = 32 }, "truncated" = { "type" = "boolean" }, "scope" = { "type" = "string", "const" = "current_network_namespace", "maxLength" = 32 } }, "required" = ["entries", "process_attribution", "truncated", "scope"], "additionalProperties" = false }
