[tools.observe_systemd_units]
description = "List loaded units or installed unit files and templates, one bounded page per call; pass next_offset as offset until it is absent. Installed file state differs from active state."
revision = "2_native1"
authority = "automation"
effects = ["read"]
execution = { kind = "native_payload", source = "/etc/estus/payloads/observe_systemd_units/collector.py", no_log = false }
fixed_args = { "target_python" = "/usr/bin/python3", "manager_scope" = "system" }

input_map = { "view" = "view", "unit_type" = "unit_type", "state" = "state", "unit_pattern" = "unit_pattern", "offset" = "offset" }
limits = { timeout_secs = 60 }
input_schema = { "type" = "object", "properties" = { "view" = { "type" = "string", "enum" = ["loaded", "installed"] }, "unit_type" = { "type" = "string", "enum" = ["service", "socket", "timer", "target", "mount", "path", "slice"] }, "state" = { "type" = "string", "enum" = ["all", "active", "inactive", "failed"] }, "unit_pattern" = { "type" = "string", "minLength" = 1, "maxLength" = 128 }, "offset" = { "type" = "integer", "minimum" = 0, "maximum" = 255 } }, "required" = ["view", "unit_type", "state", "unit_pattern"], "additionalProperties" = false }
[tools.observe_systemd_units.result]
kind = "capability_projection"
fields = { "scope" = ["mcp_result", "scope"], "view" = ["mcp_result", "view"], "unit_type" = ["mcp_result", "unit_type"], "state" = ["mcp_result", "state"], "units" = ["mcp_result", "units"], "truncated" = ["mcp_result", "truncated"], "source_count" = ["mcp_result", "source_count"], "unit_pattern" = ["mcp_result", "unit_pattern"], "offset" = ["mcp_result", "offset"], "next_offset" = ["mcp_result", "next_offset"] }
max_bytes = 4096
max_items = 256
max_depth = 6
schema = { "type" = "object", "properties" = { "scope" = { "type" = "string", "enum" = ["system", "user"], "maxLength" = 6 }, "view" = { "type" = "string", "maxLength" = 16 }, "unit_type" = { "type" = "string", "maxLength" = 16 }, "state" = { "type" = "string", "maxLength" = 16 }, "units" = { "type" = "array", "items" = { "type" = "object", "properties" = { "unit" = { "type" = "string", "maxLength" = 4096 }, "load" = { "type" = "string", "maxLength" = 4096 }, "active" = { "type" = "string", "maxLength" = 4096 }, "sub" = { "type" = "string", "maxLength" = 4096 }, "description" = { "type" = "string", "maxLength" = 4096 }, "unit_file" = { "type" = "string", "maxLength" = 4096 }, "state" = { "type" = "string", "maxLength" = 4096 }, "preset" = { "type" = "string", "maxLength" = 4096 } }, "required" = [], "additionalProperties" = false }, "maxItems" = 256 }, "truncated" = { "type" = "boolean" }, "source_count" = { "type" = "integer", "minimum" = 0, "maximum" = 256 }, "unit_pattern" = { "type" = "string", "maxLength" = 128 }, "offset" = { "type" = "integer", "minimum" = 0, "maximum" = 255 }, "next_offset" = { "type" = "integer", "minimum" = 1, "maximum" = 255 } }, "required" = ["scope", "view", "unit_type", "state", "units", "truncated", "source_count", "unit_pattern", "offset"], "additionalProperties" = false }
