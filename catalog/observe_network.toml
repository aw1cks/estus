[tools.observe_network]
description = "Read links, addresses, neighbors or one interface's rx/tx counters through `ip`, restricted to the policy's interface allowlist. Counters are cumulative, not rates."
revision = "1_native1"
authority = "automation"
effects = ["read"]
execution = { kind = "native_payload", source = "/etc/estus/payloads/observe_network/collector.py", no_log = false }
fixed_args = { "target_python" = "/usr/bin/python3" }

limits = { timeout_secs = 30 }
input_map = { "aspect" = "aspect", "interface" = "interface", "family" = "family", "scope" = "scope", "limit" = "limit" }
input_schema = { "type" = "object", "properties" = { "aspect" = { "type" = "string", "enum" = ["links", "addresses", "neighbors", "stats"] }, "interface" = { "type" = "string", "minLength" = 1, "maxLength" = 15 }, "family" = { "type" = "string", "enum" = ["inet", "inet6"] }, "scope" = { "type" = "string", "enum" = ["host", "link", "global"] }, "limit" = { "type" = "integer", "minimum" = 1, "maximum" = 16 } }, "required" = ["aspect"], "additionalProperties" = false }
[tools.observe_network.result]
kind = "capability_projection"
fields = { "aspect" = ["mcp_result", "aspect"], "links" = ["mcp_result", "links"], "addresses" = ["mcp_result", "addresses"], "neighbors" = ["mcp_result", "neighbors"], "stats" = ["mcp_result", "stats"] }
max_bytes = 4096
max_items = 256
max_depth = 8
schema = { "type" = "object", "properties" = { "aspect" = { "type" = "string", "enum" = ["links", "addresses", "neighbors", "stats"], "maxLength" = 9 }, "links" = { "type" = "object", "properties" = { "entries" = { "type" = "array", "items" = { "type" = "object", "properties" = { "interface" = { "type" = "string", "maxLength" = 15 }, "index" = { "type" = "integer", "minimum" = 0, "maximum" = 9007199254740991 }, "mtu" = { "type" = "integer", "minimum" = 0, "maximum" = 9007199254740991 }, "state" = { "type" = "string", "maxLength" = 32 }, "flags" = { "type" = "array", "items" = { "type" = "string", "maxLength" = 32 }, "maxItems" = 32 }, "address" = { "type" = "string", "maxLength" = 64 }, "kind" = { "type" = "string", "maxLength" = 64 }, "master" = { "type" = "string", "maxLength" = 64 } }, "required" = ["interface", "index", "mtu", "state", "flags"], "additionalProperties" = false }, "maxItems" = 16 }, "truncated" = { "type" = "boolean" }, "scope" = { "type" = "string", "const" = "approved_interfaces", "maxLength" = 32 } }, "required" = ["entries", "truncated", "scope"], "additionalProperties" = false }, "addresses" = { "type" = "object", "properties" = { "entries" = { "type" = "array", "items" = { "type" = "object", "properties" = { "interface" = { "type" = "string", "maxLength" = 15 }, "family" = { "type" = "string", "enum" = ["inet", "inet6"], "maxLength" = 256 }, "address" = { "type" = "string", "maxLength" = 64 }, "prefix_length" = { "type" = "integer", "minimum" = 0, "maximum" = 128 }, "scope" = { "type" = "string", "maxLength" = 32 } }, "required" = ["interface", "family", "address", "prefix_length", "scope"], "additionalProperties" = false }, "maxItems" = 16 }, "truncated" = { "type" = "boolean" }, "scope" = { "type" = "string", "const" = "approved_interfaces", "maxLength" = 32 } }, "required" = ["entries", "truncated", "scope"], "additionalProperties" = false }, "neighbors" = { "type" = "object", "properties" = { "entries" = { "type" = "array", "items" = { "type" = "object", "properties" = { "destination" = { "type" = "string", "maxLength" = 64 }, "interface" = { "type" = "string", "maxLength" = 15 }, "address" = { "type" = "string", "maxLength" = 64 }, "state" = { "type" = "array", "items" = { "type" = "string", "maxLength" = 32 }, "maxItems" = 16 } }, "required" = ["destination", "interface", "state"], "additionalProperties" = false }, "maxItems" = 16 }, "truncated" = { "type" = "boolean" }, "scope" = { "type" = "string", "const" = "approved_interfaces", "maxLength" = 32 } }, "required" = ["entries", "truncated", "scope"], "additionalProperties" = false }, "stats" = { "type" = "object", "properties" = { "interface" = { "type" = "string", "maxLength" = 15 }, "counters" = { "type" = "object", "properties" = { "rx_bytes" = { "type" = "integer", "minimum" = 0, "maximum" = 9007199254740991 }, "rx_packets" = { "type" = "integer", "minimum" = 0, "maximum" = 9007199254740991 }, "rx_errors" = { "type" = "integer", "minimum" = 0, "maximum" = 9007199254740991 }, "rx_dropped" = { "type" = "integer", "minimum" = 0, "maximum" = 9007199254740991 }, "tx_bytes" = { "type" = "integer", "minimum" = 0, "maximum" = 9007199254740991 }, "tx_packets" = { "type" = "integer", "minimum" = 0, "maximum" = 9007199254740991 }, "tx_errors" = { "type" = "integer", "minimum" = 0, "maximum" = 9007199254740991 }, "tx_dropped" = { "type" = "integer", "minimum" = 0, "maximum" = 9007199254740991 } }, "required" = ["rx_bytes", "rx_packets", "rx_errors", "rx_dropped", "tx_bytes", "tx_packets", "tx_errors", "tx_dropped"], "additionalProperties" = false } }, "required" = ["interface", "counters"], "additionalProperties" = false } }, "required" = ["aspect"], "additionalProperties" = false }
