# Reviewed controller-owned native Python payload; no Ansible runtime required.
# Export, review payloads/inspect_journal/manifest.json and the fixed policy here, then enable it by name.
# The site supplies targets, authority and fixed policy; the collector digest is checked at load.
mode = "headless"
capabilities = { named = true }
[selection]
allow = ["inspect_journal"]
[targets.server]
ssh_host = "server-ordinary"
[automation.targets.server]
destination = "server-ordinary"
python = "/usr/bin/python3"
# Separate reviewed root automation identity; independent of native sudo allowlists.
[automation.authorities.catalog]
ssh_config_file = "/etc/estus/catalog-ssh.conf"
become = { method = "sudo", user = "root" }
[automation.authorities.catalog.targets.server]
destination = "server-catalog"
python = "/usr/bin/python3"
[tools.inspect_journal]
description = "Read bounded journal records filtered by unit, boot, time, priority or literal substring, with a continuation cursor. Cursor expiry means incomplete, not no records."
revision = "2_native1"
targets = ["server"]
authority = "automation:catalog"
effects = ["read", "sensitive_read"]
execution = { kind = "native_payload", source = "/etc/estus/payloads/inspect_journal/collector.py", no_log = false }
fixed_args = { "target_python" = "/usr/bin/python3" }
input_map = { "unit" = "unit", "boot_id" = "boot_id", "since" = "since", "journal_until" = "until", "priority" = "priority", "cursor" = "cursor", "limit" = "limit", "contains" = "contains", "direction" = "direction" }
limits = { timeout_secs = 40 }
input_schema = { "type" = "object", "properties" = { "unit" = { "type" = "string", "minLength" = 1, "maxLength" = 128 }, "boot_id" = { "type" = "string", "maxLength" = 32 }, "since" = { "type" = "integer", "minimum" = 0, "maximum" = 4102444800 }, "until" = { "type" = "integer", "minimum" = 0, "maximum" = 4102444800 }, "priority" = { "type" = "integer", "minimum" = 0, "maximum" = 7 }, "cursor" = { "type" = "string", "maxLength" = 280 }, "limit" = { "type" = "integer", "minimum" = 1, "maximum" = 500 }, "contains" = { "type" = "string", "maxLength" = 128 }, "direction" = { "type" = "string", "maxLength" = 16, "enum" = ["backward", "forward"] } }, "required" = [], "additionalProperties" = false }
[tools.inspect_journal.result]
kind = "capability_projection"
fields = { "boot_id" = ["mcp_result", "boot_id"], "scope" = ["mcp_result", "scope"], "status" = ["mcp_result", "status"], "records" = ["mcp_result", "records"], "continuation_cursor" = ["mcp_result", "continuation_cursor"], "truncated" = ["mcp_result", "truncated"], "incomplete" = ["mcp_result", "incomplete"], "incomplete_reason" = ["mcp_result", "incomplete_reason"], "since" = ["mcp_result", "since"], "until" = ["mcp_result", "until"], "priority_max" = ["mcp_result", "priority_max"] }
max_bytes = 131072
max_items = 4096
max_depth = 8
schema = { "type" = "object", "properties" = { "boot_id" = { "type" = "string", "maxLength" = 32 }, "scope" = { "type" = "string", "maxLength" = 64 }, "status" = { "type" = "string", "maxLength" = 32, "enum" = ["available", "cursor_unavailable"] }, "records" = { "type" = "array", "items" = { "type" = "object", "properties" = { "cursor" = { "type" = "string", "maxLength" = 256 }, "boot_id" = { "type" = "string", "maxLength" = 32 }, "realtime_usec" = { "type" = "integer", "minimum" = 0, "maximum" = 9007199254740991 }, "monotonic_usec" = { "type" = "integer", "minimum" = 0, "maximum" = 9007199254740991 }, "message" = { "type" = "string", "maxLength" = 1024 }, "message_truncated" = { "type" = "boolean" }, "priority" = { "type" = "integer", "minimum" = 0, "maximum" = 7 }, "unit" = { "type" = "string", "maxLength" = 256 }, "transport" = { "type" = "string", "maxLength" = 32 } }, "required" = ["cursor", "boot_id", "realtime_usec", "monotonic_usec", "message", "message_truncated"], "additionalProperties" = false }, "maxItems" = 500 }, "continuation_cursor" = { "type" = "string", "maxLength" = 280 }, "truncated" = { "type" = "boolean" }, "incomplete" = { "type" = "boolean", "const" = true }, "incomplete_reason" = { "type" = "string", "maxLength" = 256 }, "since" = { "type" = "integer", "minimum" = 0, "maximum" = 9007199254740991 }, "until" = { "type" = "integer", "minimum" = 0, "maximum" = 9007199254740991 }, "priority_max" = { "type" = "integer", "minimum" = 0, "maximum" = 7 } }, "required" = ["boot_id", "scope", "status", "records", "continuation_cursor", "truncated", "incomplete", "incomplete_reason", "since", "until", "priority_max"], "additionalProperties" = false }
