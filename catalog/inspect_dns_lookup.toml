# Reviewed controller-owned native Python payload; no Ansible runtime required.
# Export, review payloads/inspect_dns_lookup/manifest.json and fixed policy, then catalog prepare.
# Preparation creates explicit source/adapter/contract/authority approval; activation never refreshes it.
mode = "headless"
capabilities = { named = true }
enabled_tools = ["inspect_dns_lookup"]
[targets.server]
ssh_host = "server-ordinary"
[automation.targets.server]
destination = "server-ordinary"
python = "/usr/bin/python3"
[tools.inspect_dns_lookup]
description = "dns lookup. Active bounded diagnostics; only operator-approved fixture destinations; no application payload."
revision = "1_native1"
targets = ["server"]
authority = "automation"
effects = ["probe"]
execution = { kind = "native_payload", snapshot = "/etc/estus/inspect_dns_lookup.payload.json", source = "/etc/estus/payloads/inspect_dns_lookup/collector.py", no_log = false }
fixed_args = { "target_python" = "/usr/bin/python3", "operator_policy" = { "interface" = "catalog0", "interfaces" = ["lo", "catalog0"], "destinations" = ["127.0.0.1", "192.0.2.2"], "ports" = [18080], "addresses" = ["192.0.2.9/24"], "routes" = ["198.51.100.0/24"], "neighbors" = ["192.0.2.2"], "namespaces" = ["catalogns"], "dns_names" = ["catalog.test"], "resolver" = "127.0.0.1", "dns_port" = 15353 } }
input_map = { "name" = "name", "type" = "type", "resolver" = "resolver" }
limits = { timeout_secs = 30 }
input_schema = { "type" = "object", "properties" = { "name" = { "type" = "string", "enum" = ["catalog.test"], "maxLength" = 256 }, "type" = { "type" = "string", "enum" = ["A", "AAAA"], "maxLength" = 256 }, "resolver" = { "type" = "string", "enum" = ["127.0.0.1"], "maxLength" = 256 } }, "required" = ["name", "type"], "additionalProperties" = false }
[tools.inspect_dns_lookup.result]
kind = "capability_projection"
fields = { "name" = ["mcp_result", "name"], "type" = ["mcp_result", "type"], "resolver" = ["mcp_result", "resolver"], "rcode" = ["mcp_result", "rcode"], "addresses" = ["mcp_result", "addresses"] }
max_bytes = 4096
max_items = 256
max_depth = 8
schema = { "type" = "object", "properties" = { "name" = { "type" = "string", "maxLength" = 253 }, "type" = { "type" = "string", "enum" = ["A", "AAAA"], "maxLength" = 256 }, "resolver" = { "type" = "string", "maxLength" = 64 }, "rcode" = { "type" = "integer", "minimum" = 0, "maximum" = 15 }, "addresses" = { "type" = "array", "items" = { "type" = "string", "maxLength" = 64 }, "maxItems" = 32 } }, "required" = ["name", "type", "resolver", "rcode", "addresses"], "additionalProperties" = false }
