[tools.inspect_dns_lookup]
description = "Resolve one approved name through the configured resolver. Active probe against allowlisted destinations only."
revision = "1_native1"
authority = "automation"
effects = ["probe"]
execution = { kind = "native_payload", source = "/etc/estus/payloads/inspect_dns_lookup/collector.py", no_log = false }
fixed_args = { "target_python" = "/usr/bin/python3" }

input_map = { "name" = "name", "type" = "type", "resolver" = "resolver" }
limits = { timeout_secs = 30 }
input_schema = { "type" = "object", "properties" = { "name" = { "type" = "string", "minLength" = 1, "maxLength" = 253 }, "type" = { "type" = "string", "enum" = ["A", "AAAA"], "maxLength" = 4 }, "resolver" = { "type" = "string", "minLength" = 1, "maxLength" = 64 } }, "required" = ["name", "type"], "additionalProperties" = false }
[tools.inspect_dns_lookup.result]
kind = "capability_projection"
fields = { "name" = ["mcp_result", "name"], "type" = ["mcp_result", "type"], "resolver" = ["mcp_result", "resolver"], "rcode" = ["mcp_result", "rcode"], "addresses" = ["mcp_result", "addresses"] }
max_bytes = 4096
max_items = 256
max_depth = 8
schema = { "type" = "object", "properties" = { "name" = { "type" = "string", "maxLength" = 253 }, "type" = { "type" = "string", "enum" = ["A", "AAAA"], "maxLength" = 4 }, "resolver" = { "type" = "string", "maxLength" = 64 }, "rcode" = { "type" = "integer", "minimum" = 0, "maximum" = 15 }, "addresses" = { "type" = "array", "items" = { "type" = "string", "maxLength" = 64 }, "maxItems" = 32 } }, "required" = ["name", "type", "resolver", "rcode", "addresses"], "additionalProperties" = false }
