[tools.change_nic_features]
description = "Enable or disable one offload feature at runtime and read the resulting flags back. Disruptive, not persistent."
revision = "1_native1"
authority = "automation:catalog"
effects = ["read","runtime_write","availability"]
execution = { kind = "native_payload", source = "/etc/estus/payloads/change_nic_features/collector.py", no_log = false }
fixed_args = { "target_python" = "/usr/bin/python3" }

input_map = {"interface" = "interface","enabled" = "enabled"}
limits = { timeout_secs = 40 }
input_schema = {"type" = "object","properties" = {"interface" = {"type" = "string","enum" = ["tune0"],"maxLength" = 15},"enabled" = {"type" = "boolean"}},"required" = ["interface","enabled"],"additionalProperties" = false}
[tools.change_nic_features.result]
kind = "capability_projection"
fields = {"interface" = ["mcp_result","interface"],"before" = ["mcp_result","before"],"after" = ["mcp_result","after"],"changed" = ["mcp_result","changed"],"verified" = ["mcp_result","verified"],"persistence" = ["mcp_result","persistence"]}
max_bytes = 4096
max_items = 256
max_depth = 8
schema = {"type" = "object","properties" = {"interface" = {"type" = "string","maxLength" = 15},"before" = {"type" = "object","properties" = {"enabled" = {"type" = "boolean"}},"required" = ["enabled"],"additionalProperties" = false},"after" = {"type" = "object","properties" = {"enabled" = {"type" = "boolean"}},"required" = ["enabled"],"additionalProperties" = false},"changed" = {"type" = "boolean"},"verified" = {"type" = "boolean","const" = true},"persistence" = {"type" = "string","const" = "runtime_only","maxLength" = 32}},"required" = ["interface","before","after","changed","verified","persistence"],"additionalProperties" = false}
