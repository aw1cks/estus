# Reviewed controller-owned native Python payload; no Ansible runtime required.
# Export, review payloads/change_package_repository_refresh/manifest.json and fixed policy, then catalog prepare.
# Preparation creates explicit source/adapter/contract/authority approval; activation never refreshes it.
mode = "headless"
capabilities = { named = true }
enabled_tools = ["change_package_repository_refresh"]
[targets.server]
ssh_host = "server-ordinary"
[automation.targets.server]
destination = "server-ordinary"
python = "/usr/bin/python3"
[tools.change_package_repository_refresh]
description = "Explicit authenticated apt cache refresh; zero retries and bounded execution."
revision = "1_native1"
targets = ["server"]
authority = "automation:catalog"
effects = ["persistent_write", "read"]
execution = { kind = "native_payload", snapshot = "/etc/estus/change_package_repository_refresh.payload.json", source = "/etc/estus/payloads/change_package_repository_refresh/collector.py", no_log = false }
fixed_args = { "target_python" = "/usr/bin/python3" }
input_map = {  }
limits = { timeout_secs = 60 }
input_schema = { "type" = "object", "additionalProperties" = false, "required" = [], "properties" = {  } }
[tools.change_package_repository_refresh.result]
kind = "capability_projection"
fields = { "backend" = ["mcp_result", "backend"], "refreshed" = ["mcp_result", "refreshed"], "cache" = ["mcp_result", "cache"], "package_count" = ["mcp_result", "package_count"] }
max_bytes = 4096
max_items = 256
max_depth = 6
schema = { "type" = "object", "additionalProperties" = false, "required" = ["backend", "refreshed", "cache", "package_count"], "properties" = { "backend" = { "type" = "string", "const" = "apt", "maxLength" = 64 }, "refreshed" = { "type" = "boolean", "const" = true }, "cache" = { "type" = "object", "additionalProperties" = false, "required" = ["state"], "properties" = { "state" = { "type" = "string", "maxLength" = 7, "enum" = ["fresh", "stale", "unknown"] }, "age_seconds" = { "type" = "integer", "minimum" = 0, "maximum" = 9007199254740991 } }, "if" = { "properties" = { "state" = { "type" = "string", "maxLength" = 7, "const" = "unknown" } }, "required" = ["state"] }, "then" = { "not" = { "required" = ["age_seconds"] } }, "else" = { "required" = ["age_seconds"] } }, "package_count" = { "type" = "integer", "minimum" = 0, "maximum" = 100000 } } }
