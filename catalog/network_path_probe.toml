# Opt-in Linux network_path_probe; reviewed role and separately imported snapshot required.
# Copy roles/network_path_probe to /etc/estus/roles/network_path_probe; export input_schema/fixed_args/input_map as overlay.json.
# estus --config network_path_probe.toml schema import-role network_path_probe --role-path /etc/estus/roles/network_path_probe --overlay overlay.json --output /etc/estus/network_path_probe.schema.json
# Offline import never runs tasks; review snapshot before enabling. Provision runner root mode 0700.
# Requires pinned /usr/bin/python3 and fixed iproute2 utilities; probes additionally ping/traceroute as applicable.
# Operator policy is fixed_args only: callers cannot replace it. No persistent manager changes or flush/batch.
profile = "actions-only"
enabled_tools = ["network_path_probe"]
[targets.server]
ssh_host = "server-ordinary"
[automation]
workspace_root = "/var/lib/estus/runner"
max_concurrent = 2
max_scratch_bytes = 16777216
max_scratch_files = 512
[automation.targets.server]
destination = "server-ordinary"
python = "/usr/bin/python3"
[automation.authorities.catalog]
ssh_config_file = "/etc/estus/catalog-ssh.conf"
become = { method = "sudo", user = "root" }
[automation.authorities.catalog.targets.server]
destination = "server-catalog"
python = "/usr/bin/python3"
[tools.network_path_probe]
description = "network path probe. Active bounded diagnostics; only operator-approved fixture destinations; no application payload."
revision = "1"
targets = ["server"]
authority = "automation:catalog"
effects = ["probe"]
execution = { "kind" = "ansible_role", "snapshot" = "/etc/estus/network_path_probe.schema.json", "role_path" = "/etc/estus/network_path_probe.schema.roles/network_path_probe", "no_log" = false }
fixed_args = { "target_python" = "/usr/bin/python3", "operator_policy" = { "interface" = "catalog0", "interfaces" = ["lo", "catalog0"], "destinations" = ["127.0.0.1", "192.0.2.2"], "ports" = [18080], "addresses" = ["192.0.2.9/24"], "routes" = ["198.51.100.0/24"], "neighbors" = ["192.0.2.2"], "namespaces" = ["catalogns"], "dns_names" = ["catalog.test"], "resolver" = "127.0.0.1", "dns_port" = 15353 } }
input_map = { "destination" = "destination", "max_hops" = "max_hops", "deadline" = "deadline" }
limits = { timeout_secs = 30 }
input_schema = { "type" = "object", "properties" = { "destination" = { "type" = "string", "enum" = ["127.0.0.1"], "maxLength" = 256 }, "max_hops" = { "type" = "integer", "minimum" = 1, "maximum" = 4 }, "deadline" = { "type" = "integer", "minimum" = 2, "maximum" = 8 } }, "required" = ["destination", "max_hops", "deadline"], "additionalProperties" = false }
[tools.network_path_probe.result]
kind = "ansible_projection"
fields = { "destination" = ["mcp_result", "destination"], "hops" = ["mcp_result", "hops"], "reached" = ["mcp_result", "reached"], "max_probes" = ["mcp_result", "max_probes"] }
max_bytes = 4096
max_items = 256
max_depth = 8
schema = { "type" = "object", "properties" = { "destination" = { "type" = "string", "maxLength" = 64 }, "hops" = { "type" = "array", "items" = { "type" = "object", "properties" = { "ttl" = { "type" = "integer", "minimum" = 1, "maximum" = 4 }, "addresses" = { "type" = "array", "items" = { "type" = "string", "maxLength" = 64 }, "maxItems" = 3 } }, "required" = ["ttl", "addresses"], "additionalProperties" = false }, "maxItems" = 4 }, "reached" = { "type" = "boolean" }, "max_probes" = { "type" = "integer", "minimum" = 1, "maximum" = 4 } }, "required" = ["destination", "hops", "reached", "max_probes"], "additionalProperties" = false }
