[tools.inspect_boot_entry]
description = "Read one approved boot entry, including its command line and any unknown fields. Sensitive; no editing or wildcard selectors."
revision = "1_native1"
authority = "automation:catalog"
effects = ["read", "sensitive_read"]
execution = { kind = "native_payload", source = "/etc/estus/payloads/inspect_boot_entry/collector.py", no_log = false }
# Sensitive values are intentionally returned to this separately approved capability.
# no_log=true would censor the typed projection; review MCP result-retention policy.
fixed_args = { target_python = "/usr/bin/python3" }

input_map = { "entry_id" = "entry_id" }
limits = { timeout_secs = 60 }
input_schema = { "type" = "object", "properties" = { "entry_id" = { "type" = "string", "minLength" = 1, "maxLength" = 255 } }, "required" = ["entry_id"], "additionalProperties" = false }
result = { kind = "capability_projection", fields = { "boot_id" = ["mcp_result", "boot_id"], "source" = ["mcp_result", "source"], "unavailable" = ["mcp_result", "unavailable"], "observed_at" = ["mcp_result", "observed_at"], "entry" = ["mcp_result", "entry"] }, max_bytes = 4096, max_items = 256, max_depth = 8, schema = { "type" = "object", "properties" = { "boot_id" = { "type" = "string", "minLength" = 36, "maxLength" = 36 }, "source" = { "type" = "string", "maxLength" = 128 }, "unavailable" = { "type" = "array", "maxItems" = 32, "items" = { "type" = "string", "maxLength" = 128 } }, "observed_at" = { "type" = "string", "maxLength" = 32 }, "entry" = { "type" = "object", "properties" = { "entry_id" = { "type" = "string", "maxLength" = 255 }, "source" = { "type" = "string", "maxLength" = 128 }, "type" = { "type" = "string", "maxLength" = 128 }, "command_line_sensitive" = { "type" = "boolean" }, "unknown" = { "type" = "array", "maxItems" = 8, "items" = { "type" = "string", "maxLength" = 64 } }, "linux" = { "type" = "string", "maxLength" = 2048 }, "efi" = { "type" = "string", "maxLength" = 2048 }, "title" = { "type" = "string", "maxLength" = 2048 }, "path" = { "type" = "string", "maxLength" = 2048 }, "initrd" = { "type" = "array", "maxItems" = 16, "items" = { "type" = "string", "maxLength" = 2048 } }, "command_line" = { "type" = "string", "maxLength" = 4096 }, "command_line_source" = { "type" = "string", "maxLength" = 128 } }, "required" = ["entry_id", "source", "type", "command_line_sensitive", "unknown", "command_line_source"], "additionalProperties" = false } }, "required" = ["boot_id", "source", "unavailable", "observed_at", "entry"], "additionalProperties" = false } }
