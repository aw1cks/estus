[tools.change_systemd_runtime_limits]
description = "Set runtime memory, task or CPU-quota limits on one allowed unit and read them back. Never persistent, and tighter limits can throttle or OOM the unit."
revision = "1_native1"
authority = "automation:catalog"
effects = ["runtime_write", "availability", "read"]
execution = { kind = "native_payload", source = "/etc/estus/payloads/change_systemd_runtime_limits/collector.py", no_log = false }
fixed_args = { "target_python" = "/usr/bin/python3", "manager_scope" = "system" }

input_map = { "unit" = "unit", "limits" = "limits" }
limits = { timeout_secs = 60 }
input_schema = { "type" = "object", "properties" = { "unit" = { "type" = "string", "maxLength" = 128 }, "limits" = { "type" = "object", "properties" = { "memory_max_bytes" = { "type" = "integer", "minimum" = 16777216, "maximum" = 1099511627776 }, "tasks_max" = { "type" = "integer", "minimum" = 8, "maximum" = 65536 }, "cpu_quota_percent" = { "type" = "integer", "minimum" = 1, "maximum" = 800 } }, "required" = [], "additionalProperties" = false, "minProperties" = 1 } }, "required" = ["unit", "limits"], "additionalProperties" = false }
[tools.change_systemd_runtime_limits.result]
kind = "capability_projection"
fields = { "scope" = ["mcp_result", "scope"], "operation" = ["mcp_result", "operation"], "operation_completed" = ["mcp_result", "operation_completed"], "health" = ["mcp_result", "health"], "unit" = ["mcp_result", "unit"], "properties" = ["mcp_result", "properties"], "requested_limits" = ["mcp_result", "requested_limits"], "persistent" = ["mcp_result", "persistent"] }
max_bytes = 4096
max_items = 256
max_depth = 6
schema = { "type" = "object", "properties" = { "scope" = { "type" = "string", "enum" = ["system", "user"], "maxLength" = 6 }, "operation" = { "type" = "string", "const" = "set_runtime_limits", "maxLength" = 18 }, "operation_completed" = { "type" = "boolean", "const" = true }, "health" = { "type" = "string", "const" = "not_checked", "maxLength" = 11 }, "unit" = { "type" = "string", "maxLength" = 128 }, "properties" = { "type" = "object", "properties" = { "Id" = { "type" = "string", "maxLength" = 4096 }, "LoadState" = { "type" = "string", "maxLength" = 4096 }, "ActiveState" = { "type" = "string", "maxLength" = 4096 }, "SubState" = { "type" = "string", "maxLength" = 4096 }, "UnitFileState" = { "type" = "string", "maxLength" = 4096 }, "MainPID" = { "type" = "string", "maxLength" = 4096 }, "Result" = { "type" = "string", "maxLength" = 4096 }, "MemoryMax" = { "type" = "string", "maxLength" = 4096 }, "TasksMax" = { "type" = "string", "maxLength" = 4096 }, "CPUQuotaPerSecUSec" = { "type" = "string", "maxLength" = 4096 } }, "required" = [], "additionalProperties" = false }, "requested_limits" = { "type" = "object", "properties" = { "memory_max_bytes" = { "type" = "integer", "minimum" = 16777216, "maximum" = 1099511627776 }, "tasks_max" = { "type" = "integer", "minimum" = 8, "maximum" = 65536 }, "cpu_quota_percent" = { "type" = "integer", "minimum" = 1, "maximum" = 800 } }, "required" = [], "additionalProperties" = false, "minProperties" = 1 }, "persistent" = { "type" = "boolean", "const" = false } }, "required" = ["scope", "operation", "operation_completed", "health", "unit", "properties", "requested_limits", "persistent"], "additionalProperties" = false }
