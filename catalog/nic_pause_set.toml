# Reviewed controller-owned native Python payload; no Ansible runtime required.
# Export, review payloads/nic_pause_set/manifest.json and fixed policy, then catalog prepare.
# Preparation creates explicit source/adapter/contract/authority approval; activation never refreshes it.
profile = "actions-only"
enabled_tools = ["nic_pause_set"]
[targets.server]
ssh_host = "server-ordinary"
[automation.targets.server]
destination = "server-ordinary"
python = "/usr/bin/python3"
[automation.authorities.catalog]
ssh_config_file = "/etc/estus/catalog-ssh.conf"
become = { method = "sudo", user = "root" }
[automation.authorities.catalog.targets.server]
destination = "server-catalog"
python = "/usr/bin/python3"
[tools.nic_pause_set]
description = "nic_pause_set: disruptive reviewed runtime-only tuning, actual readback required; independent surviving control path required."
revision = "1_native1"
targets = ["server"]
authority = "automation:catalog"
effects = ["read","runtime_write","availability"]
execution = { kind = "native_payload", snapshot = "/etc/estus/nic_pause_set.payload.json", source = "/etc/estus/payloads/nic_pause_set/collector.py", no_log = false }
fixed_args = {"target_python" = "/usr/bin/python3","operator_policy" = {"interface" = "pause0","mac" = "52:54:00:12:34:58","driver" = "e1000e","allow_runtime_tuning" = true}}
input_map = {"interface" = "interface","rx" = "rx","tx" = "tx"}
limits = { timeout_secs = 40 }
input_schema = {"type" = "object","properties" = {"interface" = {"type" = "string","enum" = ["pause0"],"maxLength" = 15},"rx" = {"type" = "boolean"},"tx" = {"type" = "boolean"}},"required" = ["interface","rx","tx"],"additionalProperties" = false}
[tools.nic_pause_set.result]
kind = "capability_projection"
fields = {"interface" = ["mcp_result","interface"],"before" = ["mcp_result","before"],"after" = ["mcp_result","after"],"changed" = ["mcp_result","changed"],"verified" = ["mcp_result","verified"],"persistence" = ["mcp_result","persistence"]}
max_bytes = 4096
max_items = 256
max_depth = 8
schema = {"type" = "object","properties" = {"interface" = {"type" = "string","maxLength" = 15},"before" = {"type" = "object","properties" = {"autoneg" = {"type" = "boolean"},"rx" = {"type" = "boolean"},"tx" = {"type" = "boolean"}},"required" = ["autoneg","rx","tx"],"additionalProperties" = false},"after" = {"type" = "object","properties" = {"autoneg" = {"type" = "boolean"},"rx" = {"type" = "boolean"},"tx" = {"type" = "boolean"}},"required" = ["autoneg","rx","tx"],"additionalProperties" = false},"changed" = {"type" = "boolean"},"verified" = {"type" = "boolean","const" = true},"persistence" = {"type" = "string","const" = "runtime_only","maxLength" = 32}},"required" = ["interface","before","after","changed","verified","persistence"],"additionalProperties" = false}
