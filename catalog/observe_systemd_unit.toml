# Opt-in Linux systemd binding; review fixed manager scope and unit allowlist.
# Copy roles/observe_systemd_unit to /etc/estus/roles/observe_systemd_unit; export this tool's
# input_schema/fixed_args/input_map as overlay.json, then import offline:
# estus --config observe_systemd_unit.toml schema import-role observe_systemd_unit --role-path /etc/estus/roles/observe_systemd_unit --overlay overlay.json --output /etc/estus/observe_systemd_unit.schema.json
# Review snapshot before activation; provision workspace 0700, target Python/systemctl.
# Unit policy changes review constraints.allowed_units (single source for schema enum and backend allowlist).
# User scope needs the executing account's running user manager and runtime environment.
mode = "headless"
capabilities = { named = true }
enabled_tools = ["observe_systemd_unit"]
[targets.server]
ssh_host = "server-ordinary"
[automation]
workspace_root = "/var/lib/estus/runner"
max_concurrent = 2
max_scratch_bytes = 16777216
max_scratch_files = 512
[automation.targets.server]
destination = "server-ordinary"
python = "/usr/bin/python3"
[tools.observe_systemd_unit]
description = "Query-only maintained systemd_service status, closed non-secret properties. Inactive/failed state is data, not application health."
revision = "1"
targets = ["server"]
authority = "automation"
effects = ["read"]
execution = { kind = "ansible_role", snapshot = "/etc/estus/observe_systemd_unit.schema.json", role_path = "/etc/estus/observe_systemd_unit.schema.roles/observe_systemd_unit", no_log = false }
fixed_args = { "target_python" = "/usr/bin/python3", "manager_scope" = "system" }
input_map = { "unit" = "unit" }
constraints = { allowed_units = ["estus-fixture.service", "estus-fixture-idle.service", "estus-fixture-fail.service", "estus-fixture.timer", "estus-fixture.socket", "estus-fixture-signal.service", "estus-fixture-block.service", "estus-fixture-manager.service", "estus-fixture@.service"] }
limits = { timeout_secs = 60 }
input_schema = { "type" = "object", "properties" = { "unit" = { "type" = "string", "maxLength" = 128 } }, "required" = ["unit"], "additionalProperties" = false }
[tools.observe_systemd_unit.result]
kind = "ansible_projection"
fields = { "scope" = ["mcp_result", "scope"], "properties" = ["mcp_result", "properties"], "unavailable" = ["mcp_result", "unavailable"] }
max_bytes = 4096
max_items = 256
max_depth = 6
schema = { "type" = "object", "properties" = { "scope" = { "type" = "string", "enum" = ["system", "user"], "maxLength" = 6 }, "properties" = { "type" = "object", "properties" = { "Id" = { "type" = "string", "maxLength" = 4096 }, "LoadState" = { "type" = "string", "maxLength" = 4096 }, "ActiveState" = { "type" = "string", "maxLength" = 4096 }, "SubState" = { "type" = "string", "maxLength" = 4096 }, "UnitFileState" = { "type" = "string", "maxLength" = 4096 }, "MainPID" = { "type" = "string", "maxLength" = 4096 }, "Result" = { "type" = "string", "maxLength" = 4096 }, "InvocationID" = { "type" = "string", "maxLength" = 4096 }, "NRestarts" = { "type" = "string", "maxLength" = 4096 }, "ActiveEnterTimestampMonotonic" = { "type" = "string", "maxLength" = 4096 }, "InactiveEnterTimestampMonotonic" = { "type" = "string", "maxLength" = 4096 } }, "required" = [], "additionalProperties" = false }, "unavailable" = { "type" = "array", "items" = { "type" = "string", "enum" = ["Id", "LoadState", "ActiveState", "SubState", "UnitFileState", "MainPID", "Result", "InvocationID", "NRestarts", "ActiveEnterTimestampMonotonic", "InactiveEnterTimestampMonotonic"], "maxLength" = 31 }, "maxItems" = 11 } }, "required" = ["scope", "properties", "unavailable"], "additionalProperties" = false }
