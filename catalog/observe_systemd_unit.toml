# Reviewed controller-owned native Python payload; no Ansible runtime required.
# Export, review payloads/observe_systemd_unit/manifest.json and the fixed policy here, then enable it by name.
# The site supplies targets, authority and fixed policy; the collector digest is checked at load.
mode = "headless"
capabilities = { named = true }
[selection]
allow = ["observe_systemd_unit"]
[targets.server]
ssh_host = "server-ordinary"
[automation.targets.server]
destination = "server-ordinary"
python = "/usr/bin/python3"

[tools.observe_systemd_unit]
description = "Read one allowed unit's non-secret status properties. Inactive or failed is state, not application health."
revision = "1_native1"
targets = ["server"]
authority = "automation"
effects = ["read"]
execution = { kind = "native_payload", source = "/etc/estus/payloads/observe_systemd_unit/collector.py", no_log = false }
fixed_args = { "target_python" = "/usr/bin/python3", "manager_scope" = "system", "allowed_units" = ["estus-fixture.service", "estus-fixture-idle.service", "estus-fixture-fail.service", "estus-fixture.timer", "estus-fixture.socket", "estus-fixture-signal.service", "estus-fixture-block.service", "estus-fixture-manager.service", "estus-fixture@.service"] }
input_map = { "unit" = "unit" }
limits = { timeout_secs = 60 }
input_schema = { "type" = "object", "properties" = { "unit" = { "type" = "string", "minLength" = 1, "maxLength" = 128 } }, "required" = ["unit"], "additionalProperties" = false }
[tools.observe_systemd_unit.result]
kind = "capability_projection"
fields = { "scope" = ["mcp_result", "scope"], "properties" = ["mcp_result", "properties"], "unavailable" = ["mcp_result", "unavailable"] }
max_bytes = 4096
max_items = 256
max_depth = 6
schema = { "type" = "object", "properties" = { "scope" = { "type" = "string", "enum" = ["system", "user"], "maxLength" = 6 }, "properties" = { "type" = "object", "properties" = { "Id" = { "type" = "string", "maxLength" = 4096 }, "LoadState" = { "type" = "string", "maxLength" = 4096 }, "ActiveState" = { "type" = "string", "maxLength" = 4096 }, "SubState" = { "type" = "string", "maxLength" = 4096 }, "UnitFileState" = { "type" = "string", "maxLength" = 4096 }, "MainPID" = { "type" = "string", "maxLength" = 4096 }, "Result" = { "type" = "string", "maxLength" = 4096 }, "InvocationID" = { "type" = "string", "maxLength" = 4096 }, "NRestarts" = { "type" = "string", "maxLength" = 4096 }, "ActiveEnterTimestampMonotonic" = { "type" = "string", "maxLength" = 4096 }, "InactiveEnterTimestampMonotonic" = { "type" = "string", "maxLength" = 4096 } }, "required" = [], "additionalProperties" = false }, "unavailable" = { "type" = "array", "items" = { "type" = "string", "enum" = ["Id", "LoadState", "ActiveState", "SubState", "UnitFileState", "MainPID", "Result", "InvocationID", "NRestarts", "ActiveEnterTimestampMonotonic", "InactiveEnterTimestampMonotonic"], "maxLength" = 31 }, "maxItems" = 11 } }, "required" = ["scope", "properties", "unavailable"], "additionalProperties" = false }
