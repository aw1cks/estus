# Reviewed controller-owned native Python payload; no Ansible runtime required.
# Export, review payloads/storage_device_health_get/manifest.json and fixed policy, then catalog prepare.
# Preparation creates explicit source/adapter/contract/authority approval; activation never refreshes it.
mode = "headless"
capabilities = { named = true }
enabled_tools = ["storage_device_health_get"]
[targets.server]
ssh_host = "server-ordinary"
[automation.targets.server]
destination = "server-ordinary"
python = "/usr/bin/python3"
[automation.authorities.catalog]
ssh_config_file = "/etc/estus/catalog-ssh.conf"
become = { method = "sudo", user = "root" }
[automation.authorities.catalog.targets.server]
destination = "server-catalog-admin"
python = "/usr/bin/python3"
[tools.storage_device_health_get]
description = "Read actual SMART log 02 and controller state of reviewed QEMU NVMe nvme0 (ESTUS-LAB-NVME). Virtual/reported controller scope only: warnings, temperature when reported, spare/use gauges and exact decimal-string 128-bit cumulative counters. No physical-media health guarantee; no self-test, format, trim or repair. Requires preinstalled /usr/bin/nvme."
revision = "1_native1"
targets = ["server"]
authority = "automation:catalog"
effects = ["read"]
execution = { kind = "native_payload", snapshot = "/etc/estus/storage_device_health_get.payload.json", source = "/etc/estus/payloads/storage_device_health_get/collector.py", no_log = false }
fixed_args = { target_python = "/usr/bin/python3" }
input_map = { device = "device" }
limits = { timeout_secs = 30 }
input_schema = { "type" = "object", "required" = ["device"], "additionalProperties" = false, "properties" = { "device" = { "type" = "string", "maxLength" = 32, "enum" = ["/dev/nvme0"] } } }
result = { "kind" = "capability_projection", "fields" = { "device" = ["mcp_result", "device"], "scope" = ["mcp_result", "scope"], "source" = ["mcp_result", "source"], "model" = ["mcp_result", "model"], "controller_state" = ["mcp_result", "controller_state"], "critical_warning" = ["mcp_result", "critical_warning"], "available_spare_percent" = ["mcp_result", "available_spare_percent"], "spare_threshold_percent" = ["mcp_result", "spare_threshold_percent"], "percentage_used" = ["mcp_result", "percentage_used"], "counters" = ["mcp_result", "counters"], "unavailable" = ["mcp_result", "unavailable"], "observed_at" = ["mcp_result", "observed_at"], "temperature_kelvin" = ["mcp_result", "temperature_kelvin"] }, "max_bytes" = 4096, "max_items" = 256, "max_depth" = 8, "schema" = { "type" = "object", "required" = ["device", "scope", "source", "model", "controller_state", "critical_warning", "available_spare_percent", "spare_threshold_percent", "percentage_used", "counters", "unavailable", "observed_at"], "additionalProperties" = false, "properties" = { "device" = { "type" = "string", "maxLength" = 32, "const" = "/dev/nvme0" }, "scope" = { "type" = "string", "maxLength" = 64, "const" = "virtual_reported_controller" }, "source" = { "type" = "string", "maxLength" = 32, "const" = "nvme_smart_log_02" }, "model" = { "type" = "string", "maxLength" = 128 }, "controller_state" = { "type" = "string", "maxLength" = 128 }, "critical_warning" = { "type" = "integer", "minimum" = 0, "maximum" = 255 }, "available_spare_percent" = { "type" = "integer", "minimum" = 0, "maximum" = 255 }, "spare_threshold_percent" = { "type" = "integer", "minimum" = 0, "maximum" = 255 }, "percentage_used" = { "type" = "integer", "minimum" = 0, "maximum" = 255 }, "counters" = { "type" = "object", "required" = ["data_units_read", "data_units_written", "host_read_commands", "host_write_commands", "controller_busy_minutes", "power_cycles", "power_on_hours", "unsafe_shutdowns", "media_errors", "error_log_entries"], "additionalProperties" = false, "properties" = { "data_units_read" = { "type" = "string", "maxLength" = 39, "minLength" = 1 }, "data_units_written" = { "type" = "string", "maxLength" = 39, "minLength" = 1 }, "host_read_commands" = { "type" = "string", "maxLength" = 39, "minLength" = 1 }, "host_write_commands" = { "type" = "string", "maxLength" = 39, "minLength" = 1 }, "controller_busy_minutes" = { "type" = "string", "maxLength" = 39, "minLength" = 1 }, "power_cycles" = { "type" = "string", "maxLength" = 39, "minLength" = 1 }, "power_on_hours" = { "type" = "string", "maxLength" = 39, "minLength" = 1 }, "unsafe_shutdowns" = { "type" = "string", "maxLength" = 39, "minLength" = 1 }, "media_errors" = { "type" = "string", "maxLength" = 39, "minLength" = 1 }, "error_log_entries" = { "type" = "string", "maxLength" = 39, "minLength" = 1 } } }, "unavailable" = { "type" = "array", "maxItems" = 1, "items" = { "type" = "string", "maxLength" = 32, "enum" = ["temperature_kelvin"] } }, "observed_at" = { "type" = "string", "maxLength" = 64 }, "temperature_kelvin" = { "type" = "integer", "minimum" = 0, "maximum" = 65535 } } } }
