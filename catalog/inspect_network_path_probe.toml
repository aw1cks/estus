# Reviewed controller-owned native Python payload; no Ansible runtime required.
# Export, review payloads/inspect_network_path_probe/manifest.json and fixed policy, then catalog prepare.
# Preparation creates explicit source/adapter/contract/authority approval; activation never refreshes it.
mode = "headless"
capabilities = { named = true }
enabled_tools = ["inspect_network_path_probe"]
[targets.server]
ssh_host = "server-ordinary"
[automation.targets.server]
destination = "server-ordinary"
python = "/usr/bin/python3"
[automation.authorities.catalog]
ssh_config_file = "/etc/estus/catalog-ssh.conf"
become = { method = "sudo", user = "root" }
[automation.authorities.catalog.targets.server]
destination = "server-catalog"
python = "/usr/bin/python3"
[tools.inspect_network_path_probe]
description = "network path probe. Active bounded diagnostics; only operator-approved fixture destinations; no application payload."
revision = "1_native1"
targets = ["server"]
authority = "automation:catalog"
effects = ["probe"]
execution = { kind = "native_payload", snapshot = "/etc/estus/inspect_network_path_probe.payload.json", source = "/etc/estus/payloads/inspect_network_path_probe/collector.py", no_log = false }
fixed_args = { "target_python" = "/usr/bin/python3", "operator_policy" = { "interfaces" = [], "destinations" = [], "ports" = [], "addresses" = [], "routes" = [], "neighbors" = [], "namespaces" = [], "dns_names" = [] } }
input_map = { "destination" = "destination", "max_hops" = "max_hops", "deadline" = "deadline" }
limits = { timeout_secs = 30 }
input_schema = { "type" = "object", "properties" = { "destination" = { "type" = "string", "minLength" = 1, "maxLength" = 64 }, "max_hops" = { "type" = "integer", "minimum" = 1, "maximum" = 4 }, "deadline" = { "type" = "integer", "minimum" = 2, "maximum" = 8 } }, "required" = ["destination", "max_hops", "deadline"], "additionalProperties" = false }
[tools.inspect_network_path_probe.result]
kind = "capability_projection"
fields = { "destination" = ["mcp_result", "destination"], "hops" = ["mcp_result", "hops"], "reached" = ["mcp_result", "reached"], "max_probes" = ["mcp_result", "max_probes"] }
max_bytes = 4096
max_items = 256
max_depth = 8
schema = { "type" = "object", "properties" = { "destination" = { "type" = "string", "maxLength" = 64 }, "hops" = { "type" = "array", "items" = { "type" = "object", "properties" = { "ttl" = { "type" = "integer", "minimum" = 1, "maximum" = 4 }, "addresses" = { "type" = "array", "items" = { "type" = "string", "maxLength" = 64 }, "maxItems" = 3 } }, "required" = ["ttl", "addresses"], "additionalProperties" = false }, "maxItems" = 4 }, "reached" = { "type" = "boolean" }, "max_probes" = { "type" = "integer", "minimum" = 1, "maximum" = 4 } }, "required" = ["destination", "hops", "reached", "max_probes"], "additionalProperties" = false }
