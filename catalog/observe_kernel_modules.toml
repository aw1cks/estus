# Reviewed controller-owned native Python payload; no Ansible runtime required.
# Export, review payloads/observe_kernel_modules/manifest.json and the fixed policy here, then enable it by name.
# The site supplies targets, authority and fixed policy; the collector digest is checked at load.
mode = "headless"
capabilities = { named = true }
enabled_tools = ["observe_kernel_modules"]

[targets.server]
ssh_host = "server-ordinary"

[automation.targets.server]
destination = "server-ordinary"
python = "/usr/bin/python3"

[tools.observe_kernel_modules]
description = "List loaded modules with size, reference count, state and holders. Presence is not device health."
revision = "1_native1"
targets = ["server"]
authority = "automation"
effects = ["read"]
execution = { kind = "native_payload", source = "/etc/estus/payloads/observe_kernel_modules/collector.py", no_log = false }
fixed_args = { target_python = "/usr/bin/python3" }
input_map = { "offset" = "offset" }
limits = { timeout_secs = 60 }
input_schema = { "type" = "object", "properties" = { "offset" = { "type" = "integer", "minimum" = 0, "maximum" = 512 } }, "required" = [], "additionalProperties" = false }
result = { kind = "capability_projection", fields = { "boot_id" = ["mcp_result", "boot_id"], "source" = ["mcp_result", "source"], "unavailable" = ["mcp_result", "unavailable"], "observed_at" = ["mcp_result", "observed_at"], "modules" = ["mcp_result", "modules"], "total_count" = ["mcp_result", "total_count"], "next_offset" = ["mcp_result", "next_offset"], "scope" = ["mcp_result", "scope"] }, max_bytes = 4096, max_items = 256, max_depth = 8, schema = { "type" = "object", "properties" = { "boot_id" = { "type" = "string", "minLength" = 36, "maxLength" = 36 }, "source" = { "type" = "string", "maxLength" = 128 }, "unavailable" = { "type" = "array", "maxItems" = 32, "items" = { "type" = "string", "maxLength" = 128 } }, "observed_at" = { "type" = "string", "maxLength" = 32 }, "modules" = { "type" = "array", "maxItems" = 8, "items" = { "type" = "object", "properties" = { "name" = { "type" = "string", "maxLength" = 64 }, "size_bytes" = { "type" = "integer", "minimum" = 0, "maximum" = 9007199254740991 }, "references" = { "type" = "integer", "minimum" = 0, "maximum" = 9007199254740991 }, "holders" = { "type" = "array", "maxItems" = 128, "items" = { "type" = "string", "maxLength" = 64 } }, "state" = { "type" = "string", "maxLength" = 32 } }, "required" = ["name", "size_bytes", "references", "holders", "state"], "additionalProperties" = false } }, "total_count" = { "type" = "integer", "minimum" = 0, "maximum" = 512 }, "next_offset" = { "type" = "integer", "minimum" = -1, "maximum" = 512 }, "scope" = { "type" = "string", "maxLength" = 128 } }, "required" = ["boot_id", "source", "unavailable", "observed_at", "modules", "total_count", "next_offset", "scope"], "additionalProperties" = false } }
