# Reviewed controller-owned native Python payload; no Ansible runtime required.
# Export, review payloads/systemd_timers_list/manifest.json and fixed policy, then catalog prepare.
# Preparation creates explicit source/adapter/contract/authority approval; activation never refreshes it.
profile = "actions-only"
enabled_tools = ["systemd_timers_list"]
[targets.server]
ssh_host = "server-ordinary"
[automation.targets.server]
destination = "server-ordinary"
python = "/usr/bin/python3"
[tools.systemd_timers_list]
description = "Bounded timer last/next trigger timestamps and associated service relationships. Values retain systemd clock units and unset representations."
revision = "1_native1"
targets = ["server"]
authority = "automation"
effects = ["read"]
execution = { kind = "native_payload", snapshot = "/etc/estus/systemd_timers_list.payload.json", source = "/etc/estus/payloads/systemd_timers_list/collector.py", no_log = false }
fixed_args = { "target_python" = "/usr/bin/python3", "manager_scope" = "system" }
input_map = {  }
limits = { timeout_secs = 60 }
input_schema = { "type" = "object", "properties" = {  }, "required" = [], "additionalProperties" = false }
[tools.systemd_timers_list.result]
kind = "capability_projection"
fields = { "scope" = ["mcp_result", "scope"], "timers" = ["mcp_result", "timers"], "truncated" = ["mcp_result", "truncated"], "source_count" = ["mcp_result", "source_count"] }
max_bytes = 4096
max_items = 256
max_depth = 6
schema = { "type" = "object", "properties" = { "scope" = { "type" = "string", "enum" = ["system", "user"], "maxLength" = 6 }, "timers" = { "type" = "array", "items" = { "type" = "object", "properties" = { "Id" = { "type" = "string", "maxLength" = 4096 }, "ActiveState" = { "type" = "string", "maxLength" = 4096 }, "Triggers" = { "type" = "string", "maxLength" = 4096 }, "LastTriggerUSec" = { "type" = "string", "maxLength" = 4096 }, "NextElapseUSecRealtime" = { "type" = "string", "maxLength" = 4096 }, "NextElapseUSecMonotonic" = { "type" = "string", "maxLength" = 4096 } }, "required" = [], "additionalProperties" = false }, "maxItems" = 8 }, "truncated" = { "type" = "boolean" }, "source_count" = { "type" = "integer", "minimum" = 0, "maximum" = 256 } }, "required" = ["scope", "timers", "truncated", "source_count"], "additionalProperties" = false }
