# Reviewed controller-owned native Python payload; no Ansible runtime required.
# Export, review payloads/network_addresses_list/manifest.json and fixed policy, then catalog prepare.
# Preparation creates explicit source/adapter/contract/authority approval; activation never refreshes it.
mode = "headless"
capabilities = { named = true }
enabled_tools = ["network_addresses_list"]
[targets.server]
ssh_host = "server-ordinary"
[automation.targets.server]
destination = "server-ordinary"
python = "/usr/bin/python3"
[tools.network_addresses_list]
description = "network addresses list. Bounded Linux observations; operator-approved interfaces; no process attribution, flags, namespace execution or mutation."
revision = "1_native1"
targets = ["server"]
authority = "automation"
effects = ["read"]
execution = { kind = "native_payload", snapshot = "/etc/estus/network_addresses_list.payload.json", source = "/etc/estus/payloads/network_addresses_list/collector.py", no_log = false }
fixed_args = { "target_python" = "/usr/bin/python3", "operator_policy" = { "interface" = "catalog0", "interfaces" = ["lo", "catalog0"], "destinations" = ["127.0.0.1", "192.0.2.2"], "ports" = [18080], "addresses" = ["192.0.2.9/24"], "routes" = ["198.51.100.0/24"], "neighbors" = ["192.0.2.2"], "namespaces" = ["catalogns"], "dns_names" = ["catalog.test"], "resolver" = "127.0.0.1", "dns_port" = 15353 } }
input_map = { "interface" = "interface", "family" = "family", "scope" = "scope", "limit" = "limit" }
limits = { timeout_secs = 30 }
input_schema = { "type" = "object", "properties" = { "interface" = { "type" = "string", "enum" = ["lo", "catalog0"], "maxLength" = 256 }, "family" = { "type" = "string", "enum" = ["inet", "inet6"], "maxLength" = 256 }, "scope" = { "type" = "string", "enum" = ["host", "link", "global"], "maxLength" = 256 }, "limit" = { "type" = "integer", "minimum" = 1, "maximum" = 16 } }, "required" = [], "additionalProperties" = false }
[tools.network_addresses_list.result]
kind = "capability_projection"
fields = { "entries" = ["mcp_result", "entries"], "truncated" = ["mcp_result", "truncated"], "scope" = ["mcp_result", "scope"] }
max_bytes = 4096
max_items = 256
max_depth = 8
schema = { "type" = "object", "properties" = { "entries" = { "type" = "array", "items" = { "type" = "object", "properties" = { "interface" = { "type" = "string", "maxLength" = 15 }, "family" = { "type" = "string", "enum" = ["inet", "inet6"], "maxLength" = 256 }, "address" = { "type" = "string", "maxLength" = 64 }, "prefix_length" = { "type" = "integer", "minimum" = 0, "maximum" = 128 }, "scope" = { "type" = "string", "maxLength" = 32 } }, "required" = ["interface", "family", "address", "prefix_length", "scope"], "additionalProperties" = false }, "maxItems" = 16 }, "truncated" = { "type" = "boolean" }, "scope" = { "type" = "string", "const" = "approved_interfaces", "maxLength" = 32 } }, "required" = ["entries", "truncated", "scope"], "additionalProperties" = false }
