# Opt-in Linux network_sockets_list; reviewed role and separately imported snapshot required.
# Copy roles/network_sockets_list to /etc/estus/roles/network_sockets_list; export input_schema/fixed_args/input_map as overlay.json.
# estus --config network_sockets_list.toml schema import-role network_sockets_list --role-path /etc/estus/roles/network_sockets_list --overlay overlay.json --output /etc/estus/network_sockets_list.schema.json
# Offline import never runs tasks; review snapshot before enabling. Provision runner root mode 0700.
# Requires pinned /usr/bin/python3 and fixed iproute2 utilities; probes additionally ping/traceroute as applicable.
# Operator policy is fixed_args only: callers cannot replace it. No persistent manager changes or flush/batch.
profile = "actions-only"
enabled_tools = ["network_sockets_list"]
[targets.server]
ssh_host = "server-ordinary"
[automation]
workspace_root = "/var/lib/estus/runner"
max_concurrent = 2
max_scratch_bytes = 16777216
max_scratch_files = 512
[automation.targets.server]
destination = "server-ordinary"
python = "/usr/bin/python3"
[tools.network_sockets_list]
description = "network sockets list. Bounded Linux observations; operator-approved interfaces; no process attribution, flags, namespace execution or mutation."
revision = "1"
targets = ["server"]
authority = "automation"
effects = ["read"]
execution = { "kind" = "ansible_role", "snapshot" = "/etc/estus/network_sockets_list.schema.json", "role_path" = "/etc/estus/network_sockets_list.schema.roles/network_sockets_list", "no_log" = false }
fixed_args = { "target_python" = "/usr/bin/python3", "operator_policy" = { "interface" = "catalog0", "interfaces" = ["lo", "catalog0"], "destinations" = ["127.0.0.1", "192.0.2.2"], "ports" = [18080], "addresses" = ["192.0.2.9/24"], "routes" = ["198.51.100.0/24"], "neighbors" = ["192.0.2.2"], "namespaces" = ["catalogns"], "dns_names" = ["catalog.test"], "resolver" = "127.0.0.1", "dns_port" = 15353 } }
input_map = { "protocol" = "protocol", "state" = "state", "address" = "address", "local_port" = "local_port", "limit" = "limit" }
limits = { timeout_secs = 30 }
input_schema = { "type" = "object", "properties" = { "protocol" = { "type" = "string", "enum" = ["tcp", "udp"], "maxLength" = 256 }, "state" = { "type" = "string", "enum" = ["all", "listening", "established"], "maxLength" = 256 }, "address" = { "type" = "string", "enum" = ["127.0.0.1", "0.0.0.0", "::1", "::"], "maxLength" = 256 }, "local_port" = { "type" = "integer", "minimum" = 1, "maximum" = 65535 }, "limit" = { "type" = "integer", "minimum" = 1, "maximum" = 16 } }, "required" = [], "additionalProperties" = false }
[tools.network_sockets_list.result]
kind = "ansible_projection"
fields = { "entries" = ["mcp_result", "entries"], "process_attribution" = ["mcp_result", "process_attribution"], "truncated" = ["mcp_result", "truncated"], "scope" = ["mcp_result", "scope"] }
max_bytes = 4096
max_items = 256
max_depth = 8
schema = { "type" = "object", "properties" = { "entries" = { "type" = "array", "items" = { "type" = "object", "properties" = { "protocol" = { "type" = "string", "enum" = ["tcp", "udp"], "maxLength" = 256 }, "state" = { "type" = "string", "maxLength" = 32 }, "local_address" = { "type" = "string", "maxLength" = 64 }, "local_port" = { "type" = "integer", "minimum" = 0, "maximum" = 65535 }, "peer_address" = { "type" = "string", "maxLength" = 64 }, "peer_port" = { "type" = "integer", "minimum" = 0, "maximum" = 65535 }, "receive_queue" = { "type" = "integer", "minimum" = 0, "maximum" = 9007199254740991 }, "send_queue" = { "type" = "integer", "minimum" = 0, "maximum" = 9007199254740991 } }, "required" = ["protocol", "state", "local_address", "local_port", "peer_address", "peer_port", "receive_queue", "send_queue"], "additionalProperties" = false }, "maxItems" = 16 }, "process_attribution" = { "type" = "string", "const" = "not_collected", "maxLength" = 32 }, "truncated" = { "type" = "boolean" }, "scope" = { "type" = "string", "const" = "current_network_namespace", "maxLength" = 32 } }, "required" = ["entries", "process_attribution", "truncated", "scope"], "additionalProperties" = false }
