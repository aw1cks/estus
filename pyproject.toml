[build-system]
requires = ["setuptools==84.2.1", "setuptools-rust==1.13.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ssh-mcp"
version = "0.1.0"
description = "Stdio MCP server for operator-configured SSH authority"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
]

[project.scripts]
ssh-mcp = "ssh_mcp:main"

[tool.setuptools.packages.find]
where = ["python"]
namespaces = false

[[tool.setuptools-rust.ext-modules]]
target = { "ssh-mcp" = "ssh_mcp._bin.ssh-mcp" }
binding = "Exec"
cargo-manifest-args = ["--locked"]
rust-version = ">=1.88"
