[build-system]
requires = ["setuptools==84.2.1", "setuptools-rust==1.13.0"]
build-backend = "setuptools.build_meta"

[project]
name = "estus"
version = "0.1.0"
description = "Stdio MCP server for operator-configured SSH authority"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
]

[project.optional-dependencies]
ansible = ["ansible==14.4.0", "ansible-core==2.21.5", "ansible-runner==2.4.3"]

[project.scripts]
estus = "estus:main"

[tool.setuptools.packages.find]
where = ["python"]
namespaces = false

[[tool.setuptools-rust.ext-modules]]
target = { "estus" = "estus._bin.estus" }
binding = "Exec"
cargo-manifest-args = ["--locked"]
rust-version = ">=1.88"
