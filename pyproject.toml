[build-system]
requires = ["setuptools==84.2.1", "setuptools-rust==1.13.0"]
build-backend = "setuptools.build_meta"

[project]
name = "estus"
version = "0.1.1"
description = "Stdio MCP server that gives AI agents structured, policy-gated Linux operations over your own SSH"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.8"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
]

[project.optional-dependencies]
ansible = [
    "ansible==14.4.0; python_version >= '3.12'",
    "ansible-core==2.21.5; python_version >= '3.12'",
]
[project.scripts]
estus = "estus:main"

[tool.setuptools.packages.find]
where = ["python"]
namespaces = false

[[tool.setuptools-rust.ext-modules]]
target = { "estus" = "estus._bin.estus" }
binding = "Exec"
cargo-manifest-args = ["--locked"]
rust-version = ">=1.88"
