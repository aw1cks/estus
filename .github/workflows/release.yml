# Generated from nix/ci.nix. Run: nix run .#generate-workflows
%YAML 1.1
---
concurrency:
  cancel-in-progress: false
  group: release
jobs:
  artifacts:
    if: needs.release-please.outputs.release_created == 'true'
    name: Artifacts
    needs: release-please
    permissions:
      actions: write
      contents: read
    uses: ./.github/workflows/release-artifacts.yml
  finalize:
    name: Publish the release
    needs:
    - release-please
    - publish-github
    - publish-pypi
    - publish-crates
    permissions:
      contents: write
    runs-on: ubuntu-26.04
    steps:
    - env:
        GH_REPO: ${{ github.repository }}
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ needs.release-please.outputs.tag_name }}
      name: Take the release out of draft
      run: gh release edit "$TAG" --draft=false
    timeout-minutes: 5
  publish-crates:
    environment: crates-io
    name: crates.io
    needs:
    - release-please
    - artifacts
    permissions:
      actions: write
      contents: read
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: samueldr/lix-gha-installer-action@a0fee77b2a98bb7c5c0ed7ae6d6ad4903dbdad0d
      with:
        extra_nix_config: |
          auto-optimise-store = false
        github_access_token: ${{ secrets.GITHUB_TOKEN }}
    - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569
      with:
        gc-max-store-size-linux: 2G
        gc-max-store-size-macos: 2G
        primary-key: nix-${{ runner.os }}-${{ runner.arch }}-release-${{ hashFiles('**/*.nix', 'flake.lock') }}
        purge: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        purge-created: 0
        purge-prefixes: nix-${{ runner.os }}-${{ runner.arch }}-release-
        purge-primary-key: never
        restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-release-
        save: true
    - env:
        CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      name: Publish the crate
      run: nix develop --no-update-lock-file .#release --command cargo publish --locked
    timeout-minutes: 30
  publish-github:
    name: GitHub release assets
    needs:
    - release-please
    - artifacts
    permissions:
      contents: write
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        merge-multiple: true
        path: dist
        pattern: release-*
    - name: Write checksums
      run: python3 scripts/release.py checksums dist
    - env:
        GH_REPO: ${{ github.repository }}
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ needs.release-please.outputs.tag_name }}
      name: Attach everything to the draft release
      run: gh release upload "$TAG" dist/* --clobber
    timeout-minutes: 15
  publish-pypi:
    environment: pypi
    name: PyPI
    needs:
    - release-please
    - artifacts
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        merge-multiple: true
        path: all
        pattern: release-*
    - env:
        VERSION: ${{ needs.release-please.outputs.version }}
      name: Select the wheels and the sdist
      run: |
        mkdir pypi
        cp all/*.whl "all/estus-$VERSION.tar.gz" pypi/
        ls -l pypi
    - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
      with:
        packages-dir: pypi
    timeout-minutes: 15
  release-please:
    name: Release pull request
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    runs-on: ubuntu-26.04
    steps:
    - id: release
      uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7
      with:
        config-file: release-please-config.json
        manifest-file: .release-please-manifest.json
    - env:
        BRANCH: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
        GH_REPO: ${{ github.repository }}
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      if: steps.release.outputs.prs_created == 'true'
      name: Run CI on the release pull request
      run: |
        gh workflow run ssh-baseline.yml --ref "$BRANCH"
        gh workflow run release-artifacts.yml --ref "$BRANCH"
    timeout-minutes: 10
name: Release
'on':
  push:
    branches:
    - main
  workflow_dispatch: {}
permissions:
  contents: read
