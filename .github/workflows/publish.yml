# Generated from nix/ci.nix. Run: nix run .#generate-workflows
%YAML 1.1
---
concurrency:
  cancel-in-progress: false
  group: publish-${{ github.ref }}
jobs:
  artifacts:
    name: Artifacts
    needs: verify
    permissions:
      actions: write
      contents: read
    uses: ./.github/workflows/release-artifacts.yml
  finalize:
    name: Publish the release
    needs:
    - publish-github
    - publish-pypi
    - publish-crates
    permissions:
      contents: write
    runs-on: ubuntu-26.04
    steps:
    - env:
        GH_REPO: ${{ github.repository }}
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ github.ref_name }}
      name: Take the release out of draft
      run: gh release edit "$TAG" --draft=false
    timeout-minutes: 5
  publish-crates:
    environment: crates-io
    name: crates.io
    needs: artifacts
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: samueldr/lix-gha-installer-action@a0fee77b2a98bb7c5c0ed7ae6d6ad4903dbdad0d
      with:
        extra_nix_config: |
          auto-optimise-store = false
        github_access_token: ${{ secrets.GITHUB_TOKEN }}
    - name: Prepare the release shell
      run: nix develop --no-update-lock-file .#release --command cargo --version
    - id: auth
      uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9
    - env:
        CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      name: Publish the crate
      run: nix develop --no-update-lock-file .#release --command cargo publish --locked
    timeout-minutes: 30
  publish-github:
    name: GitHub release assets
    needs: artifacts
    permissions:
      attestations: write
      contents: write
      id-token: write
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        merge-multiple: true
        path: dist
        pattern: release-*
    - name: Write checksums
      run: python3 scripts/release.py checksums dist
    - name: Attest build provenance for every asset
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
      with:
        subject-path: dist/*
    - name: List the files each SBOM describes
      run: python3 scripts/release.py sbom-subjects dist --out sbom-subjects --expect x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu x86_64-unknown-linux-musl aarch64-unknown-linux-musl aarch64-apple-darwin
    - name: Attest the x86_64-unknown-linux-gnu SBOM
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
      with:
        sbom-path: dist/estus-x86_64-unknown-linux-gnu.cdx.json
        subject-checksums: sbom-subjects/x86_64-unknown-linux-gnu.sha256
    - name: Attest the aarch64-unknown-linux-gnu SBOM
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
      with:
        sbom-path: dist/estus-aarch64-unknown-linux-gnu.cdx.json
        subject-checksums: sbom-subjects/aarch64-unknown-linux-gnu.sha256
    - name: Attest the x86_64-unknown-linux-musl SBOM
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
      with:
        sbom-path: dist/estus-x86_64-unknown-linux-musl.cdx.json
        subject-checksums: sbom-subjects/x86_64-unknown-linux-musl.sha256
    - name: Attest the aarch64-unknown-linux-musl SBOM
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
      with:
        sbom-path: dist/estus-aarch64-unknown-linux-musl.cdx.json
        subject-checksums: sbom-subjects/aarch64-unknown-linux-musl.sha256
    - name: Attest the aarch64-apple-darwin SBOM
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
      with:
        sbom-path: dist/estus-aarch64-apple-darwin.cdx.json
        subject-checksums: sbom-subjects/aarch64-apple-darwin.sha256
    - env:
        GH_REPO: ${{ github.repository }}
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ github.ref_name }}
      name: Attach everything to the draft release
      run: gh release upload "$TAG" dist/* --clobber
    timeout-minutes: 15
  publish-pypi:
    environment: pypi
    name: PyPI
    needs: artifacts
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        merge-multiple: true
        path: all
        pattern: release-*
    - env:
        TAG: ${{ github.ref_name }}
      name: Select the wheels and the sdist
      run: |
        version="${TAG#v}"
        mkdir pypi
        cp all/*.whl "all/estus-$version.tar.gz" pypi/
        ls -l pypi
    - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
      with:
        packages-dir: pypi
    timeout-minutes: 15
  retry:
    if: ${{ always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && true }}
    name: Request a retry of infrastructure failures
    needs:
    - verify
    - artifacts
    - publish-github
    - publish-pypi
    - publish-crates
    - finalize
    permissions:
      actions: write
    runs-on: ubuntu-26.04
    steps:
    - env:
        GH_REPO: ${{ github.repository }}
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RUN_ID: ${{ github.run_id }}
      name: Dispatch ci-retry.yml for this run
      run: gh workflow run ci-retry.yml --ref main -f run_id="$RUN_ID"
    timeout-minutes: 5
  verify:
    name: Check the release
    permissions:
      contents: write
    runs-on: ubuntu-26.04
    steps:
    - env:
        GH_REPO: ${{ github.repository }}
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        REF_TYPE: ${{ github.ref_type }}
        SHA: ${{ github.sha }}
        TAG: ${{ github.ref_name }}
      name: Require an unpublished release on a tag on main
      run: |
        set -euo pipefail
        if [ "$REF_TYPE" != tag ]; then
          echo "::error::Run this on a release tag, not a branch."
          exit 1
        fi
        case "$TAG" in
          v[0-9]*) ;;
          *) echo "::error::$TAG is not a version tag."; exit 1 ;;
        esac
        draft=$(gh api "repos/$GH_REPO/releases" --paginate \
          --jq ".[] | select(.tag_name == \"$TAG\") | .draft")
        if [ "$draft" != true ]; then
          echo "::error::There is no draft release for $TAG; only an unpublished release can be published."
          exit 1
        fi
        status=$(gh api "repos/$GH_REPO/compare/main...$SHA" --jq .status)
        case "$status" in
          identical|behind) ;;
          *) echo "::error::$TAG is not on main."; exit 1 ;;
        esac
    timeout-minutes: 5
name: Publish
'on':
  push:
    tags:
    - v*
  workflow_dispatch: {}
permissions:
  contents: read
