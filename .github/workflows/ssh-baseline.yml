# Generated from nix/ci.nix. Run: nix run .#generate-workflows
%YAML 1.1
---
concurrency:
  cancel-in-progress: ${{ github.event_name != 'push' }}
  group: ${{ github.workflow }}-${{ github.ref }}
jobs:
  verify:
    name: ${{ matrix.name }}
    permissions:
      actions: write
      contents: read
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: samueldr/lix-gha-installer-action@a0fee77b2a98bb7c5c0ed7ae6d6ad4903dbdad0d
      with:
        extra_nix_config: |
          auto-optimise-store = false
        github_access_token: ${{ secrets.GITHUB_TOKEN }}
    - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569
      with:
        gc-max-store-size-linux: 2G
        gc-max-store-size-macos: 2G
        primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.nix', 'flake.lock', '**/Cargo.toml', 'Cargo.lock', '**/*.rs') }}
        purge: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        purge-created: 0
        purge-prefixes: nix-${{ runner.os }}-${{ runner.arch }}-
        purge-primary-key: never
        restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-
        save: true
    - name: Run flake checks
      run: nix flake check -L --no-update-lock-file --keep-going
    - if: runner.os == 'macOS'
      name: Run packaged native SSH acceptance
      run: |
        runtime=$(mktemp -d "$HOME/.ssh-mcp-native.XXXXXXXX")
        trap 'rm -rf -- "$runtime"' EXIT
        XDG_RUNTIME_DIR="$runtime" nix run -L --no-update-lock-file .#ssh-native
    - env:
        DOCKER_HOST: unix:///var/run/docker.sock
      if: runner.os == 'Linux'
      name: Run packaged Linux acceptance
      run: nix run -L --no-update-lock-file .#ci
    strategy:
      fail-fast: false
      matrix:
        include:
        - name: ssh-baseline-linux
          runner: ubuntu-26.04
        - name: ssh-baseline-linux-arm64
          runner: ubuntu-26.04-arm
        - name: ssh-native-macos-arm64
          runner: macos-26
    timeout-minutes: 45
name: SSH baseline
'on':
  pull_request: {}
  push:
    branches:
    - main
  workflow_dispatch: {}
permissions:
  contents: read
