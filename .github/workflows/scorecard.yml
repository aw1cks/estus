# Generated from nix/ci.nix. Run: nix run .#generate-workflows
%YAML 1.1
---
jobs:
  analysis:
    name: Scorecard analysis
    permissions:
      actions: read
      contents: read
      id-token: write
      security-events: write
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5
      with:
        fail_on_publish_error: true
        publish_results: true
        results_file: results.sarif
        results_format: sarif
    - if: always()
      uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874
      with:
        name: scorecard-sarif
        path: results.sarif
        retention-days: 5
    - if: always()
      uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934
      with:
        sarif_file: results.sarif
    timeout-minutes: 15
name: Scorecard
'on':
  push:
    branches:
    - main
  schedule:
  - cron: 23 5 * * 1
permissions:
  contents: read
