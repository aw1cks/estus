[package]
name = "ssh-mcp-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
rmcp = { version = "3.9.0", default-features = false, features = ["server", "transport-io"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shell-escape = "0.1.5"

[[bin]]
name = "command_encoding"
path = "fuzz_targets/command_encoding.rs"
test = false
doc = false
bench = false

[[bin]]
name = "wire_budget"
path = "fuzz_targets/wire_budget.rs"
test = false
doc = false
bench = false

[profile.release]
debug = 1
