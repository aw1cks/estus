[package]
name = "estus-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
rmcp = { version = "3.9.0", default-features = false, features = ["server", "transport-io"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shell-escape = "0.1.5"
base64 = "0.22"
bytes = "1"
sha2 = { version = "0.11.1", default-features = false }
hex = "0.4.3"
openssh-sftp-client = { version = "0.15.12", default-features = false }
openssh-sftp-protocol = { version = "=0.26.0", default-features = false }

[[bin]]
name = "command_encoding"
path = "fuzz_targets/command_encoding.rs"
test = false
doc = false
bench = false

[[bin]]
name = "wire_budget"
path = "fuzz_targets/wire_budget.rs"
test = false
doc = false
bench = false

[[bin]]
name = "file_encoding"
path = "fuzz_targets/file_encoding.rs"
test = false
doc = false
bench = false

[[bin]]
name = "filename_metadata"
path = "fuzz_targets/filename_metadata.rs"
test = false
doc = false
bench = false

[profile.release]
debug = 1

[patch.crates-io]
openssh-sftp-protocol = { path = "../vendor/openssh-sftp-protocol" }
