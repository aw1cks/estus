# Reviewed Linux-only journal_read; logs can contain secrets; no arbitrary paths/code/flags.
# Copy roles/journal_read to /etc/estus/roles/journal_read, review all tasks, export
# input_schema/fixed_args/input_map as overlay.json, then import offline:
# estus --config journal_read.toml schema import-role journal_read --role-path /etc/estus/roles/journal_read --overlay overlay.json --output /etc/estus/journal_read.schema.json
# Review snapshot before activation; provision /var/lib/estus/runner mode 0700.
# Install pinned Python3 and the fixed utilities used below; no auto-install.
profile = "actions-only"
enabled_tools = ["journal_read"]
[targets.server]
ssh_host = "server-ordinary"
[automation]
workspace_root = "/var/lib/estus/runner"
max_concurrent = 2
max_scratch_bytes = 16777216
max_scratch_files = 512
[automation.targets.server]
destination = "server-ordinary"
python = "/usr/bin/python3"
# Separate reviewed root automation identity; independent of native sudo allowlists.
[automation.authorities.catalog]
ssh_config_file = "/etc/estus/catalog-ssh.conf"
become = { method = "sudo", user = "root" }
[automation.authorities.catalog.targets.server]
destination = "server-catalog"
python = "/usr/bin/python3"
[tools.journal_read]
description = "Read selected bounded retained approved unit journal records. Explicit boot/time/priority scope; cursor expiry is not silently complete. Sensitive root read, no follow/deletion."
revision = "1"
targets = ["server"]
authority = "automation:catalog"
effects = ["read", "sensitive_read"]
execution = { kind = "ansible_role", snapshot = "/etc/estus/journal_read.schema.json", role_path = "/etc/estus/journal_read.schema.roles/journal_read", no_log = false }
fixed_args = { "target_python" = "/usr/bin/python3" }
input_map = { "unit" = "unit", "boot_id" = "boot_id", "since" = "since", "journal_until" = "until", "priority" = "priority", "cursor" = "cursor", "limit" = "limit" }
limits = { timeout_secs = 40 }
input_schema = { "type" = "object", "properties" = { "unit" = { "type" = "string", "maxLength" = 128, "enum" = ["estus-fixture.service"] }, "boot_id" = { "type" = "string", "maxLength" = 32 }, "since" = { "type" = "integer", "minimum" = 0, "maximum" = 4102444800 }, "until" = { "type" = "integer", "minimum" = 0, "maximum" = 4102444800 }, "priority" = { "type" = "integer", "minimum" = 0, "maximum" = 7 }, "cursor" = { "type" = "string", "maxLength" = 256 }, "limit" = { "type" = "integer", "minimum" = 1, "maximum" = 4 } }, "required" = ["boot_id", "since", "until", "priority", "limit", "unit"], "additionalProperties" = false }
[tools.journal_read.result]
kind = "ansible_projection"
fields = { "boot_id" = ["mcp_result", "boot_id"], "scope" = ["mcp_result", "scope"], "status" = ["mcp_result", "status"], "records" = ["mcp_result", "records"], "continuation_cursor" = ["mcp_result", "continuation_cursor"], "truncated" = ["mcp_result", "truncated"], "incomplete" = ["mcp_result", "incomplete"], "incomplete_reason" = ["mcp_result", "incomplete_reason"], "since" = ["mcp_result", "since"], "until" = ["mcp_result", "until"], "priority_max" = ["mcp_result", "priority_max"] }
max_bytes = 4096
max_items = 256
max_depth = 8
schema = { "type" = "object", "properties" = { "boot_id" = { "type" = "string", "maxLength" = 32 }, "scope" = { "type" = "string", "maxLength" = 64 }, "status" = { "type" = "string", "maxLength" = 32, "enum" = ["available", "cursor_unavailable"] }, "records" = { "type" = "array", "items" = { "type" = "object", "properties" = { "cursor" = { "type" = "string", "maxLength" = 256 }, "boot_id" = { "type" = "string", "maxLength" = 32 }, "realtime_usec" = { "type" = "integer", "minimum" = 0, "maximum" = 9007199254740991 }, "monotonic_usec" = { "type" = "integer", "minimum" = 0, "maximum" = 9007199254740991 }, "message" = { "type" = "string", "maxLength" = 256 }, "message_truncated" = { "type" = "boolean" }, "priority" = { "type" = "integer", "minimum" = 0, "maximum" = 7 }, "unit" = { "type" = "string", "maxLength" = 256 }, "transport" = { "type" = "string", "maxLength" = 32 } }, "required" = ["cursor", "boot_id", "realtime_usec", "monotonic_usec", "message", "message_truncated"], "additionalProperties" = false }, "maxItems" = 4 }, "continuation_cursor" = { "type" = "string", "maxLength" = 256 }, "truncated" = { "type" = "boolean" }, "incomplete" = { "type" = "boolean", "const" = true }, "incomplete_reason" = { "type" = "string", "maxLength" = 256 }, "since" = { "type" = "integer", "minimum" = 0, "maximum" = 9007199254740991 }, "until" = { "type" = "integer", "minimum" = 0, "maximum" = 9007199254740991 }, "priority_max" = { "type" = "integer", "minimum" = 0, "maximum" = 7 } }, "required" = ["boot_id", "scope", "status", "records", "continuation_cursor", "truncated", "incomplete", "incomplete_reason", "since", "until", "priority_max"], "additionalProperties" = false }
