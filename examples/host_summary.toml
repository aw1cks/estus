# Linux-only ordinary host observation; no caller payload or privilege escalation.
# Copy roles/host_summary to /etc/estus/roles/host_summary and review every task.
# Export input_schema/fixed_args/input_map as overlay.json, then run:
# estus --config host_summary.toml schema import-role host_summary --role-path /etc/estus/roles/host_summary --overlay overlay.json --output /etc/estus/host_summary.schema.json
# Import is offline and never runs tasks. Review the snapshot before enabling.
# Provision /var/lib/estus/runner mode 0700 owned by the MCP account.
# Select an installed optional automation runtime; target needs /usr/bin/python3.
# MCP: {"host":"server","inputs":{}}
profile = "actions-only"
enabled_tools = ["host_summary"]

[targets.server]
ssh_host = "server-ordinary"

[automation]
workspace_root = "/var/lib/estus/runner"
max_concurrent = 2
max_scratch_bytes = 16777216
max_scratch_files = 512

[automation.targets.server]
destination = "server-ordinary"
python = "/usr/bin/python3"

[tools.host_summary]
description = "Observe selected Linux OS facts, boot identifier and bounded uptime through the ordinary SSH process view. Virtualization hints are not isolation attestation; the collection is not an atomic snapshot."
revision = "1"
targets = ["server"]
authority = "automation"
effects = ["read"]
execution = { kind = "ansible_role", snapshot = "/etc/estus/host_summary.schema.json", role_path = "/etc/estus/roles/host_summary", no_log = false }
fixed_args = { target_python = "/usr/bin/python3" }
input_map = {}
limits = { timeout_secs = 30 }

[tools.host_summary.input_schema]
type = "object"
required = []
additionalProperties = false
properties = {}

[tools.host_summary.result]
kind = "ansible_projection"
fields = { system = ["mcp_result", "system"], distribution = ["mcp_result", "distribution"], distribution_version = ["mcp_result", "distribution_version"], kernel = ["mcp_result", "kernel"], architecture = ["mcp_result", "architecture"], boot_id = ["mcp_result", "boot_id"], uptime_seconds = ["mcp_result", "uptime_seconds"], observed_at = ["mcp_result", "observed_at"], scope = ["mcp_result", "scope"], virtualization_type = ["mcp_result", "virtualization_type"], virtualization_role = ["mcp_result", "virtualization_role"], unavailable = ["mcp_result", "unavailable"] }
max_bytes = 4096
max_items = 64
max_depth = 4

[tools.host_summary.result.schema]
type = "object"
required = ["system", "kernel", "architecture", "observed_at", "scope", "unavailable"]
additionalProperties = false
properties = { system = { type = "string", maxLength = 64 }, distribution = { type = "string", maxLength = 128 }, distribution_version = { type = "string", maxLength = 128 }, kernel = { type = "string", maxLength = 256 }, architecture = { type = "string", maxLength = 64 }, boot_id = { type = "string", minLength = 36, maxLength = 36 }, uptime_seconds = { type = "integer", minimum = 0, maximum = 9007199254740991 }, observed_at = { type = "string", maxLength = 32 }, scope = { type = "string", const = "ssh_process_view", maxLength = 32 }, virtualization_type = { type = "string", maxLength = 64 }, virtualization_role = { type = "string", maxLength = 5, enum = ["guest", "host"] }, unavailable = { type = "array", maxItems = 6, uniqueItems = true, items = { type = "string", maxLength = 32, enum = ["distribution", "distribution_version", "boot_id", "uptime_seconds", "virtualization_type", "virtualization_role"] } } }
