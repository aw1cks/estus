# Independently opt-in nic_rss_set; import and review this role snapshot before activation.
# Requires /usr/bin/python3, /usr/bin/ethtool and reviewed virtio_net capabilities.
# Operator pins isolated interface/MAC/driver. NEVER target management0 or a management path.
# Runtime only; no persistence, rollback, replay or wire-level flow-control guarantees.
# Changes only a reviewed 40-byte Toeplitz hash-key preset, including on single-queue Virtio hash-report devices; no arbitrary key material or queue claims.
# Import: estus --config nic_rss_set.toml schema import-role nic_rss_set --role-path /etc/estus/roles/nic_rss_set --overlay overlay.json --output /etc/estus/nic_rss_set.schema.json
profile = "actions-only"
enabled_tools = ["nic_rss_set"]
[targets.server]
ssh_host = "server-ordinary"
[automation]
workspace_root = "/var/lib/estus/runner"
max_concurrent = 2
max_scratch_bytes = 16777216
max_scratch_files = 512
[automation.targets.server]
destination = "server-ordinary"
python = "/usr/bin/python3"
[automation.authorities.catalog]
ssh_config_file = "/etc/estus/catalog-ssh.conf"
become = { method = "sudo", user = "root" }
[automation.authorities.catalog.targets.server]
destination = "server-catalog"
python = "/usr/bin/python3"
[tools.nic_rss_set]
description = "nic_rss_set: disruptive reviewed runtime-only tuning, actual readback required; independent surviving control path required."
revision = "1"
targets = ["server"]
authority = "automation:catalog"
effects = ["read","runtime_write","availability"]
execution = { "kind" = "ansible_role", "snapshot" = "/etc/estus/nic_rss_set.schema.json", "role_path" = "/etc/estus/roles/nic_rss_set", "no_log" = false }
fixed_args = {"target_python" = "/usr/bin/python3","operator_policy" = {"interface" = "tune0","mac" = "52:54:00:12:34:57","driver" = "virtio_net","allow_runtime_tuning" = true}}
input_map = { interface = "interface", preset = "preset" }
limits = { timeout_secs = 40 }
input_schema = {"type" = "object","properties" = {"interface" = {"type" = "string","enum" = ["tune0"],"maxLength" = 15},"preset" = {"type" = "string","enum" = ["standard","rotated"],"maxLength" = 16}},"required" = ["interface","preset"],"additionalProperties" = false}
[tools.nic_rss_set.result]
kind = "ansible_projection"
fields = {"interface" = ["mcp_result","interface"],"before" = ["mcp_result","before"],"after" = ["mcp_result","after"],"changed" = ["mcp_result","changed"],"verified" = ["mcp_result","verified"],"persistence" = ["mcp_result","persistence"]}
max_bytes = 4096
max_items = 256
max_depth = 8
schema = {"type" = "object","properties" = {"interface" = {"type" = "string","maxLength" = 15},"before" = {"type" = "object","properties" = {"key_bytes" = {"type" = "integer","const" = 40},"key_sha256" = {"type" = "string","maxLength" = 64}},"required" = ["key_bytes","key_sha256"],"additionalProperties" = false},"after" = {"type" = "object","properties" = {"key_bytes" = {"type" = "integer","const" = 40},"key_sha256" = {"type" = "string","maxLength" = 64}},"required" = ["key_bytes","key_sha256"],"additionalProperties" = false},"changed" = {"type" = "boolean"},"verified" = {"type" = "boolean","const" = true},"persistence" = {"type" = "string","const" = "runtime_only","maxLength" = 32}},"required" = ["interface","before","after","changed","verified","persistence"],"additionalProperties" = false}
