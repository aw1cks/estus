---
argument_specs:
  main:
    short_description: systemd_unit_set_runtime_limits reviewed bounded capability
    options:
      target_python:
        type: str
        required: true
      manager_scope:
        type: str
        required: true
        choices: [system, user]
      allowed_units:
        type: list
        required: true
        elements: str
      unit:
        type: str
        required: true
      limits:
        type: dict
        required: true
        options:
          memory_max_bytes:
            type: int
          tasks_max:
            type: int
          cpu_quota_percent:
            type: int
