---
- name: Single-package upgrade with exact version, hold checks, closed dependency plan and independent postcondition; interrupted execution is never replayed.
  ansible.builtin.command:
    argv:
      - '{{ target_python }}'
      - '-I'
      - '-c'
      - |
        import json, sys
        approved_packages=json.loads(sys.argv[2])
        import datetime, json, os, re, subprocess, tempfile, time
        import apt

        def run(argv, timeout=12):
            # A regular temporary file bounds memory and rejects oversized command output.
            with tempfile.TemporaryFile() as out:
                proc = subprocess.Popen(argv, stdout=out, stderr=out, env=dict(os.environ, LC_ALL='C', DEBIAN_FRONTEND='noninteractive'))
                end = time.monotonic() + timeout
                while proc.poll() is None:
                    if time.monotonic() > end or os.fstat(out.fileno()).st_size > 262144:
                        proc.kill(); proc.wait()
                        raise ValueError('command timed out/oversized; mutation may be uncertain; never replay automatically')
                    time.sleep(.02)
                if os.fstat(out.fileno()).st_size > 262144:
                    raise ValueError('command output exceeds bound')
                out.seek(0); text = out.read(262145).decode('utf-8', 'strict')
                if proc.returncode:
                    raise ValueError('package command failed; do not replay: ' + text[:2048])
                return text

        def cache():
            c = apt.Cache()
            if len(c) > 100000:
                raise ValueError('package cache exceeds supported bound')
            return c

        def package(name):
            if name not in approved_packages or not re.fullmatch(r'[a-z0-9][a-z0-9+.-]{0,63}', name):
                raise ValueError('package outside reviewed allowlist')
            c = cache()
            if name not in c:
                raise ValueError('unknown package')
            return c[name]

        def freshness():
            # apt's success stamp is created only by the explicit refresh procedure.
            try:
                age = max(0, int(time.time() - os.stat('/var/lib/apt/periodic/update-success-stamp').st_mtime))
                return {'state': 'fresh' if age <= 86400 else 'stale', 'age_seconds': min(age, 9007199254740991)}
            except FileNotFoundError:
                return {'state':'unknown', 'age_seconds':None}
        request=json.loads(sys.argv[1])
        name=request['package']
        p=package(name)
        before=p.installed.version if p.installed else None
        holds=run(['/usr/bin/apt-mark','showhold']).splitlines()
        if name in holds and before!=request['version']: raise ValueError('held package; no change attempted')
        version=request['version']
        if not re.fullmatch(r'[0-9A-Za-z.+:~_-]{1,96}',version): raise ValueError('invalid version')
        if before!=version and not any(v.version==version for v in p.versions): raise ValueError('requested version unavailable')
        if before is None: raise ValueError('upgrade requires installed package')
        import apt_pkg
        if apt_pkg.version_compare(version,before)<0: raise ValueError('upgrade cannot downgrade')
        args=['install','--no-install-recommends',name+'='+version]
        base=['/usr/bin/apt-get','-o','DPkg::Lock::Timeout=0','-o','Acquire::Retries=0','-o','Acquire::http::Timeout=5','-o','Acquire::https::Timeout=5','--assume-yes']
        if before!=version:
            plan=run(base+['--simulate']+args)
            # Fail closed if apt proposes any effect outside this exact package.
            for line in plan.splitlines():
                if line.startswith(('Inst ','Remv ','Conf ')) and line.split()[1] != name:
                    raise ValueError('dependency effect outside reviewed single-package operation')
            run(base+args,25)
        records=run(['/usr/bin/dpkg-query','--show','--showformat=${Package}\t${db:Status-Abbrev}\t${Version}\n']).splitlines()
        installed=[line.split('\t')[2] for line in records if len(line.split('\t'))==3 and line.split('\t')[0]==name and line.split('\t')[1].startswith('ii')]
        after=installed[0] if len(installed)==1 else None
        if after!=version: raise ValueError('independent dpkg state postcondition failed; never replay')
        before_state={'installed':before is not None}
        after_state={'installed':after is not None}
        if before is not None: before_state['version']=before
        if after is not None: after_state['version']=after
        result={'package':name,'before':before_state,'after':after_state,'verified':True,'changed':before!=after}

        encoded=json.dumps(result,separators=(',',':'),allow_nan=False)
        if len(encoded)>4096: raise ValueError('result exceeds bound')
        print(encoded)
      - '{{ {"package": package, "version": version} | to_json }}'
      - '{{ approved_packages | to_json }}'
    expand_argument_vars: false
  register: package_observation
  changed_when: package_observation.rc == 0 and (package_observation.stdout | from_json).changed

- name: Publish bounded package result after postconditions
  ansible.builtin.set_fact:
    mcp_result: '{{ package_observation.stdout | from_json }}'
