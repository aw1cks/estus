---
- name: Single-package upgrade with exact version, hold checks, closed dependency plan and independent postcondition; interrupted execution is never replayed.
  ansible.builtin.command:
    argv:
      - '{{ target_python }}'
      - '-I'
      - '-c'
      - "{{ lookup('ansible.builtin.file', role_path ~ '/files/collector.py', rstrip=False) }}"
      - '{{ {"package": package, "version": version} | to_json }}'
      - '{{ approved_packages | to_json }}'
    expand_argument_vars: false
  register: package_observation
  changed_when: (package_observation.stdout | default('{}', true) | from_json).changed | default(false) == true

- name: Publish bounded package result after postconditions
  ansible.builtin.set_fact:
    mcp_result: '{{ package_observation.stdout | from_json }}'
