---
- name: Execute fixed bounded sysctl_config_set operation
  ansible.builtin.command:
    argv:
      - '{{ target_python }}'
      - '-I'
      - '-c'
      - |
        import os, sys, json, re, time, selectors, subprocess, signal, stat
        MAX=9007199254740991
        args=[json.loads(x) for x in sys.argv[1:]]
        def read(path, bound=65536):
            with open(path,'rb') as f: data=f.read(bound+1)
            if len(data)>bound: raise ValueError('source exceeds bound')
            return data.decode('utf-8',errors='strict').strip()
        def run(argv, bound=1048576):
            p=subprocess.Popen(argv,stdout=subprocess.PIPE,stderr=subprocess.PIPE,env={'PATH':'/usr/bin:/bin','LC_ALL':'C','SYSTEMD_COLORS':'0'},start_new_session=True)
            streams=selectors.DefaultSelector(); streams.register(p.stdout,selectors.EVENT_READ); streams.register(p.stderr,selectors.EVENT_READ)
            out={p.stdout:bytearray(),p.stderr:bytearray()}; deadline=time.monotonic()+10
            try:
                while streams.get_map():
                    if time.monotonic()>deadline: raise ValueError('subprocess deadline')
                    for key,_ in streams.select(.1):
                        data=os.read(key.fileobj.fileno(),8192)
                        if not data: streams.unregister(key.fileobj); continue
                        out[key.fileobj].extend(data)
                        if sum(map(len,out.values()))>bound: raise ValueError('subprocess output bound')
                rc=p.wait(timeout=1)
                if rc: raise ValueError('fixed utility failed: '+str(rc)+': '+bytes(out[p.stderr])[:512].decode('utf-8','replace'))
                return bytes(out[p.stdout]).decode('utf-8','strict')
            finally:
                streams.close()
                if p.poll() is None: os.killpg(p.pid,signal.SIGKILL)
                p.wait()
        def publish(value):
            encoded=json.dumps(value,separators=(',',':'),allow_nan=False)
            if len(encoded.encode())>4096: raise ValueError('result bound')
            print(encoded)
        
        key,value=args
        if key!='kernel.printk_ratelimit' or type(value) is not int or not 0<=value<=60: raise ValueError('unapproved typed sysctl')
        proc='/proc/sys/kernel/printk_ratelimit'
        def current():
            text=read(proc,64)
            if not re.fullmatch('[0-9]{1,10}',text): raise ValueError('invalid sysctl readback')
            return int(text)
        before=current()
        
        import tempfile
        path='/etc/sysctl.d/90-estus-catalog-printk-ratelimit.conf'
        content=key+' = '+str(value)+'\n'
        directory=os.path.dirname(path)
        if os.path.realpath(directory)!=directory: raise ValueError('aliased config directory')
        try:
            st=os.lstat(path)
            if not stat.S_ISREG(st.st_mode) or st.st_nlink!=1: raise ValueError('unsafe existing config')
        except FileNotFoundError: pass
        fd,temporary=tempfile.mkstemp(prefix='.estus-catalog-',dir=directory)
        try:
            with os.fdopen(fd,'w') as f:
                os.fchmod(f.fileno(),0o644); f.write(content); f.flush(); os.fsync(f.fileno())
            os.replace(temporary,path)
        finally:
            if os.path.exists(temporary): os.unlink(temporary)
        if read(path,1024)!=content.strip(): raise ValueError('persistent readback mismatch')
        # Apply exactly this file. Never --system or an unrelated all-settings reload.
        run(['/usr/bin/sysctl','--load='+path],4096)
        
        after=current()
        if after!=value: raise ValueError('runtime readback mismatch; operation may already have effects')
        publish({'key':key,'before':before,'value':after,'verified':True,'persistent':True,'application':'exact_config_file_sysctl_load','config_path':'/etc/sysctl.d/90-estus-catalog-printk-ratelimit.conf','atomic_compare_exchange':False,'rollback_guaranteed':False})
      - '{{ key | to_json }}'
      - '{{ value | to_json }}'
    expand_argument_vars: false
  register: observation
  changed_when: observation.rc == 0

- name: Publish typed selected result
  ansible.builtin.set_fact:
    mcp_result: '{{ observation.stdout | from_json }}'
