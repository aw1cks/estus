---
- name: Collect bounded reviewed Linux observation
  ansible.builtin.command:
    argv:
      - '{{ target_python }}'
      - -I
      - -c
      - |
        import os, sys, json, re, time, signal, platform, datetime, errno
        signal.signal(signal.SIGALRM, lambda *_: (_ for _ in ()).throw(TimeoutError('observation deadline')))
        signal.alarm(12)
        if platform.system() != 'Linux':
            raise ValueError('Linux required')
        args = json.loads(sys.argv[1])
        MAX = 9007199254740991
        def number(value):
            value = int(value)
            if not 0 <= value <= MAX: raise ValueError('integer outside projection bound')
            return value
        def read(path, bound=65536, directory=None):
            fd = os.open(path, os.O_RDONLY | os.O_CLOEXEC, dir_fd=directory)
            with os.fdopen(fd, 'rb') as stream: data = stream.read(bound + 1)
            if len(data) > bound: raise ValueError('source exceeds read bound')
            return data.decode('utf-8', 'strict')
        def bounded(value, maximum=256):
            if len(value) > maximum: raise ValueError('string exceeds projection bound')
            return value
        def emit(value):
            value['observed_at'] = datetime.datetime.now(datetime.timezone.utc).isoformat(timespec='microseconds')
            data = json.dumps(value, separators=(',', ':'), allow_nan=False)
            if len(data.encode()) > 4096: raise ValueError('output exceeds bound')
            print(data)

        paths=args['configured_paths']
        if not 1<=len(paths)<=32: raise ValueError('too many configured paths')
        for alias,path in paths.items():
            if not re.fullmatch(r'[A-Za-z0-9_-]{1,32}',alias) or not isinstance(path,str) or not path.startswith('/') or len(path)>1024 or '\x00' in path: raise ValueError('invalid configured path')
        path=paths[args['path_id']]
        resolved=bounded(os.path.realpath(path),1024)
        result={'path_id':args['path_id'],'configured_path':path,'resolved_path':resolved}
        try:
            metadata=os.stat(resolved)
            stats=os.statvfs(resolved)
            result.update(status='available',device_id=number(metadata.st_dev),fragment_size_bytes=number(stats.f_frsize),total_bytes=number(stats.f_blocks*stats.f_frsize),free_bytes=number(stats.f_bfree*stats.f_frsize),available_bytes=number(stats.f_bavail*stats.f_frsize),inodes_total=number(stats.f_files),inodes_free=number(stats.f_ffree),inodes_available=number(stats.f_favail))
        except FileNotFoundError: result['status']='missing'
        except PermissionError: result['status']='denied'
        emit(result)

      - "{{ {'path_id': path_id, 'configured_paths': configured_paths} | to_json }}"
    expand_argument_vars: false
  register: observation
  changed_when: false

- name: Publish typed observation only
  ansible.builtin.set_fact:
    mcp_result: '{{ observation.stdout | from_json }}'
