---
argument_specs:
  main:
    short_description: Reviewed virtual runtime FEC setting and driver readback
    options:
      target_python:
        type: path
        required: true
        choices: [/usr/bin/python3]
      operator_policy:
        type: dict
        required: true
        options:
          interface:
            type: str
            required: true
            choices: [fec0]
          mac:
            type: str
            required: true
            choices: ['52:54:00:12:34:59']
          driver:
            type: str
            required: true
            choices: [netdevsim]
          allow_runtime_tuning:
            type: bool
            required: true
          modes:
            type: list
            elements: str
            required: true
            choices: ['off', rs]
      interface:
        type: str
        required: true
        choices: [fec0]
      mode:
        type: str
        required: true
        choices: ['off', rs]
