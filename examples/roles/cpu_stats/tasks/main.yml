---
- name: Observe bounded Linux CPU counters and topology without a shell
  ansible.builtin.command:
    argv:
      - '{{ target_python }}'
      - '-I'
      - '-c'
      - "{{ lookup('ansible.builtin.file', role_path ~ '/files/collector.py', rstrip=False) }}"
      - '{{ limit | default(8) }}'
      - '{{ sample_ms | default(0) }}'
    expand_argument_vars: false
  register: cpu_stats_observation
  changed_when: false

- name: Publish only the typed CPU observation
  ansible.builtin.set_fact:
    mcp_result: '{{ cpu_stats_observation.stdout | from_json }}'
