---
argument_specs:
  main:
    short_description: Read a pre-existing reviewed two-member Linux MD RAID1 array
    options:
      target_python:
        type: path
        required: true
        description: Operator-fixed Python interpreter.
      device:
        type: str
        required: true
        choices: ['/dev/md0']
        description: Reviewed array only; never assembles, repairs or creates it.
