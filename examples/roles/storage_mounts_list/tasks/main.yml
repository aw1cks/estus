---
- name: Gather current mounts with duplicates and finite per-mount timeout
  ansible.builtin.mount_facts:
    sources: ['/proc/mounts']
    mount_binary: null
    include_aggregate_mounts: true
    timeout: 2
    on_timeout: error
  register: selected
- name: Observe selected bounded data without shell
  ansible.builtin.command:
    argv:
      - "{{ target_python }}"
      - "-I"
      - "-c"
      - "{{ lookup('ansible.builtin.file', role_path ~ '/files/collector.py', rstrip=False) }}"
    expand_argument_vars: false
    stdin: "{{ selected.ansible_facts | to_json }}"
  register: observation
  changed_when: false
- name: Publish closed selected observation
  ansible.builtin.set_fact:
    mcp_result: "{{ observation.stdout | from_json }}"
