---
- name: Read the reviewed virtual NVMe controller SMART log only
  ansible.builtin.command:
    argv:
      - '{{ target_python }}'
      - '-I'
      - '-c'
      - |
        import datetime, json, os, selectors, subprocess, sys, time
        if sys.argv[1] != '/dev/nvme0':
            raise ValueError('device outside reviewed controller scope')
        def attribute(name):
            with open('/sys/class/nvme/nvme0/' + name, 'rb') as stream:
                data = stream.read(257)
            if len(data) > 256:
                raise ValueError('controller attribute exceeds bound')
            value = data.decode('ascii').strip()
            if not value or len(value) > 128:
                raise ValueError('invalid controller attribute')
            return value
        model = attribute('model')
        if model != 'QEMU NVMe Ctrl' or attribute('serial') != 'ESTUS-LAB-NVME':
            raise ValueError('controller outside reviewed virtual device scope')
        controller_state = attribute('state')
        # nvme-cli raw SMART is the standard 512-byte log; no JSON numeric precision loss.
        process = subprocess.Popen(['/usr/bin/nvme', 'smart-log', '/dev/nvme0', '--raw-binary'],
                                   stdout=subprocess.PIPE, stderr=subprocess.PIPE,
                                   env={'PATH': '/usr/bin', 'LC_ALL': 'C'}, stdin=subprocess.DEVNULL)
        streams = selectors.DefaultSelector()
        buffers = {'out': bytearray(), 'err': bytearray()}
        deadline = time.monotonic() + 8
        try:
            for stream, label in ((process.stdout, 'out'), (process.stderr, 'err')):
                os.set_blocking(stream.fileno(), False)
                streams.register(stream, selectors.EVENT_READ, label)
            while streams.get_map():
                remaining = deadline - time.monotonic()
                if remaining <= 0:
                    raise ValueError('NVMe SMART request timed out')
                for key, _ in streams.select(remaining):
                    chunk = os.read(key.fileobj.fileno(), 1024)
                    if not chunk:
                        streams.unregister(key.fileobj)
                        continue
                    buffers[key.data].extend(chunk)
                    if len(buffers[key.data]) > (512 if key.data == 'out' else 2048):
                        raise ValueError('NVMe output exceeds bound')
            rc = process.wait(timeout=max(0.001, deadline - time.monotonic()))
            if rc != 0:
                raise ValueError('NVMe SMART request failed with status ' + str(rc))
        finally:
            if process.poll() is None:
                process.kill()
            process.wait()
            streams.close()
            process.stdout.close()
            process.stderr.close()
        def parse_smart_log(data):
            if len(data) != 512:
                raise ValueError('unexpected NVMe SMART log length')
            counter_names = ['data_units_read', 'data_units_written', 'host_read_commands',
                             'host_write_commands', 'controller_busy_minutes', 'power_cycles',
                             'power_on_hours', 'unsafe_shutdowns', 'media_errors', 'error_log_entries']
            counters = {name: str(int.from_bytes(data[32 + 16*i:48 + 16*i], 'little'))
                        for i, name in enumerate(counter_names)}
            result = {'critical_warning': data[0], 'available_spare_percent': data[3],
                      'spare_threshold_percent': data[4], 'percentage_used': data[5],
                      'counters': counters, 'unavailable': []}
            temperature = int.from_bytes(data[1:3], 'little')
            if temperature == 0:
                result['unavailable'].append('temperature_kelvin')
            else:
                result['temperature_kelvin'] = temperature
            return result
        result = parse_smart_log(buffers['out'])
        result.update(device='/dev/nvme0', scope='virtual_reported_controller',
                      source='nvme_smart_log_02', model=model, controller_state=controller_state,
                      observed_at=datetime.datetime.now(datetime.timezone.utc).isoformat())
        # Report device values verbatim. A zero warning is not a physical-media health guarantee.
        print(json.dumps(result, separators=(',', ':'), allow_nan=False))
      - '{{ device }}'
    expand_argument_vars: false
  register: storage_device_health_get_observation
  changed_when: false

- name: Publish only reported virtual controller telemetry
  ansible.builtin.set_fact:
    mcp_result: '{{ storage_device_health_get_observation.stdout | from_json }}'
