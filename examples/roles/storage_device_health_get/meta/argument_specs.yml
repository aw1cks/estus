---
argument_specs:
  main:
    short_description: Read reported SMART log of the reviewed virtual NVMe controller
    options:
      target_python:
        type: path
        required: true
        description: Operator-fixed Python interpreter; target requires installed nvme-cli.
      device:
        type: str
        required: true
        choices: ['/dev/nvme0']
        description: Fixed QEMU controller with reviewed ESTUS-LAB-NVME serial; no physical-media guarantee.
