---
- name: Collect only selected host observation facts
  ansible.builtin.setup:
    gather_subset:
      - '!all'
      - '!min'
      - platform
      - distribution
      - date_time
      - virtual
    gather_timeout: 5
    filter:
      - ansible_system
      - ansible_distribution
      - ansible_distribution_version
      - ansible_kernel
      - ansible_architecture
      - ansible_date_time
      - ansible_virtualization_type
      - ansible_virtualization_role
  register: host_summary_setup

- name: Require Linux before reading procfs
  ansible.builtin.assert:
    that:
      - host_summary_setup.ansible_facts.ansible_system == 'Linux'
    quiet: true

- name: Read bounded Linux process-view observations without a shell
  ansible.builtin.command:
    argv:
      - '{{ target_python }}'
      - '-I'
      - '-c'
      - |
        import decimal
        import json
        import re
        import uuid

        def read_proc(path):
            try:
                with open(path, 'rb', buffering=0) as stream:
                    data = stream.read(128)
                    if len(data) == 128:
                        raise ValueError('proc observation exceeds read bound')
                    return data
            except OSError:
                return None

        boot = read_proc('/proc/sys/kernel/random/boot_id')
        boot_id = None
        if boot is not None:
            text = boot.decode('ascii').strip()
            boot_id = str(uuid.UUID(text))
            if text != boot_id:
                raise ValueError('noncanonical boot identifier')

        uptime = read_proc('/proc/uptime')
        uptime_seconds = None
        if uptime is not None:
            if re.fullmatch(rb'[0-9]+(?:\.[0-9]+)?[ \t]+[0-9]+(?:\.[0-9]+)?\n?', uptime) is None:
                raise ValueError('malformed proc uptime')
            seconds = decimal.Decimal(uptime.split()[0].decode('ascii'))
            if not seconds.is_finite() or seconds < 0 or seconds > 9007199254740991:
                raise ValueError('proc uptime outside supported range')
            uptime_seconds = int(seconds)

        print(json.dumps({'boot_id': boot_id, 'uptime_seconds': uptime_seconds},
                         separators=(',', ':'), allow_nan=False))
    expand_argument_vars: false
  register: host_summary_proc
  changed_when: false

- name: Publish only the typed host observation
  ansible.builtin.set_fact:
    mcp_result: >-
      {{ (host_summary_candidate | dict2items | rejectattr('value', 'none') | items2dict)
         | combine({'unavailable': host_summary_candidate | dict2items
                    | selectattr('value', 'none') | map(attribute='key') | list}) }}
  vars:
    host_summary_candidate:
      system: '{{ host_summary_setup.ansible_facts.ansible_system }}'
      distribution: >-
        {{ none if (host_summary_setup.ansible_facts.ansible_distribution | default('NA', true)) in ['NA', 'unknown', 'Unknown']
           else host_summary_setup.ansible_facts.ansible_distribution }}
      distribution_version: >-
        {{ none if (host_summary_setup.ansible_facts.ansible_distribution_version | default('NA', true)) in ['NA', 'unknown', 'Unknown']
           else host_summary_setup.ansible_facts.ansible_distribution_version }}
      kernel: '{{ host_summary_setup.ansible_facts.ansible_kernel }}'
      architecture: '{{ host_summary_setup.ansible_facts.ansible_architecture }}'
      boot_id: '{{ (host_summary_proc.stdout | from_json).boot_id }}'
      uptime_seconds: '{{ (host_summary_proc.stdout | from_json).uptime_seconds }}'
      observed_at: '{{ host_summary_setup.ansible_facts.ansible_date_time.iso8601 }}'
      scope: ssh_process_view
      virtualization_type: >-
        {{ none if (host_summary_setup.ansible_facts.ansible_virtualization_type | default('NA', true)) == 'NA'
           else host_summary_setup.ansible_facts.ansible_virtualization_type }}
      virtualization_role: >-
        {{ host_summary_setup.ansible_facts.ansible_virtualization_role
           if (host_summary_setup.ansible_facts.ansible_virtualization_role | default('')) in ['guest', 'host']
           else none }}
