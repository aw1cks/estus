---
argument_specs:
  main:
    short_description: Reviewed bounded kernel_modules_list operation
    options:
      target_python:
        type: path
        required: true
        description: Operator-fixed absolute target Python, never caller-selected.
      offset:
        type: int
        required: false
        default: 0
        description: Name-sorted live page offset, bounded from zero to 512.
