---
- name: Execute the fixed bounded reviewed operation without caller shell or flags
  ansible.builtin.command:
    argv:
      - '{{ target_python }}'
      - '-I'
      - '-c'
      - "{{ lookup('ansible.builtin.file', role_path ~ '/files/collector.py', rstrip=False) }}"
      - "{{ {  } | to_json }}"
    expand_argument_vars: false
  register: catalog_observation
  changed_when: false

- name: Publish the typed bounded operation receipt
  ansible.builtin.set_fact:
    mcp_result: '{{ catalog_observation.stdout | from_json }}'
