# Explicit standalone opt-in. Unload one approved installed module through normal modprobe removal, including its configured hooks and unused dependencies. Never remove holders or force; observe loaded-set and taint deltas; no replay or recovery promise.
# Copy roles/kernel_module_unload to /etc/estus/roles/kernel_module_unload; review every file.
# Export this tool's input_schema/fixed_args/input_map to overlay.json, then:
# estus --config kernel_module_unload.toml schema import-role kernel_module_unload --role-path /etc/estus/roles/kernel_module_unload --overlay overlay.json --output /etc/estus/kernel_module_unload.schema.json
# Import is offline; review snapshot before startup activation. No implicit install/escalation.
# Provision /var/lib/estus/runner mode0700 for MCP; install optional pinned Runner runtime.
# Target prerequisites: Linux /usr/bin/python3; boot tools require actual EFI/systemd-boot + bootctl;
# module tools require installed kmod modinfo/modprobe and reviewed dummy/estus_catalog modules.
# estus_catalog is a harmless operator-installed fixture module, value:int mode0644; not auto-installed.
# Exact approved entries are estus-current.conf and estus-alternate.conf; change reviewed schema AND role to deploy elsewhere.
profile = "actions-only"
enabled_tools = ["kernel_module_unload"]

[targets.server]
ssh_host = "server-ordinary"

[automation]
workspace_root = "/var/lib/estus/runner"
max_concurrent = 2
max_scratch_bytes = 16777216
max_scratch_files = 512

[automation.targets.server]
destination = "server-ordinary"
python = "/usr/bin/python3"

# Separate reviewed SSH identity and sudo policy; ordinary observation grants no mutation authority.
[automation.authorities.catalog]
ssh_config_file = "/etc/estus/catalog-ssh.conf"
become = { method = "sudo", user = "root" }

[automation.authorities.catalog.targets.server]
destination = "server-catalog-admin"
python = "/usr/bin/python3"

[tools.kernel_module_unload]
description = "Unload one approved installed module through normal modprobe removal, including its configured hooks and unused dependencies. Never remove holders or force; observe loaded-set and taint deltas; no replay or recovery promise."
revision = "1"
targets = ["server"]
authority = "automation:catalog"
effects = ["read", "runtime_write", "availability"]
execution = { kind = "ansible_role", snapshot = "/etc/estus/kernel_module_unload.schema.json", role_path = "/etc/estus/kernel_module_unload.schema.roles/kernel_module_unload", no_log = false }
fixed_args = { target_python = "/usr/bin/python3" }
input_map = { "name" = "name" }
limits = { timeout_secs = 60 }
input_schema = { "type" = "object", "properties" = { "name" = { "type" = "string", "enum" = ["dummy", "estus_catalog"], "minLength" = 1, "maxLength" = 64 } }, "required" = ["name"], "additionalProperties" = false }
result = { kind = "ansible_projection", fields = { "boot_id" = ["mcp_result", "boot_id"], "source" = ["mcp_result", "source"], "unavailable" = ["mcp_result", "unavailable"], "observed_at" = ["mcp_result", "observed_at"], "name" = ["mcp_result", "name"], "outcome" = ["mcp_result", "outcome"], "command_returncode" = ["mcp_result", "command_returncode"], "postcondition_verified" = ["mcp_result", "postcondition_verified"], "loaded_before" = ["mcp_result", "loaded_before"], "loaded_after" = ["mcp_result", "loaded_after"], "added_modules" = ["mcp_result", "added_modules"], "removed_modules" = ["mcp_result", "removed_modules"], "taint_before" = ["mcp_result", "taint_before"], "taint_after" = ["mcp_result", "taint_after"], "hooks_may_have_executed" = ["mcp_result", "hooks_may_have_executed"], "quiescence_proven" = ["mcp_result", "quiescence_proven"] }, max_bytes = 4096, max_items = 256, max_depth = 8, schema = { "type" = "object", "properties" = { "boot_id" = { "type" = "string", "minLength" = 36, "maxLength" = 36 }, "source" = { "type" = "string", "maxLength" = 128 }, "unavailable" = { "type" = "array", "maxItems" = 32, "items" = { "type" = "string", "maxLength" = 128 } }, "observed_at" = { "type" = "string", "maxLength" = 32 }, "name" = { "type" = "string", "maxLength" = 64 }, "outcome" = { "type" = "string", "maxLength" = 32 }, "command_returncode" = { "type" = "integer", "minimum" = -255, "maximum" = 255 }, "postcondition_verified" = { "type" = "boolean" }, "loaded_before" = { "type" = "boolean" }, "loaded_after" = { "type" = "boolean" }, "added_modules" = { "type" = "array", "maxItems" = 256, "items" = { "type" = "string", "maxLength" = 64 } }, "removed_modules" = { "type" = "array", "maxItems" = 256, "items" = { "type" = "string", "maxLength" = 64 } }, "taint_before" = { "type" = "integer", "minimum" = 0, "maximum" = 9007199254740991 }, "taint_after" = { "type" = "integer", "minimum" = 0, "maximum" = 9007199254740991 }, "hooks_may_have_executed" = { "type" = "boolean" }, "quiescence_proven" = { "type" = "boolean" } }, "required" = ["boot_id", "source", "unavailable", "observed_at", "name", "outcome", "command_returncode", "postcondition_verified", "loaded_before", "loaded_after", "added_modules", "removed_modules", "taint_before", "taint_after", "hooks_may_have_executed", "quiescence_proven"], "additionalProperties" = false } }
