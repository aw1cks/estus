# Explicit local opt-in: this capability runs as the server's controller OS account.
# Deploy observe_controller.py separately at the reviewed path below, and create
# /tmp/estus-controller as an owned directory with mode 0700 before enabling.
# Declare your site's absolute Python 3 interpreter; the server installs nothing.
# The source snapshot is verified at startup. Review source/digest and restart to update.
mode = "headless"
capabilities = { named = true }
enabled_tools = ["observe_controller"]

[controller]
workspace_root = "/tmp/estus-controller"

[tools.observe_controller]
description = "Observe controller identity and private scratch-filesystem capacity. This runs locally, never on an SSH target. Inputs use a private JSON file. Controller-account code is trusted, not sandboxed; interruption cannot roll back earlier effects."
revision = "1"
authority = "controller"
effects = ["read"]
input_schema = { type = "object", additionalProperties = false, required = ["label"], properties = { label = { type = "string", maxLength = 64 } } }
result = { kind = "controller_command" }
limits = { timeout_secs = 10, max_output_bytes = 2048 }

[tools.observe_controller.execution]
kind = "controller_script"
environment = { PATH = "/usr/bin:/bin", LANG = "C", LC_ALL = "C", TZ = "UTC" }

[tools.observe_controller.execution.source]
path = "/opt/estus/observe_controller.py"
content_sha256 = "6da5265a4772486f8939864ea49884398fc26734cf4e5f08b8c4d9ac889caf8a"
max_bytes = 4096

[tools.observe_controller.execution.interpreter]
program = "/usr/bin/python3"
argv = ["-I", "-B"]
