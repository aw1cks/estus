# Reviewed disposable Linux system-manager state inspection, ordinary identity.
# Restate allowed_units in the site's [tools.observe_systemd_unit] table; the
# shipped allowlist is a fixture policy, never inherited.
# Inactive/failed are state data; active does not prove application health.
# MCP: observe_systemd_unit {"host":"plain","inputs":{"unit":"estus-fixture.service"}}
tool = "observe_systemd_unit"
authority = "automation"
allowed_units = ["estus-fixture.service", "estus-fixture-idle.service", "estus-fixture-fail.service"]
#
# enabled_tools = ["observe_systemd_unit"]
# [tools.observe_systemd_unit]
# targets = ["plain"]
# constraints = { allowed_units = ["estus-fixture.service", "estus-fixture-idle.service", "estus-fixture-fail.service"] }
