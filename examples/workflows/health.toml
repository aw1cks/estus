# Reviewed Linux SSH-process-view observation; NOT an application health assertion.
# Enable only this canonical tool in a provisioned site (plain destination, no
# controller workspace needed); no approval file is produced or shipped.
# MCP: observe_host_summary {"host":"plain","inputs":{}}
tool = "observe_host_summary"
authority = "automation"
#
# [selection] allow = ["observe_host_summary"] in provisioned-site.toml; no input or
# fixed policy changes are needed. To read the collector first:
# estus catalog export --tool observe_host_summary --output health-export
# Review health-export/payloads/observe_host_summary/{collector.py,manifest.json}.
# estus --config provisioned-site.toml
