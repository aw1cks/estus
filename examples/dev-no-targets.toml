# Workstation mode with an empty [targets] table, for running the development
# server by hand with a config file:
#   nix run --no-write-lock-file . -- --config /absolute/path/to/dev-no-targets.toml
# An empty [targets] table authorizes no destination, so every remote tool call
# (catalog, file and exec/sudo) is rejected. Without that table, workstation mode
# lets the caller name any SSH destination.
# max_timeout_secs must be at least 60: the workstation catalog tools declare
# timeouts above 30 seconds, and the config fails to load below that.
mode = "workstation"
capabilities = { named = true, file_read = true, file_write = true, exec = true, sudo = true }
[targets]

[limits]
connect_timeout_secs = 3
operation_timeout_secs = 5
max_timeout_secs = 60
