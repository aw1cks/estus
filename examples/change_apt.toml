# Debian/Ubuntu escape hatch: apt-specific options from the offline bundle.
# Use when change_package cannot express the reviewed options (purge,
# allow_downgrade, update_cache). Requires ansible.builtin.apt in the bundle.
#   estus bundle build --python /opt/ansible/bin/python --output /etc/estus/bundle \
#     --module ansible.builtin.apt
# A preview_apt authorization binds this exact module and the options supplied;
# it never authorizes change_package or change_dnf, and must match the change call.
# Interrupted operations are never replayed.
# MCP: change_apt {"host":"server","inputs":{"name":["tmux"],"state":"absent","purge":true}}
mode = "headless"
capabilities = { named = true }
[selection]
allow = ["change_apt"]

[targets.server]
ssh_host = "server-ordinary"

[automation]
bundle = "/etc/estus/bundle"

[automation.targets.server]
destination = "server-ordinary"
python = "/usr/bin/python3"

[tools.change_apt]
description = "Apply Debian/Ubuntu apt package transitions with apt-specific options (purge, allow_downgrade, update_cache); interrupted operations are never replayed."
revision = "1"
targets = ["server"]
authority = "automation"
effects = ["persistent_write", "read"]
execution = { kind = "ansible_module", module = "ansible.builtin.apt", no_log = false, check_mode = false, diff = false }
fixed_args = {}
input_map = { name = "name", state = "state", update_cache = "update_cache", purge = "purge", allow_downgrade = "allow_downgrade" }
limits = { timeout_secs = 120 }
input_schema = { type = "object", properties = { name = { type = "array", items = { type = "string", minLength = 1, maxLength = 128 }, minItems = 1, maxItems = 32 }, state = { type = "string", enum = ["present", "absent", "latest"] }, update_cache = { type = "boolean" }, purge = { type = "boolean" }, allow_downgrade = { type = "boolean" } }, required = ["name", "state"], additionalProperties = false }

[tools.change_apt.result]
kind = "ansible_projection"
fields = { changed = ["changed"] }
max_bytes = 4096
max_items = 64
max_depth = 4
schema = { type = "object", properties = { changed = { type = "boolean" } }, required = ["changed"], additionalProperties = false }
