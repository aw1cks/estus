# Opt-in apt-only procedure. Preprovision apt, dpkg, python-apt and signed sources; never bootstrap dependencies.
# Copy roles/package_repository_refresh to /etc/estus/roles/package_repository_refresh, review tasks and operator-fixed allowlists.
# Export input_schema/fixed_args/input_map as overlay.json, then import offline:
# estus --config package_repository_refresh.toml schema import-role package_repository_refresh --role-path /etc/estus/roles/package_repository_refresh --overlay overlay.json --output /etc/estus/package_repository_refresh.schema.json
# Review snapshot before activation; /var/lib/estus/runner must be mode 0700 owned by MCP.
# Mutations require separately configured automation:catalog identity with root become; no retry after uncertainty.
# Package commands may run maintainer scripts. No rollback, transactional snapshot or quiescence is promised.
profile = "actions-only"
enabled_tools = ["package_repository_refresh"]
[targets.server]
ssh_host = "server-ordinary"
[automation]
workspace_root = "/var/lib/estus/runner"
max_concurrent = 2
max_scratch_bytes = 16777216
max_scratch_files = 512
[automation.targets.server]
destination = "server-ordinary"
python = "/usr/bin/python3"
[tools.package_repository_refresh]
description = "Explicit authenticated apt cache refresh; zero retries and bounded execution."
revision = "1"
targets = ["server"]
authority = "automation:catalog"
effects = ["persistent_write", "read"]
execution = { kind = "ansible_role", snapshot = "/etc/estus/package_repository_refresh.schema.json", role_path = "/etc/estus/roles/package_repository_refresh", no_log = false }
fixed_args = { "target_python" = "/usr/bin/python3" }
input_map = {  }
limits = { timeout_secs = 60 }
input_schema = { "type" = "object", "additionalProperties" = false, "required" = [], "properties" = {  } }
[tools.package_repository_refresh.result]
kind = "ansible_projection"
fields = { "backend" = ["mcp_result", "backend"], "refreshed" = ["mcp_result", "refreshed"], "cache" = ["mcp_result", "cache"], "package_count" = ["mcp_result", "package_count"] }
max_bytes = 4096
max_items = 256
max_depth = 6
schema = { "type" = "object", "additionalProperties" = false, "required" = ["backend", "refreshed", "cache", "package_count"], "properties" = { "backend" = { "type" = "string", "const" = "apt", "maxLength" = 64 }, "refreshed" = { "type" = "boolean", "const" = true }, "cache" = { "type" = "object", "additionalProperties" = false, "required" = ["state"], "properties" = { "state" = { "type" = "string", "maxLength" = 7, "enum" = ["fresh", "stale", "unknown"] }, "age_seconds" = { "type" = "integer", "minimum" = 0, "maximum" = 9007199254740991 } }, "if" = { "properties" = { "state" = { "type" = "string", "maxLength" = 7, "const" = "unknown" } }, "required" = ["state"] }, "then" = { "not" = { "required" = ["age_seconds"] } }, "else" = { "required" = ["age_seconds"] } }, "package_count" = { "type" = "integer", "minimum" = 0, "maximum" = 100000 } } }
