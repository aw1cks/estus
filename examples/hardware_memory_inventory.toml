# Opt-in: copy roles/hardware_memory_inventory to /etc/estus/roles/hardware_memory_inventory; export input_schema,
# fixed_args and input_map as overlay.json. Review the offline imported snapshot:
# estus --config hardware_memory_inventory.toml schema import-role hardware_memory_inventory --role-path /etc/estus/roles/hardware_memory_inventory --overlay overlay.json --output /etc/estus/hardware_memory_inventory.schema.json
# Provision mode0700 /var/lib/estus/runner, Python3 and declared inspection utilities.
# Selected per-DIMM/populated slot SMBIOS inventory with explicit firmware provenance and unknowns; identifiers/serials omitted, no capacity/occupancy inference from missing data. Requires dmidecode and approved firmware access.
profile = "actions-only"
enabled_tools = ["hardware_memory_inventory"]
[targets.server]
ssh_host = "server-ordinary"
[automation]
workspace_root = "/var/lib/estus/runner"
max_concurrent = 2
max_scratch_bytes = 16777216
max_scratch_files = 512
[automation.targets.server]
destination = "server-ordinary"
python = "/usr/bin/python3"
[tools.hardware_memory_inventory]
description = "Selected per-DIMM/populated slot SMBIOS inventory with explicit firmware provenance and unknowns; identifiers/serials omitted, no capacity/occupancy inference from missing data. Requires dmidecode and approved firmware access."
revision = "1"
targets = ["server"]
authority = "automation:catalog"
effects = ["read"]
execution = { kind = "ansible_role", snapshot = "/etc/estus/hardware_memory_inventory.schema.json", role_path = "/etc/estus/hardware_memory_inventory.schema.roles/hardware_memory_inventory", no_log = false }
fixed_args = { target_python = "/usr/bin/python3" }
input_map = {  }
limits = { timeout_secs = 30 }
input_schema = { "type" = "object", "properties" = {  }, "required" = [], "additionalProperties" = false }
[tools.hardware_memory_inventory.result]
kind = "ansible_projection"
fields = { "source" = ["mcp_result", "source"], "observed_at" = ["mcp_result", "observed_at"], "unavailable" = ["mcp_result", "unavailable"], "records" = ["mcp_result", "records"] , truncated = ["mcp_result", "truncated"], omitted_records = ["mcp_result", "omitted_records"] }
max_bytes = 4096
max_items = 256
max_depth = 8
schema = { "type" = "object", "properties" = { truncated = { type = "boolean" }, omitted_records = { type = "integer", minimum = 0, maximum = 9007199254740991 }, "source" = { "type" = "string", "maxLength" = 256 }, "observed_at" = { "type" = "string", "maxLength" = 64 }, "unavailable" = { "type" = "array", "items" = { "type" = "string", "maxLength" = 128 }, "maxItems" = 256 }, "records" = { "type" = "array", "items" = { "type" = "object", "properties" = { "handle" = { "type" = "string", "maxLength" = 6 }, "array_handle" = { "type" = "string", "maxLength" = 4096 }, "total_width" = { "type" = "string", "maxLength" = 4096 }, "data_width" = { "type" = "string", "maxLength" = 4096 }, "size" = { "type" = "string", "maxLength" = 4096 }, "form_factor" = { "type" = "string", "maxLength" = 4096 }, "set" = { "type" = "string", "maxLength" = 4096 }, "locator" = { "type" = "string", "maxLength" = 4096 }, "bank_locator" = { "type" = "string", "maxLength" = 4096 }, "type" = { "type" = "string", "maxLength" = 4096 }, "type_detail" = { "type" = "string", "maxLength" = 4096 }, "speed" = { "type" = "string", "maxLength" = 4096 }, "manufacturer" = { "type" = "string", "maxLength" = 4096 }, "configured_speed" = { "type" = "string", "maxLength" = 4096 }, "configured_voltage" = { "type" = "string", "maxLength" = 4096 }, "populated" = { "type" = "boolean" } }, "required" = ["handle"], "additionalProperties" = false }, "maxItems" = 256 } }, "required" = ["source", "observed_at", "unavailable", "records"], "additionalProperties" = false }
