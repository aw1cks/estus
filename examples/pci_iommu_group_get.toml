# Operator-fixed full PCI address is the reviewed observation scope; change it
# and reimport the overlay for the actual approved device before activation.
# Opt-in: copy roles/pci_iommu_group_get to /etc/estus/roles/pci_iommu_group_get; export input_schema,
# fixed_args and input_map as overlay.json. Review the offline imported snapshot:
# estus --config pci_iommu_group_get.toml schema import-role pci_iommu_group_get --role-path /etc/estus/roles/pci_iommu_group_get --overlay overlay.json --output /etc/estus/pci_iommu_group_get.schema.json
# Provision mode0700 /var/lib/estus/runner, Python3 and declared inspection utilities.
# Numeric full-address PCI observation; bounded sysfs only, no exhaustive configuration-space access or external name lookup. Unknown fields explicit.
profile = "actions-only"
enabled_tools = ["pci_iommu_group_get"]
[targets.server]
ssh_host = "server-ordinary"
[automation]
workspace_root = "/var/lib/estus/runner"
max_concurrent = 2
max_scratch_bytes = 16777216
max_scratch_files = 512
[automation.targets.server]
destination = "server-ordinary"
python = "/usr/bin/python3"
[tools.pci_iommu_group_get]
description = "Numeric full-address PCI observation; bounded sysfs only, no exhaustive configuration-space access or external name lookup. Unknown fields explicit."
revision = "1"
targets = ["server"]
authority = "automation"
effects = ["read"]
execution = { kind = "ansible_role", snapshot = "/etc/estus/pci_iommu_group_get.schema.json", role_path = "/etc/estus/pci_iommu_group_get.schema.roles/pci_iommu_group_get", no_log = false }
fixed_args = { target_python = "/usr/bin/python3", address = "0000:00:00.0" }
input_map = {}
limits = { timeout_secs = 30 }
input_schema = { type = "object", properties = {}, required = [], additionalProperties = false }
[tools.pci_iommu_group_get.result]
kind = "ansible_projection"
fields = { "source" = ["mcp_result", "source"], "observed_at" = ["mcp_result", "observed_at"], "unavailable" = ["mcp_result", "unavailable"], "iommu" = ["mcp_result", "iommu"] , truncated = ["mcp_result", "truncated"], omitted_records = ["mcp_result", "omitted_records"] }
max_bytes = 4096
max_items = 256
max_depth = 8
schema = { "type" = "object", "properties" = { truncated = { type = "boolean" }, omitted_records = { type = "integer", minimum = 0, maximum = 9007199254740991 }, "source" = { "type" = "string", "maxLength" = 256 }, "observed_at" = { "type" = "string", "maxLength" = 64 }, "unavailable" = { "type" = "array", "items" = { "type" = "string", "maxLength" = 128 }, "maxItems" = 256 }, "iommu" = { "type" = "object", "properties" = { "address" = { "type" = "string", "maxLength" = 12 }, "available" = { "type" = "boolean" }, "group" = { "type" = "integer", "minimum" = 0, "maximum" = 9007199254740991 }, "members" = { "type" = "array", "items" = { "type" = "string", "maxLength" = 12 }, "maxItems" = 256 } }, "required" = ["address", "available"], "additionalProperties" = false } }, "required" = ["source", "observed_at", "unavailable", "iommu"], "additionalProperties" = false }
