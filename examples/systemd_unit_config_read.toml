# Opt-in Linux systemd binding; review fixed manager scope and unit allowlist.
# Copy roles/systemd_unit_config_read to /etc/estus/roles/systemd_unit_config_read; export this tool's
# input_schema/fixed_args/input_map as overlay.json, then import offline:
# estus --config systemd_unit_config_read.toml schema import-role systemd_unit_config_read --role-path /etc/estus/roles/systemd_unit_config_read --overlay overlay.json --output /etc/estus/systemd_unit_config_read.schema.json
# Review snapshot before activation; provision workspace 0700, target Python/systemctl.
# Unit policy changes require reviewing BOTH schema enum and fixed allowed_units.
# User scope needs the executing account's running user manager and runtime environment.
# Named catalog authority uses a separate reviewed SSH identity and sudo root.
# Independent sensitive-content approval REQUIRED; returns selected credential-bearing contents.
profile = "actions-only"
enabled_tools = ["systemd_unit_config_read"]
[targets.server]
ssh_host = "server-ordinary"
[automation]
workspace_root = "/var/lib/estus/runner"
max_concurrent = 2
max_scratch_bytes = 16777216
max_scratch_files = 512
[automation.targets.server]
destination = "server-ordinary"
python = "/usr/bin/python3"
[automation.authorities.catalog]
ssh_config_file = "/etc/estus/catalog-ssh.conf"
[automation.authorities.catalog.become]
method = "sudo"
user = "root"
[automation.authorities.catalog.targets.server]
destination = "server-catalog"
python = "/usr/bin/python3"
[tools.systemd_unit_config_read]
description = "Separately approved sensitive fragment and drop-in content; may contain credentials. No ordinary status environment disclosure."
revision = "1"
targets = ["server"]
authority = "automation:catalog"
effects = ["read"]
execution = { kind = "ansible_role", snapshot = "/etc/estus/systemd_unit_config_read.schema.json", role_path = "/etc/estus/systemd_unit_config_read.schema.roles/systemd_unit_config_read", no_log = false }
fixed_args = { "target_python" = "/usr/bin/python3", "manager_scope" = "system", "allowed_units" = ["estus-fixture.service", "estus-fixture-idle.service", "estus-fixture-fail.service", "estus-fixture.timer", "estus-fixture.socket", "estus-fixture-signal.service", "estus-fixture-block.service", "estus-fixture-manager.service", "estus-fixture@.service"] }
input_map = { "unit" = "unit" }
limits = { timeout_secs = 60 }
input_schema = { "type" = "object", "properties" = { "unit" = { "type" = "string", "enum" = ["estus-fixture.service", "estus-fixture-idle.service", "estus-fixture-fail.service", "estus-fixture.timer", "estus-fixture.socket", "estus-fixture-signal.service", "estus-fixture-block.service", "estus-fixture-manager.service", "estus-fixture@.service"], "maxLength" = 128 } }, "required" = ["unit"], "additionalProperties" = false }
[tools.systemd_unit_config_read.result]
kind = "ansible_projection"
fields = { "scope" = ["mcp_result", "scope"], "unit" = ["mcp_result", "unit"], "sensitive" = ["mcp_result", "sensitive"], "files" = ["mcp_result", "files"] }
max_bytes = 4096
max_items = 256
max_depth = 6
schema = { "type" = "object", "properties" = { "scope" = { "type" = "string", "enum" = ["system", "user"], "maxLength" = 6 }, "unit" = { "type" = "string", "maxLength" = 128 }, "sensitive" = { "type" = "boolean", "const" = true }, "files" = { "type" = "array", "items" = { "type" = "object", "properties" = { "kind" = { "type" = "string", "enum" = ["fragment", "drop_in"], "maxLength" = 8 }, "path" = { "type" = "string", "maxLength" = 1024 }, "content" = { "type" = "string", "maxLength" = 2048 } }, "required" = ["kind", "path", "content"], "additionalProperties" = false }, "maxItems" = 17 } }, "required" = ["scope", "unit", "sensitive", "files"], "additionalProperties" = false }
