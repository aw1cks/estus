# Explicit startup prerequisite for the offline module bundle. Build and verify the
# bundle once, outside the server lifecycle, then require it at startup:
#   estus bundle build --python /opt/ansible/bin/python \
#     --collections-path /opt/collections --output /etc/estus/bundle
#   estus bundle inspect --bundle /etc/estus/bundle
#   estus --config examples/automation_runtime.toml doctor --runtime ansible
#   estus --config examples/automation_runtime.toml
# [automation].bundle takes precedence over ESTUS_ANSIBLE_BUNDLE.
# required = true makes a missing or broken bundle a startup failure, even though
# no tool is selected here. It does not publish or execute any tool.
mode = "headless"
capabilities = { named = true }
[selection]
allow = []

[automation]
required = true
bundle = "/etc/estus/bundle"
