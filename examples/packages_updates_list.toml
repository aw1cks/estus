# Opt-in apt-only procedure. Preprovision apt, dpkg, python-apt and signed sources; never bootstrap dependencies.
# Copy roles/packages_updates_list to /etc/estus/roles/packages_updates_list, review tasks and operator-fixed allowlists.
# Export input_schema/fixed_args/input_map as overlay.json, then import offline:
# estus --config packages_updates_list.toml schema import-role packages_updates_list --role-path /etc/estus/roles/packages_updates_list --overlay overlay.json --output /etc/estus/packages_updates_list.schema.json
# Review snapshot before activation; /var/lib/estus/runner must be mode 0700 owned by MCP.
# Mutations require separately configured automation:catalog identity with root become; no retry after uncertainty.
# Package commands may run maintainer scripts. No rollback, transactional snapshot or quiescence is promised.
profile = "actions-only"
enabled_tools = ["packages_updates_list"]
[targets.server]
ssh_host = "server-ordinary"
[automation]
workspace_root = "/var/lib/estus/runner"
max_concurrent = 2
max_scratch_bytes = 16777216
max_scratch_files = 512
[automation.targets.server]
destination = "server-ordinary"
python = "/usr/bin/python3"
[tools.packages_updates_list]
description = "Reviewed package updates from existing apt cache, explicit cache age; never refreshes."
revision = "1"
targets = ["server"]
authority = "automation"
effects = ["read"]
execution = { kind = "ansible_role", snapshot = "/etc/estus/packages_updates_list.schema.json", role_path = "/etc/estus/packages_updates_list.schema.roles/packages_updates_list", no_log = false }
fixed_args = { "target_python" = "/usr/bin/python3", "approved_packages" = ["estus-catalog-base", "estus-catalog-demo"] }
input_map = {  }
limits = { timeout_secs = 30 }
input_schema = { "type" = "object", "additionalProperties" = false, "required" = [], "properties" = {  } }
[tools.packages_updates_list.result]
kind = "ansible_projection"
fields = { "backend" = ["mcp_result", "backend"], "updates" = ["mcp_result", "updates"], "cache" = ["mcp_result", "cache"], "refreshed" = ["mcp_result", "refreshed"] }
max_bytes = 4096
max_items = 256
max_depth = 6
schema = { "type" = "object", "additionalProperties" = false, "required" = ["backend", "updates", "cache", "refreshed"], "properties" = { "backend" = { "type" = "string", "const" = "apt", "maxLength" = 64 }, "updates" = { "type" = "array", "maxItems" = 16, "items" = { "type" = "object", "additionalProperties" = false, "required" = ["package", "installed", "candidate", "held"], "properties" = { "package" = { "type" = "string", "maxLength" = 64 }, "installed" = { "type" = "string", "maxLength" = 96 }, "candidate" = { "type" = "string", "maxLength" = 96 }, "held" = { "type" = "boolean" } } } }, "cache" = { "type" = "object", "additionalProperties" = false, "required" = ["state"], "properties" = { "state" = { "type" = "string", "maxLength" = 7, "enum" = ["fresh", "stale", "unknown"] }, "age_seconds" = { "type" = "integer", "minimum" = 0, "maximum" = 9007199254740991 } }, "if" = { "properties" = { "state" = { "type" = "string", "maxLength" = 7, "const" = "unknown" } }, "required" = ["state"] }, "then" = { "not" = { "required" = ["age_seconds"] } }, "else" = { "required" = ["age_seconds"] } }, "refreshed" = { "type" = "boolean", "const" = false } } }
