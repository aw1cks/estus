# Explicit opt-in. Runs a reviewed fixed native_argv observation command with
# one literal label argument. No source upload or remote script fetch occurs.
profile = "actions-only"
enabled_tools = ["observe_system"]

[targets.server]
ssh_host = "server-ordinary"

[tools.observe_system]
description = "Observe the ordinary remote system and UID with a fixed command and one literal label."
revision = "1"
targets = ["server"]
authority = "ordinary"
effects = ["read"]
input_schema = { type = "object", additionalProperties = false, required = ["label"], properties = { label = { type = "string", maxLength = 64 } } }
result = { kind = "command" }
limits = { timeout_secs = 10, max_output_bytes = 1024 }

[tools.observe_system.execution]
kind = "native_argv"
program = "/bin/sh"
argv = [
    "-c",
    "set -eu\nprintf 'label=%s\\n' \"$1\"\ncommand uname -s\ncommand id -u\n",
    "--",
    { input = "label" },
]
