# Reviewed cross-distro package transition from the offline bundle.
# The bundle routes change_package to the manager detected on the target.
# Build the bundle with the package backends your fleet needs and inspect it first:
#   estus bundle build --python /opt/ansible/bin/python \
#     --collections-path /opt/collections --output /etc/estus/bundle \
#     --module ansible.builtin.package --module ansible.builtin.apt \
#     --module ansible.builtin.dnf --module ansible.builtin.dnf5 \
#     --module community.general.apk --module community.general.zypper \
#     --module community.general.pacman
#   estus bundle inspect --bundle /etc/estus/bundle
# A version pin requires state="present" and exactly one package name.
# Interrupted operations are never replayed; inspect independently before retrying.
# MCP: change_package {"host":"server","inputs":{"name":["tmux"],"state":"present"}}
mode = "headless"
capabilities = { named = true }
enabled_tools = ["change_package"]

[targets.server]
ssh_host = "server-ordinary"

[automation]
bundle = "/etc/estus/bundle"

[automation.targets.server]
destination = "server-ordinary"
python = "/usr/bin/python3"

[tools.change_package]
description = "Apply generic OS package install, upgrade or removal via the target-detected package manager (apt, dnf, dnf5, apk, zypper, pacman); interrupted operations are never replayed."
revision = "1"
targets = ["server"]
authority = "automation"
effects = ["persistent_write", "read"]
execution = { kind = "ansible_module", module = "ansible.builtin.package", no_log = false, check_mode = false, diff = false }
fixed_args = { update_cache = false }
input_map = { name = "name", version = "version", state = "state" }
limits = { timeout_secs = 120 }
input_schema = { type = "object", properties = { name = { type = "array", items = { type = "string", minLength = 1, maxLength = 128 }, minItems = 1, maxItems = 32 }, version = { type = "string", minLength = 1, maxLength = 96 }, state = { type = "string", enum = ["present", "absent", "latest"] } }, required = ["name", "state"], additionalProperties = false }

[tools.change_package.result]
kind = "ansible_projection"
fields = { changed = ["changed"] }
max_bytes = 4096
max_items = 64
max_depth = 4
schema = { type = "object", properties = { changed = { type = "boolean" } }, required = ["changed"], additionalProperties = false }
