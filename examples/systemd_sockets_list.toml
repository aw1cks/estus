# Opt-in Linux systemd binding; review fixed manager scope and unit allowlist.
# Copy roles/systemd_sockets_list to /etc/estus/roles/systemd_sockets_list; export this tool's
# input_schema/fixed_args/input_map as overlay.json, then import offline:
# estus --config systemd_sockets_list.toml schema import-role systemd_sockets_list --role-path /etc/estus/roles/systemd_sockets_list --overlay overlay.json --output /etc/estus/systemd_sockets_list.schema.json
# Review snapshot before activation; provision workspace 0700, target Python/systemctl.
# Unit policy changes require reviewing BOTH schema enum and fixed allowed_units.
# User scope needs the executing account's running user manager and runtime environment.
profile = "actions-only"
enabled_tools = ["systemd_sockets_list"]
[targets.server]
ssh_host = "server-ordinary"
[automation]
workspace_root = "/var/lib/estus/runner"
max_concurrent = 2
max_scratch_bytes = 16777216
max_scratch_files = 512
[automation.targets.server]
destination = "server-ordinary"
python = "/usr/bin/python3"
[tools.systemd_sockets_list]
description = "Bounded actual Listen endpoints, activation relationships and socket counters; no process attribution."
revision = "1"
targets = ["server"]
authority = "automation"
effects = ["read"]
execution = { kind = "ansible_role", snapshot = "/etc/estus/systemd_sockets_list.schema.json", role_path = "/etc/estus/systemd_sockets_list.schema.roles/systemd_sockets_list", no_log = false }
fixed_args = { "target_python" = "/usr/bin/python3", "manager_scope" = "system" }
input_map = {  }
limits = { timeout_secs = 60 }
input_schema = { "type" = "object", "properties" = {  }, "required" = [], "additionalProperties" = false }
[tools.systemd_sockets_list.result]
kind = "ansible_projection"
fields = { "scope" = ["mcp_result", "scope"], "sockets" = ["mcp_result", "sockets"], "truncated" = ["mcp_result", "truncated"], "source_count" = ["mcp_result", "source_count"] }
max_bytes = 4096
max_items = 256
max_depth = 6
schema = { "type" = "object", "properties" = { "scope" = { "type" = "string", "enum" = ["system", "user"], "maxLength" = 6 }, "sockets" = { "type" = "array", "items" = { "type" = "object", "properties" = { "Id" = { "type" = "string", "maxLength" = 4096 }, "ActiveState" = { "type" = "string", "maxLength" = 4096 }, "Triggers" = { "type" = "string", "maxLength" = 4096 }, "Listen" = { "type" = "string", "maxLength" = 4096 }, "Accept" = { "type" = "string", "maxLength" = 4096 }, "NConnections" = { "type" = "string", "maxLength" = 4096 }, "NAccepted" = { "type" = "string", "maxLength" = 4096 } }, "required" = [], "additionalProperties" = false }, "maxItems" = 8 }, "truncated" = { "type" = "boolean" }, "source_count" = { "type" = "integer", "minimum" = 0, "maximum" = 256 } }, "required" = ["scope", "sockets", "truncated", "source_count"], "additionalProperties" = false }
