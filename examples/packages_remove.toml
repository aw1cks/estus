# Opt-in apt-only procedure. Preprovision apt, dpkg, python-apt and signed sources; never bootstrap dependencies.
# Copy roles/packages_remove to /etc/estus/roles/packages_remove, review tasks and operator-fixed allowlists.
# Export input_schema/fixed_args/input_map as overlay.json, then import offline:
# estus --config packages_remove.toml schema import-role packages_remove --role-path /etc/estus/roles/packages_remove --overlay overlay.json --output /etc/estus/packages_remove.schema.json
# Review snapshot before activation; /var/lib/estus/runner must be mode 0700 owned by MCP.
# Mutations require separately configured automation:catalog identity with root become; no retry after uncertainty.
# Package commands may run maintainer scripts. No rollback, transactional snapshot or quiescence is promised.
profile = "actions-only"
enabled_tools = ["packages_remove"]
[targets.server]
ssh_host = "server-ordinary"
[automation]
workspace_root = "/var/lib/estus/runner"
max_concurrent = 2
max_scratch_bytes = 16777216
max_scratch_files = 512
[automation.targets.server]
destination = "server-ordinary"
python = "/usr/bin/python3"
[tools.packages_remove]
description = "Single-package remove with exact version, hold checks, closed dependency plan and independent postcondition; interrupted execution is never replayed."
revision = "1"
targets = ["server"]
authority = "automation:catalog"
effects = ["persistent_write", "read"]
execution = { kind = "ansible_role", snapshot = "/etc/estus/packages_remove.schema.json", role_path = "/etc/estus/roles/packages_remove", no_log = false }
fixed_args = { "target_python" = "/usr/bin/python3", "approved_packages" = ["estus-catalog-base", "estus-catalog-demo"] }
input_map = { "package" = "package" }
limits = { timeout_secs = 60 }
input_schema = { "type" = "object", "additionalProperties" = false, "required" = ["package"], "properties" = { "package" = { "type" = "string", "enum" = ["estus-catalog-base", "estus-catalog-demo"] } } }
[tools.packages_remove.result]
kind = "ansible_projection"
fields = { "package" = ["mcp_result", "package"], "before" = ["mcp_result", "before"], "after" = ["mcp_result", "after"], "verified" = ["mcp_result", "verified"], "changed" = ["mcp_result", "changed"] }
max_bytes = 4096
max_items = 256
max_depth = 6
schema = { "type" = "object", "additionalProperties" = false, "required" = ["package", "before", "after", "verified", "changed"], "properties" = { "package" = { "type" = "string", "maxLength" = 64 }, "before" = { "type" = "object", "additionalProperties" = false, "required" = ["installed"], "properties" = { "installed" = { "type" = "boolean" }, "version" = { "type" = "string", "maxLength" = 96 } }, "if" = { "properties" = { "installed" = { "type" = "boolean", "const" = true } }, "required" = ["installed"] }, "then" = { "required" = ["version"] }, "else" = { "not" = { "required" = ["version"] } } }, "after" = { "type" = "object", "additionalProperties" = false, "required" = ["installed"], "properties" = { "installed" = { "type" = "boolean" }, "version" = { "type" = "string", "maxLength" = 96 } }, "if" = { "properties" = { "installed" = { "type" = "boolean", "const" = true } }, "required" = ["installed"] }, "then" = { "required" = ["version"] }, "else" = { "not" = { "required" = ["version"] } } }, "verified" = { "type" = "boolean", "const" = true }, "changed" = { "type" = "boolean" } } }
