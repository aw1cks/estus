# Ordinary persistent configuration, not privilege, deployment, or service restart.
# Copy roles/app_config to /etc/estus/roles/app_config and review every task.
# Export this tool's input_schema/fixed_args/input_map as overlay.json, then run:
# estus --config app_config.toml schema import-role app_config --role-path /etc/estus/roles/app_config --overlay overlay.json --output /etc/estus/app_config.schema.json
# Import is offline and never runs tasks. Enable only after reviewing the snapshot.
# V2 import copies the entire source parent once to app_config.schema.roles.
# Review that bundle and its siblings; execution.role_path below uses only the approved copy.
# Provision /var/lib/estus/runner mode 0700 owned by the MCP account.
# The SSH account must own /srv/example-app; no become or service operation occurs.
# MCP: {"host":"server","inputs":{"instance":"frontend","config":{"banner":"Hello 雪","enabled":true,"port":8080}}}
profile = "actions-only"
enabled_tools = ["app_config"]

[targets.server]
ssh_host = "server-ordinary"

[automation]
workspace_root = "/var/lib/estus/runner"
max_concurrent = 2
max_scratch_bytes = 16777216
max_scratch_files = 512

[automation.targets.server]
destination = "server-ordinary"
python = "/usr/bin/python3"

[tools.app_config]
description = "Converge one fixed ordinary application JSON file, read it back, and return a verified SHA-256 receipt. Does not restart an application. Interrupted work is never replayed."
revision = "1"
targets = ["server"]
authority = "automation"
effects = ["persistent_write", "read"]
execution = { kind = "ansible_role", snapshot = "/etc/estus/app_config.schema.json", role_path = "/etc/estus/app_config.schema.roles/app_config", no_log = false }
fixed_args = { config_root = "/srv/example-app" }
input_map = { instance = "instance", config = "config" }
limits = { timeout_secs = 30 }

[tools.app_config.input_schema]
type = "object"
required = ["instance", "config"]
additionalProperties = false

[tools.app_config.input_schema.properties.instance]
type = "string"
minLength = 1
maxLength = 512

[tools.app_config.input_schema.properties.config]
type = "object"
required = ["banner", "enabled"]
additionalProperties = false
properties = { banner = { type = "string", maxLength = 2048 }, enabled = { type = "boolean" }, port = { type = "integer", minimum = 1024, maximum = 65535 } }
if = { properties = { enabled = { const = true } }, required = ["enabled"] }
then = { required = ["port"] }

[tools.app_config.result]
kind = "ansible_projection"
fields = { instance = ["mcp_result", "instance"], path = ["mcp_result", "path"], checksum = ["mcp_result", "checksum"], verified = ["mcp_result", "verified"] }
max_bytes = 4096
max_items = 32
max_depth = 4
schema = { type = "object", properties = { instance = { type = "string", maxLength = 512 }, path = { type = "string", maxLength = 4096 }, checksum = { type = "string", minLength = 64, maxLength = 64 }, verified = { type = "boolean", const = true } }, required = ["instance", "path", "checksum", "verified"], additionalProperties = false }
