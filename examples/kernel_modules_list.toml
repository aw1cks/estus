# Explicit standalone opt-in. Observe bounded real loaded module size, references, state and holder names from procfs. Module presence is not device health; collection is not atomic.
# Copy roles/kernel_modules_list to /etc/estus/roles/kernel_modules_list; review every file.
# Export this tool's input_schema/fixed_args/input_map to overlay.json, then:
# estus --config kernel_modules_list.toml schema import-role kernel_modules_list --role-path /etc/estus/roles/kernel_modules_list --overlay overlay.json --output /etc/estus/kernel_modules_list.schema.json
# Import is offline; review snapshot before startup activation. No implicit install/escalation.
# Provision /var/lib/estus/runner mode0700 for MCP; install optional pinned Runner runtime.
# Target prerequisites: Linux /usr/bin/python3; boot tools require actual EFI/systemd-boot + bootctl;
# module tools require installed kmod modinfo/modprobe and reviewed dummy/estus_catalog modules.
# estus_catalog is a harmless operator-installed fixture module, value:int mode0644; not auto-installed.
# Exact approved entries are estus-current.conf and estus-alternate.conf; change reviewed schema AND role to deploy elsewhere.
profile = "actions-only"
enabled_tools = ["kernel_modules_list"]

[targets.server]
ssh_host = "server-ordinary"

[automation]
workspace_root = "/var/lib/estus/runner"
max_concurrent = 2
max_scratch_bytes = 16777216
max_scratch_files = 512

[automation.targets.server]
destination = "server-ordinary"
python = "/usr/bin/python3"

[tools.kernel_modules_list]
description = "Observe bounded real loaded module size, references, state and holder names from procfs. Module presence is not device health; collection is not atomic."
revision = "1"
targets = ["server"]
authority = "automation"
effects = ["read"]
execution = { kind = "ansible_role", snapshot = "/etc/estus/kernel_modules_list.schema.json", role_path = "/etc/estus/roles/kernel_modules_list", no_log = false }
fixed_args = { target_python = "/usr/bin/python3" }
input_map = { "offset" = "offset" }
limits = { timeout_secs = 60 }
input_schema = { "type" = "object", "properties" = { "offset" = { "type" = "integer", "minimum" = 0, "maximum" = 512 } }, "required" = [], "additionalProperties" = false }
result = { kind = "ansible_projection", fields = { "boot_id" = ["mcp_result", "boot_id"], "source" = ["mcp_result", "source"], "unavailable" = ["mcp_result", "unavailable"], "observed_at" = ["mcp_result", "observed_at"], "modules" = ["mcp_result", "modules"], "total_count" = ["mcp_result", "total_count"], "next_offset" = ["mcp_result", "next_offset"], "scope" = ["mcp_result", "scope"] }, max_bytes = 4096, max_items = 256, max_depth = 8, schema = { "type" = "object", "properties" = { "boot_id" = { "type" = "string", "minLength" = 36, "maxLength" = 36 }, "source" = { "type" = "string", "maxLength" = 128 }, "unavailable" = { "type" = "array", "maxItems" = 32, "items" = { "type" = "string", "maxLength" = 128 } }, "observed_at" = { "type" = "string", "maxLength" = 32 }, "modules" = { "type" = "array", "maxItems" = 8, "items" = { "type" = "object", "properties" = { "name" = { "type" = "string", "maxLength" = 64 }, "size_bytes" = { "type" = "integer", "minimum" = 0, "maximum" = 9007199254740991 }, "references" = { "type" = "integer", "minimum" = 0, "maximum" = 9007199254740991 }, "holders" = { "type" = "array", "maxItems" = 128, "items" = { "type" = "string", "maxLength" = 64 } }, "state" = { "type" = "string", "maxLength" = 32 } }, "required" = ["name", "size_bytes", "references", "holders", "state"], "additionalProperties" = false } }, "total_count" = { "type" = "integer", "minimum" = 0, "maximum" = 512 }, "next_offset" = { "type" = "integer", "minimum" = -1, "maximum" = 512 }, "scope" = { "type" = "string", "maxLength" = 128 } }, "required" = ["boot_id", "source", "unavailable", "observed_at", "modules", "total_count", "next_offset", "scope"], "additionalProperties" = false } }
