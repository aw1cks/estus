# Reviewed Linux-only journal_boots_list; logs can contain secrets; no arbitrary paths/code/flags.
# Copy roles/journal_boots_list to /etc/estus/roles/journal_boots_list, review all tasks, export
# input_schema/fixed_args/input_map as overlay.json, then import offline:
# estus --config journal_boots_list.toml schema import-role journal_boots_list --role-path /etc/estus/roles/journal_boots_list --overlay overlay.json --output /etc/estus/journal_boots_list.schema.json
# Review snapshot before activation; provision /var/lib/estus/runner mode 0700.
# Install pinned Python3 and the fixed utilities used below; no auto-install.
profile = "actions-only"
enabled_tools = ["journal_boots_list"]
[targets.server]
ssh_host = "server-ordinary"
[automation]
workspace_root = "/var/lib/estus/runner"
max_concurrent = 2
max_scratch_bytes = 16777216
max_scratch_files = 512
[automation.targets.server]
destination = "server-ordinary"
python = "/usr/bin/python3"
# Separate reviewed root automation identity; independent of native sudo allowlists.
[automation.authorities.catalog]
ssh_config_file = "/etc/estus/catalog-ssh.conf"
become = { method = "sudo", user = "root" }
[automation.authorities.catalog.targets.server]
destination = "server-catalog"
python = "/usr/bin/python3"
[tools.journal_boots_list]
description = "List bounded retained boot histories with source timestamps. Retention/access may omit older boots; no deletion."
revision = "1"
targets = ["server"]
authority = "automation:catalog"
effects = ["read"]
execution = { kind = "ansible_role", snapshot = "/etc/estus/journal_boots_list.schema.json", role_path = "/etc/estus/journal_boots_list.schema.roles/journal_boots_list", no_log = false }
fixed_args = { "target_python" = "/usr/bin/python3" }
input_map = { "limit" = "limit" }
limits = { timeout_secs = 40 }
input_schema = { "type" = "object", "properties" = { "limit" = { "type" = "integer", "minimum" = 1, "maximum" = 8 } }, "required" = ["limit"], "additionalProperties" = false }
[tools.journal_boots_list.result]
kind = "ansible_projection"
fields = { "boots" = ["mcp_result", "boots"], "incomplete" = ["mcp_result", "incomplete"], "truncated" = ["mcp_result", "truncated"] }
max_bytes = 4096
max_items = 256
max_depth = 8
schema = { "type" = "object", "properties" = { "boots" = { "type" = "array", "items" = { "type" = "object", "properties" = { "index" = { "type" = "integer", "minimum" = -2147483648, "maximum" = 2147483647 }, "boot_id" = { "type" = "string", "maxLength" = 32 }, "retained_range_text" = { "type" = "string", "maxLength" = 256 } }, "required" = ["index", "boot_id", "retained_range_text"], "additionalProperties" = false }, "maxItems" = 8 }, "incomplete" = { "type" = "boolean", "const" = true }, "truncated" = { "type" = "boolean" } }, "required" = ["boots", "incomplete", "truncated"], "additionalProperties" = false }
