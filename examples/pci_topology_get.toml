# Opt-in: copy roles/pci_topology_get to /etc/estus/roles/pci_topology_get; export input_schema,
# fixed_args and input_map as overlay.json. Review the offline imported snapshot:
# estus --config pci_topology_get.toml schema import-role pci_topology_get --role-path /etc/estus/roles/pci_topology_get --overlay overlay.json --output /etc/estus/pci_topology_get.schema.json
# Provision mode0700 /var/lib/estus/runner, Python3 and declared inspection utilities.
# Numeric full-address PCI observation; bounded sysfs only, no exhaustive configuration-space access or external name lookup. Unknown fields explicit.
profile = "actions-only"
enabled_tools = ["pci_topology_get"]
[targets.server]
ssh_host = "server-ordinary"
[automation]
workspace_root = "/var/lib/estus/runner"
max_concurrent = 2
max_scratch_bytes = 16777216
max_scratch_files = 512
[automation.targets.server]
destination = "server-ordinary"
python = "/usr/bin/python3"
[tools.pci_topology_get]
description = "Numeric full-address PCI observation; bounded sysfs only, no exhaustive configuration-space access or external name lookup. Unknown fields explicit."
revision = "1"
targets = ["server"]
authority = "automation"
effects = ["read"]
execution = { kind = "ansible_role", snapshot = "/etc/estus/pci_topology_get.schema.json", role_path = "/etc/estus/pci_topology_get.schema.roles/pci_topology_get", no_log = false }
fixed_args = { target_python = "/usr/bin/python3" }
input_map = {  }
limits = { timeout_secs = 30 }
input_schema = { "type" = "object", "properties" = {  }, "required" = [], "additionalProperties" = false }
[tools.pci_topology_get.result]
kind = "ansible_projection"
fields = { "source" = ["mcp_result", "source"], "observed_at" = ["mcp_result", "observed_at"], "unavailable" = ["mcp_result", "unavailable"], "nodes" = ["mcp_result", "nodes"] , truncated = ["mcp_result", "truncated"], omitted_records = ["mcp_result", "omitted_records"] }
max_bytes = 4096
max_items = 256
max_depth = 8
schema = { "type" = "object", "properties" = { truncated = { type = "boolean" }, omitted_records = { type = "integer", minimum = 0, maximum = 9007199254740991 }, "source" = { "type" = "string", "maxLength" = 256 }, "observed_at" = { "type" = "string", "maxLength" = 64 }, "unavailable" = { "type" = "array", "items" = { "type" = "string", "maxLength" = 128 }, "maxItems" = 256 }, "nodes" = { "type" = "array", "items" = { "type" = "object", "properties" = { "address" = { "type" = "string", "maxLength" = 12 }, "ancestors" = { "type" = "array", "items" = { "type" = "string", "maxLength" = 12 }, "maxItems" = 32 } }, "required" = ["address", "ancestors"], "additionalProperties" = false }, "maxItems" = 256 } }, "required" = ["source", "observed_at", "unavailable", "nodes"], "additionalProperties" = false }
