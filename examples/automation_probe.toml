# Offline bundle probe: run one reviewed module from an operator-built bundle.
# Build the bundle once outside the server lifecycle, then inspect it before use:
#   estus bundle build --python /opt/ansible/bin/python --output /etc/estus/bundle
#   estus bundle inspect --bundle /etc/estus/bundle
# Point [automation].bundle at that directory (or set ESTUS_ANSIBLE_BUNDLE).
# No Python or Ansible runs during MCP startup or tool execution.
# MCP input: {"host":"server","inputs":{}}
mode = "headless"
capabilities = { named = true }
[selection]
allow = ["automation_probe"]

[targets.server]
ssh_host = "server-ordinary"

[automation]
bundle = "/etc/estus/bundle"
max_concurrent = 2

[automation.targets.server]
destination = "server-ordinary"
python = "/usr/bin/python3"

[tools.automation_probe]
description = "Run the bundle's ansible.builtin.ping module with fixed data on an approved ordinary target. Requires target Python; this is not ICMP or an application health check. Interrupted work is never replayed."
revision = "2"
targets = ["server"]
authority = "automation"
effects = ["probe"]
execution = { kind = "ansible_module", module = "ansible.builtin.ping", no_log = false }
input_schema = { type = "object", properties = {}, additionalProperties = false }
fixed_args = { data = "pong" }
input_map = {}
result = { kind = "ansible_summary" }
limits = { timeout_secs = 10 }
