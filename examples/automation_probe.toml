# Import ansible.builtin.ping from the selected runtime into the reviewed snapshot
# before enabling. Provision the workspace as mode 0700, owned by the MCP account.
# Run through .#automation-msrv or an installed wheel with its ansible extra.
# MCP input: {"host":"server","inputs":{}}
mode = "headless"
capabilities = { named = true }
enabled_tools = ["automation_probe"]

[targets.server]
ssh_host = "server-ordinary"

[automation]
workspace_root = "/var/lib/estus/runner"
max_concurrent = 2
max_scratch_bytes = 16777216
max_scratch_files = 512

[automation.targets.server]
destination = "server-ordinary"
python = "/usr/bin/python3"

[tools.automation_probe]
description = "Run the real Ansible ping module with fixed data on an approved ordinary target. Requires target Python; this is not ICMP or an application health check. Interrupted work is never replayed."
revision = "1"
targets = ["server"]
authority = "automation"
effects = ["probe"]
execution = { kind = "ansible_module", snapshot = "/etc/estus/ping.schema.json", no_log = false }
input_schema = { type = "object", properties = {}, additionalProperties = false }
fixed_args = { data = "pong" }
input_map = {}
result = { kind = "ansible_summary" }
limits = { timeout_secs = 10 }
