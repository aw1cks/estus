<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 230" width="720" height="230" role="img" aria-labelledby="title desc">
  <title id="title">How Estus works</title>
  <desc id="desc">An agent or MCP client talks to estus over MCP on stdio. estus checks each call against your TOML policy and runs it on hosts such as web-1 and db-1 through your OpenSSH.</desc>
  <style>
    .box { fill: #f6f8fa; stroke: #59636e; stroke-width: 1.5; }
    .main { fill: #ddf4ff; stroke: #0969da; }
    .text { fill: #1f2328; font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; text-anchor: middle; dominant-baseline: central; }
    .strong { font-weight: 600; }
    .label { fill: #59636e; font-size: 13px; }
    .edge { stroke: #59636e; stroke-width: 1.5; fill: none; }
    .dashed { stroke-dasharray: 5 4; }
    .head { fill: #59636e; }
    @media (prefers-color-scheme: dark) {
      .box { fill: #151b23; stroke: #9198a1; }
      .main { fill: #0c2d6b; stroke: #4493f8; }
      .text { fill: #f0f6fc; }
      .label { fill: #9198a1; }
      .edge { stroke: #9198a1; }
      .head { fill: #9198a1; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <!-- Agent → estus -->
  <rect class="box" x="10" y="70" width="190" height="50" rx="8"/>
  <text class="text" x="105" y="95">Agent / MCP client</text>
  <path class="edge" d="M200,95 H318" marker-end="url(#arrow)"/>
  <text class="text label" x="259" y="80">MCP over stdio</text>

  <!-- estus -->
  <rect class="box main" x="320" y="70" width="120" height="50" rx="8"/>
  <text class="text strong" x="380" y="95">estus</text>

  <!-- estus → hosts -->
  <path class="edge" d="M440,85 C500,85 520,45 578,45" marker-end="url(#arrow)"/>
  <path class="edge" d="M440,105 C500,105 520,145 578,145" marker-end="url(#arrow)"/>
  <text class="text label" x="510" y="95">your OpenSSH</text>
  <rect class="box" x="580" y="20" width="130" height="50" rx="8"/>
  <text class="text" x="645" y="45">web-1</text>
  <rect class="box" x="580" y="120" width="130" height="50" rx="8"/>
  <text class="text" x="645" y="145">db-1</text>

  <!-- policy → estus -->
  <rect class="box" x="300" y="170" width="160" height="44" rx="22"/>
  <text class="text" x="380" y="192">your policy (TOML)</text>
  <path class="edge dashed" d="M380,170 V122" marker-end="url(#arrow)"/>
</svg>
